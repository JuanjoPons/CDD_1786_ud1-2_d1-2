je, indico la fecha, hora y modalidad de la reunión, adjunto el enlace de acceso a la videoconferencia y el enlace al documento colaborativo.","• En el cos del missatge, indique la data, l'hora i la modalitat de la reunió, i adjunte l'enllaç d'accés a la videoconferència i l'enllaç al document col·laboratiu."],["• Solicito confirmación de asistencia mediante respuesta al correo, para poder anticipar el número de participantes.","• Sol·licite confirmació d'assistència mitjançant resposta al correu, per a poder preveure el nombre de participants."],["• Programo, si el sistema lo permite, un recordatorio automático que se envíe 24 horas antes de la reunión a todos los convocados.","• Programe, si el sistema ho permet, un recordatori automàtic que s'envie 24 hores abans de la reunió a tots els convocats."]],"type":"teacher","origin":"manual","time":["20 min","20 min"],"timeManual":["20 minutos","20 minuts"],"kind":["Caso práctico","Cas pràctic"],"group":["Individual","Individual"],"mode":["Presencial o telemática, con acceso a ordenador o dispositivo móvil.","Presencial o telemàtica, amb accés a ordinador o dispositiu mòbil."],"ce":["Utilización de herramientas de comunicación institucional y coordinación documental colaborativa","Utilització d'eines de comunicació institucional i coordinació documental col·laborativa"],"title":["Actividad 1. Convocar una reunión de coordinación","Activitat 1. Convocar una reunió de coordinació"],"instr":["El docente responsable del departamento de Electricidad y Automatización debe convocar una reunión de coordinación para revisar la programación didáctica del próximo trimestre. Elabore, paso a paso, el procedimiento que seguiría para: a) crear el evento de videoconferencia en el calendario institucional, b) generar un documento colaborativo compartido con el resto del equipo docente, y c) establecer un sistema de notificación por correo electrónico corporativo que avise de la convocatoria.","El docent responsable del departament d'Electricitat i Automatització ha de convocar una reunió de coordinació per a revisar la programació didàctica del pròxim trimestre. Elabore, pas a pas, el procediment que seguiria per a: a) crear l'esdeveniment de videoconferència en el calendari institucional, b) generar un document col·laboratiu compartit amb la resta de l'equip docent, i c) establir un sistema de notificació per correu electrònic corporatiu que avise de la convocatòria."],"fields":[["a) Procedimiento, paso a paso, para crear el evento de videoconferencia en el calendario institucional.","a) Procediment, pas a pas, per a crear l'esdeveniment de videoconferència en el calendari institucional."],["b) Procedimiento para generar un documento colaborativo compartido con el resto del equipo docente.","b) Procediment per a generar un document col·laboratiu compartit amb la resta de l'equip docent."],["c) Procedimiento para establecer un sistema de notificación por correo electrónico corporativo que avise de la convocatoria.","c) Procediment per a establir un sistema de notificació per correu electrònic corporatiu que avise de la convocatòria."]],"block":"S2","ra":"RA1"}],"notes":[],"cover":{"signs":[["info","globe",["Web del centro","Web del centre"]],["info","laptop",["Entornos virtuales","Entorns virtuals"]],["info","share",["Redes corporativas","Xarxes corporatives"]],["must","mail",["Canales corporativos","Canals corporatius"]],["safe","cloud",["Gmail + Meet + Drive","Gmail + Meet + Drive"]]],"lead":["El uso de herramientas corporativas, frente a los canales personales, garantiza la trazabilidad, la protección de datos y la coherencia institucional.","L'ús d'eines corporatives, enfront dels canals personals, garanteix la traçabilitat, la protecció de dades i la coherència institucional."]},"art":"mail"},{"id":"S3","ud":"RA1","title":["Etiqueta digital y participación en órganos de coordinación docente","Etiqueta digital i participació en òrgans de coordinació docent"],"meta":{"ra_fp":"RA1"},"sections":[{"num":4,"kind":"theory","title":["Etiqueta digital y participación en órganos de coordinación docente","Etiqueta digital i participació en òrgans de coordinació docent"],"nodes":[{"t":"p","x":["Además de la comunicación con el alumnado y con el entorno externo, el profesorado de los grados A, B y C participa de forma habitual en los órganos colegiados de gobierno y coordinación docente del centro, tales como el claustro, la comisión de coordinación pedagógica, los departamentos didácticos o los equipos educativos. La incorporación de tecnologías digitales a estos espacios de coordinación ha transformado significativamente su funcionamiento, permitiendo una comunicación más ágil, un seguimiento más sistemático de los acuerdos adoptados y una mayor facilidad para compartir documentación entre los miembros del equipo docente.","A més de la comunicació amb l'alumnat i amb l'entorn extern, el professorat dels graus A, B i C participa de manera habitual en els òrgans col·legiats de govern i coordinació docent del centre, com ara el claustre, la comissió de coordinació pedagògica, els departaments didàctics o els equips educatius. La incorporació de tecnologies digitals a aquests espais de coordinació n'ha transformat significativament el funcionament, i ha permés una comunicació més àgil, un seguiment més sistemàtic dels acords adoptats i una facilitat més gran per a compartir documentació entre els membres de l'equip docent."]},{"t":"p","x":["La participación en estos órganos a través de medios digitales adopta formas muy diversas. Por un lado, existen reuniones en modalidad virtual o semipresencial, celebradas mediante sistemas de videoconferencia, que permiten la participación de docentes que, por razones de distancia, horario o circunstancias personales, no podrían asistir de manera presencial. Por otro lado, se emplean plataformas colaborativas de gestión documental, en las que se comparten actas, programaciones didácticas, memorias de evaluación y otros documentos institucionales, facilitando el acceso simultáneo y la edición conjunta por parte de distintos miembros del equipo. Asimismo, se utilizan canales de mensajería y comunicación interna para la coordinación cotidiana entre docentes, la resolución ágil de incidencias o la organización de actividades conjuntas.","La participació en aquests òrgans a través de mitjans digitals adopta formes molt diverses. D'una banda, hi ha reunions en modalitat virtual o semipresencial, celebrades mitjançant sistemes de videoconferència, que permeten la participació de docents que, per raons de distància, horari o circumstàncies personals, no podrien assistir-hi de manera presencial. D'altra banda, s'empren plataformes col·laboratives de gestió documental, en què es comparteixen actes, programacions didàctiques, memòries d'avaluació i altres documents institucionals, i que faciliten l'accés simultani i l'edició conjunta per part de diferents membres de l'equip. Així mateix, s'utilitzen canals de missatgeria i comunicació interna per a la coordinació quotidiana entre docents, la resolució àgil d'incidències o l'organització d'activitats conjuntes."]},{"t":"viz","v":{"type":"cards","title":["Formas de participación digital en los órganos de coordinación","Formes de participació digital en els òrgans de coordinació"],"items":[{"i":"video","s":"info","x":["Reuniones en modalidad virtual o semipresencial","Reunions en modalitat virtual o semipresencial"]},{"i":"folder","s":"info","x":["Plataformas colaborativas de gestión documental","Plataformes col·laboratives de gestió documental"]},{"i":"chat","s":"info","x":["Canales de mensajería y comunicación interna","Canals de missatgeria i comunicació interna"]}]}},{"t":"p","x":["La aplicación de las normas de etiqueta digital adquiere en este contexto una relevancia especial, dado que las relaciones profesionales entre compañeros y compañeras de claustro exigen un cuidado particular. Entre los aspectos que conviene observar se encuentran los siguientes: la puntualidad en la conexión a las sesiones virtuales, la activación de la cámara cuando así se solicite para favorecer la comunicación no verbal, la solicitud de turno de palabra mediante los mecanismos habilitados por la plataforma, la evitación de intervenciones simultáneas que dificulten la comprensión del debate, y el mantenimiento de un tono constructivo en los intercambios escritos, especialmente en aquellos casos en que puedan surgir discrepancias profesionales.","L'aplicació de les normes d'etiqueta digital adquireix en aquest context una rellevància especial, atés que les relacions professionals entre companys i companyes de claustre exigeixen una cura particular. Entre els aspectes que convé observar hi ha els següents: la puntualitat en la connexió a les sessions virtuals, l'activació de la càmera quan així se sol·licite per a afavorir la comunicació no verbal, la sol·licitud de torn de paraula mitjançant els mecanismes habilitats per la plataforma, l'evitació d'intervencions simultànies que dificulten la comprensió del debat, i el manteniment d'un to constructiu en els intercanvis escrits, especialment en aquells casos en què puguen sorgir discrepàncies professionals."]},{"t":"viz","v":{"type":"scene","scene":"videocall","title":["Reunión de departamento por videoconferencia","Reunió de departament per videoconferència"],"spots":[{"px":356,"py":40,"t":["La puntualidad en la conexión a las sesiones virtuales.","La puntualitat en la connexió a les sessions virtuals."]},{"px":194,"py":46,"t":["La activación de la cámara cuando así se solicite para favorecer la comunicación no verbal.","L'activació de la càmera quan així se sol·licite per a afavorir la comunicació no verbal."]},{"px":146,"py":104,"t":["La solicitud de turno de palabra mediante los mecanismos habilitados por la plataforma.","La sol·licitud de torn de paraula mitjançant els mecanismes habilitats per la plataforma."]},{"px":252,"py":112,"t":["La evitación de intervenciones simultáneas que dificulten la comprensión del debate.","L'evitació d'intervencions simultànies que dificulten la comprensió del debat."]},{"px":303,"py":115,"t":["El mantenimiento de un tono constructivo en los intercambios escritos, especialmente en aquellos casos en que puedan surgir discrepancias profesionales.","El manteniment d'un to constructiu en els intercanvis escrits, especialment en aquells casos en què puguen sorgir discrepàncies professionals."]}]}},{"t":"p","x":["La coordinación docente mediada por tecnologías digitales no se limita a la relación entre profesorado del mismo centro. También resulta relevante la relación con los servicios de orientación educativa y profesional, con los que el profesorado de los grados A, B y C debe mantener una comunicación fluida para el adecuado seguimiento del alumnado, especialmente en lo relativo a necesidades específicas de apoyo educativo, orientación académico-profesional o seguimiento de casos concretos. Igualmente relevante es la relación digital con instituciones del entorno, entre las que cabe destacar empresas colaboradoras en la formación dual, administraciones educativas, entidades de certificación profesional u otros centros educativos con los que se establecen proyectos de colaboración.","La coordinació docent mediada per tecnologies digitals no es limita a la relació entre professorat del mateix centre. També resulta rellevant la relació amb els serveis d'orientació educativa i professional, amb els quals el professorat dels graus A, B i C ha de mantenir una comunicació fluida per a l'adequat seguiment de l'alumnat, especialment pel que fa a necessitats específiques de suport educatiu, orientació acadèmica i professional o seguiment de casos concrets. Igualment rellevant és la relació digital amb institucions de l'entorn, entre les quals cal destacar empreses col·laboradores en la formació dual, administracions educatives, entitats de certificació professional o altres centres educatius amb què s'estableixen projectes de col·laboració."]},{"t":"p","x":["Un elemento adicional que conviene abordar en este epígrafe es la necesidad de que el profesorado desarrolle una reflexión continuada sobre su propia práctica pedagógica digital. Esta reflexión se articula a menudo a través de procesos de investigación-acción, entendidos como ciclos sistemáticos de observación, planificación, actuación y evaluación que permiten al docente identificar áreas de mejora en el uso de las tecnologías en el aula y en el centro. La participación en comunidades de práctica, grupos de trabajo interdisciplinares o proyectos de innovación educativa constituye una vía privilegiada para desarrollar esta reflexión de manera colaborativa, compartiendo experiencias con otros profesionales y contrastando estrategias que hayan resultado eficaces en distintos contextos formativos.","Un element addicional que convé abordar en aquest epígraf és la necessitat que el professorat desenvolupe una reflexió continuada sobre la seua pròpia pràctica pedagògica digital. Aquesta reflexió s'articula sovint a través de processos d'investigació-acció, entesos com a cicles sistemàtics d'observació, planificació, actuació i avaluació que permeten al docent identificar àrees de millora en l'ús de les tecnologies a l'aula i al centre. La participació en comunitats de pràctica, grups de treball interdisciplinaris o projectes d'innovació educativa constitueix una via privilegiada per a desenvolupar aquesta reflexió de manera col·laborativa, compartint experiències amb altres professionals i contrastant estratègies que hagen resultat eficaces en diferents contextos formatius."]},{"t":"p","x":["Esta capacidad reflexiva se completa con la disposición del profesorado a integrar de manera continuada nuevos conocimientos sobre medios digitales y tecnológicos, adaptándolos a las distintas modalidades de impartición existentes en el Sistema de Formación Profesional: presencial, semipresencial y a través de tecnologías digitales en entornos virtuales. Esta actualización permanente no debe entenderse como una carga añadida a la labor docente, sino como una dimensión intrínseca del desarrollo profesional continuo, coherente con la propia naturaleza dinámica de las tecnologías digitales.","Aquesta capacitat reflexiva es completa amb la disposició del professorat a integrar de manera continuada nous coneixements sobre mitjans digitals i tecnològics, adaptant-los a les diferents modalitats d'impartició existents en el Sistema de Formació Professional: presencial, semipresencial i a través de tecnologies digitals en entorns virtuals. Aquesta actualització permanent no s'ha d'entendre com una càrrega afegida a la tasca docent, sinó com una dimensió intrínseca del desenvolupament professional continu, coherent amb la mateixa naturalesa dinàmica de les tecnologies digitals."]}],"acts":["S3-etq","S3-A2","S3-A2bis"],"videos":[]}],"final":[],"acts":[{"id":"S3-etq","type":"classify","time":["8 min","8 min"],"title":["¿Respeta la etiqueta digital?","Respecta l'etiqueta digital?"],"instr":["Decide si cada conducta en una reunión o en un canal de coordinación respeta o incumple las normas de etiqueta digital de los epígrafes 2 y 4.","Decideix si cada conducta en una reunió o en un canal de coordinació respecta o incompleix les normes d'etiqueta digital dels epígrafs 2 i 4."],"cats":[["Respeta la etiqueta digital","Respecta l'etiqueta digital"],["Incumple la etiqueta digital","Incompleix l'etiqueta digital"]],"items":[{"x":["Conectarse a la sesión virtual a la hora convocada.","Connectar-se a la sessió virtual a l'hora convocada."],"c":0,"exp":["La puntualidad en la conexión es una de las normas.","La puntualitat en la connexió és una de les normes."]},{"x":["Mantener la cámara apagada aunque la dirección haya pedido activarla.","Mantindre la càmera apagada encara que la direcció haja demanat activar-la."],"c":1,"exp":["Se debe activar la cámara cuando así se solicite.","S'ha d'activar la càmera quan així se sol·licite."]},{"x":["Pedir la palabra con la función «levantar la mano» de la plataforma.","Demanar la paraula amb la funció «alçar la mà» de la plataforma."],"c":0,"exp":["Solicitar turno mediante los mecanismos habilitados por la plataforma.","Sol·licitar torn mitjançant els mecanismes habilitats per la plataforma."]},{"x":["Hablar a la vez que otra compañera para dar antes la propia opinión.","Parlar alhora que una altra companya per a donar abans la pròpia opinió."],"c":1,"exp":["Hay que evitar intervenciones simultáneas que dificulten la comprensión del debate.","Cal evitar intervencions simultànies que dificulten la comprensió del debat."]},{"x":["Responder por el chat con frases cortantes cuando hay una discrepancia.","Respondre pel xat amb frases tallants quan hi ha una discrepància."],"c":1,"exp":["Se debe mantener un tono constructivo en los intercambios escritos.","S'ha de mantindre un to constructiu en els intercanvis escrits."]},{"x":["Revisar el mensaje antes de enviarlo al equipo docente.","Revisar el missatge abans d'enviar-lo a l'equip docent."],"c":0,"exp":["La revisión cuidadosa del contenido antes del envío es una norma básica (epígrafe 2).","La revisió acurada del contingut abans de l'enviament és una norma bàsica (epígraf 2)."]},{"x":["Usar el canal corporativo para coordinarse con el servicio de orientación.","Usar el canal corporatiu per a coordinar-se amb el servei d'orientació."],"c":0,"exp":["La comunicación con orientación debe ser fluida y por canales institucionales.","La comunicació amb orientació ha de ser fluida i per canals institucionals."]},{"x":["Reenviar a un grupo personal datos de un alumno con necesidades de apoyo.","Reenviar a un grup personal dades d'un alumne amb necessitats de suport."],"c":1,"exp":["Vulnera el respeto a la privacidad de terceras personas.","Vulnera el respecte a la privacitat de terceres persones."]}],"block":"S3","origin":"complementaria","ra":"RA1","ce":""},{"id":"S3-A2","type":"teacher","origin":"manual","time":["37 min (redacción 22 min + debate 15 min)","37 min (redacció 22 min + debat 15 min)"],"timeManual":["1 hora","1 hora"],"kind":["Caso práctico de reflexión y debate","Cas pràctic de reflexió i debat"],"group":["Individual, con posterior puesta en común grupal","Individual, amb posada en comú grupal posterior"],"mode":["Presencial o virtual","Presencial o virtual"],"ce":"c), d), e)","title":["Actividad 2. Una reunión de coordinación por videoconferencia","Activitat 2. Una reunió de coordinació per videoconferència"],"instr":["Imagina que formas parte del departamento de una familia profesional en un centro de Formación Profesional y que, en una reunión de coordinación celebrada por videoconferencia, uno de tus compañeros interrumpe repetidamente las intervenciones de otros miembros del equipo, no activa la cámara pese a haber sido solicitado por la dirección del centro, y responde con brevedad y cierta brusquedad a las preguntas planteadas por el resto del claustro. Redacta, de forma individual, un breve texto argumentativo, de aproximadamente veinte líneas, en el que expliques qué normas de etiqueta digital se estarían incumpliendo en esta situación, qué consecuencias podría tener este comportamiento para el funcionamiento del órgano de coordinación, y qué medidas propondrías, desde tu papel como docente del equipo, para reconducir la situación de manera respetuosa. Posteriormente, comparte tu propuesta en un debate grupal moderado por el profesorado, contrastando las distintas soluciones planteadas por el resto de compañeros y compañeras.","Imagina que formes part del departament d'una família professional en un centre de Formació Professional i que, en una reunió de coordinació celebrada per videoconferència, un dels teus companys interromp repetidament les intervencions d'altres membres de l'equip, no activa la càmera tot i haver-ho sol·licitat la direcció del centre, i respon amb brevetat i certa brusquedat a les preguntes plantejades per la resta del claustre. Redacta, de manera individual, un breu text argumentatiu, d'aproximadament vint línies, en què expliques quines normes d'etiqueta digital s'estarien incomplint en aquesta situació, quines conseqüències podria tenir aquest comportament per al funcionament de l'òrgan de coordinació, i quines mesures proposaries, des del teu paper com a docent de l'equip, per a reconduir la situació de manera respectuosa. Posteriorment, comparteix la teua proposta en un debat grupal moderat pel professorat, contrastant les diferents solucions plantejades per la resta de companys i companyes."],"fields":[["Normas de etiqueta digital que se estarían incumpliendo.","Normes d'etiqueta digital que s'estarien incomplint."],["Consecuencias que podría tener este comportamiento para el funcionamiento del órgano de coordinación.","Conseqüències que podria tenir aquest comportament per al funcionament de l'òrgan de coordinació."],["Medidas que propondrías, desde tu papel como docente del equipo, para reconducir la situación de manera respetuosa.","Mesures que proposaries, des del teu paper com a docent de l'equip, per a reconduir la situació de manera respectuosa."],["Conclusiones del debate grupal (soluciones de otros compañeros y compañeras que te parecen útiles).","Conclusions del debat grupal (solucions d'altres companys i companyes que et semblen útils)."]],"rubric":["Extensión orientativa del texto argumentativo: unas veinte líneas en total.","Extensió orientativa del text argumentatiu: unes vint línies en total."],"solution":[["En la situación descrita se incumplen varias normas básicas de etiqueta digital explicadas en este epígrafe. En primer lugar, la interrupción reiterada de las intervenciones de otros miembros del equipo vulnera la norma de evitar intervenciones simultáneas que dificulten la comprensión del debate y de solicitar el turno de palabra mediante los mecanismos habilitados por la plataforma. En segundo lugar, la falta de activación de la cámara pese a haber sido solicitada por la dirección supone un incumplimiento de la norma que recomienda favorecer la comunicación no verbal en las reuniones virtuales, especialmente relevante en un órgano de coordinación en el que la confianza y la claridad comunicativa resultan esenciales. En tercer lugar, la brevedad y brusquedad en las respuestas contraviene el mantenimiento de un tono constructivo, particularmente necesario cuando puedan surgir discrepancias profesionales entre compañeros de claustro.","En la situació descrita s'incompleixen diverses normes bàsiques d'etiqueta digital explicades en aquest epígraf. En primer lloc, la interrupció reiterada de les intervencions d'altres membres de l'equip vulnera la norma d'evitar intervencions simultànies que dificulten la comprensió del debat i de sol·licitar el torn de paraula mitjançant els mecanismes habilitats per la plataforma. En segon lloc, la falta d'activació de la càmera tot i haver-la sol·licitada la direcció suposa un incompliment de la norma que recomana afavorir la comunicació no verbal en les reunions virtuals, especialment rellevant en un òrgan de coordinació en què la confiança i la claredat comunicativa resulten essencials. En tercer lloc, la brevetat i la brusquedat en les respostes contravé el manteniment d'un to constructiu, particularment necessari quan puguen sorgir discrepàncies professionals entre companys de claustre."],["Estas conductas pueden tener consecuencias negativas para el funcionamiento del órgano de coordinación: dificultan la fluidez del debate, generan una percepción de escaso compromiso o de falta de respeto hacia el resto del equipo, y pueden erosionar progresivamente la confianza necesaria para una coordinación docente eficaz.","Aquestes conductes poden tenir conseqüències negatives per al funcionament de l'òrgan de coordinació: dificulten la fluïdesa del debat, generen una percepció d'escàs compromís o de falta de respecte cap a la resta de l'equip, i poden erosionar progressivament la confiança necessària per a una coordinació docent eficaç."],["Como medida de reconducción, un docente del equipo podría, en primer lugar, solicitar de forma respetuosa y en un momento adecuado —preferiblemente fuera de la propia reunión, para no generar una situación incómoda en público— una conversación individual con el compañero, explicándole el efecto que sus intervenciones están teniendo en la dinámica del grupo. En segundo lugar, podría proponerse a la persona que modera la reunión que recuerde al inicio de cada sesión las normas básicas de participación acordadas por el equipo. En tercer lugar, resultaría recomendable reforzar, desde el propio ejemplo, un tono constructivo y respetuoso en las intervenciones propias, favoreciendo así una dinámica de grupo que, de forma progresiva, incentive comportamientos similares en el resto de participantes.","Com a mesura de reconducció, un docent de l'equip podria, en primer lloc, sol·licitar de manera respectuosa i en un moment adequat —preferiblement fora de la mateixa reunió, per a no generar una situació incòmoda en públic— una conversa individual amb el company, explicant-li l'efecte que les seues intervencions estan tenint en la dinàmica del grup. En segon lloc, es podria proposar a la persona que modera la reunió que recorde a l'inici de cada sessió les normes bàsiques de participació acordades per l'equip. En tercer lloc, resultaria recomanable reforçar, des del propi exemple, un to constructiu i respectuós en les intervencions pròpies, afavorint així una dinàmica de grup que, de manera progressiva, incentive comportaments similars en la resta de participants."]],"block":"S3","ra":"RA1"},{"id":"S3-A2bis","solution":[["Las conductas descritas incumplen, en primer lugar, la norma de avisar antes de modificar contenido compartido por otras personas, que puede considerarse una extensión de la etiqueta digital al trabajo colaborativo asincrónico. En segundo lugar, la eliminación de aportaciones ajenas sin justificación vulnera el respeto debido al trabajo de otros miembros del equipo, un principio implícito en cualquier código de conducta profesional digital. En tercer lugar, la falta de respuesta a comentarios y preguntas durante varios días incumple la norma de responder en plazos razonables a las comunicaciones institucionales.","Les conductes descrites incompleixen, en primer lloc, la norma d'avisar abans de modificar contingut compartit per altres persones, que es pot considerar una extensió de l'etiqueta digital al treball col·laboratiu asincrònic. En segon lloc, l'eliminació d'aportacions alienes sense justificació vulnera el respecte degut al treball d'altres membres de l'equip, un principi implícit en qualsevol codi de conducta professional digital. En tercer lloc, la falta de resposta a comentaris i preguntes durant diversos dies incompleix la norma de respondre en terminis raonables a les comunicacions institucionals."],["Estas conductas pueden generar desconfianza en el uso de la herramienta colaborativa, duplicidad de trabajo al no saber qué versión es la válida, y un deterioro del clima de cooperación del departamento. Como medida de reconducción, se valorará positivamente que el alumno proponga: establecer con el compañero un canal directo de conversación antes de recurrir a terceros; acordar en equipo unas normas mínimas de uso de la herramienta colaborativa (avisar antes de cambios sustanciales, plazo máximo de respuesta a comentarios); y, si la situación persistiera, trasladarlo de forma constructiva a quien coordina el departamento.","Aquestes conductes poden generar desconfiança en l'ús de l'eina col·laborativa, duplicitat de treball perquè no se sap quina versió és la vàlida, i un deteriorament del clima de cooperació del departament. Com a mesura de reconducció, es valorarà positivament que l'alumne propose: establir amb el company un canal directe de conversa abans de recórrer a terceres persones; acordar en equip unes normes mínimes d'ús de l'eina col·laborativa (avisar abans de canvis substancials, termini màxim de resposta a comentaris); i, si la situació persistira, traslladar-ho de manera constructiva a qui coordina el departament."]],"type":"teacher","origin":"manual","time":["Fuera de la sesión (actividad alternativa o de refuerzo)","Fora de la sessió (activitat alternativa o de reforç)"],"timeManual":["1 hora","1 hora"],"kind":["Caso práctico de reflexión y debate","Cas pràctic de reflexió i debat"],"group":["Individual, con posterior puesta en común grupal","Individual, amb posada en comú grupal posterior"],"mode":["Presencial o virtual","Presencial o virtual"],"ce":"c), d), e)","title":["Actividad 2 bis. Un documento compartido de programación","Activitat 2 bis. Un document compartit de programació"],"instr":["Imagina que participas en una reunión de departamento celebrada mediante una plataforma colaborativa de gestión documental, en la que se está elaborando de forma conjunta la programación didáctica del curso. Uno de tus compañeros modifica repetidamente el documento compartido sin avisar previamente al resto del equipo, elimina aportaciones de otros miembros sin justificación, y no responde a los comentarios ni a las preguntas que se le plantean por escrito en el propio documento durante varios días. Redacta, de forma individual, un breve texto argumentativo, de aproximadamente veinte líneas, en el que expliques qué normas de etiqueta digital se estarían incumpliendo en esta situación, qué consecuencias podría tener este comportamiento para el trabajo colaborativo del departamento, y qué medidas propondrías, desde tu papel como docente del equipo, para reconducir la situación de manera respetuosa. Comparte después tu propuesta en un debate grupal moderado por el profesorado.","Imagina que participes en una reunió de departament celebrada mitjançant una plataforma col·laborativa de gestió documental, en la qual s'està elaborant de manera conjunta la programació didàctica del curs. Un dels teus companys modifica repetidament el document compartit sense avisar prèviament la resta de l'equip, elimina aportacions d'altres membres sense justificació, i no respon als comentaris ni a les preguntes que se li plantegen per escrit en el mateix document durant diversos dies. Redacta, de manera individual, un breu text argumentatiu, d'aproximadament vint línies, en què expliques quines normes d'etiqueta digital s'estarien incomplint en aquesta situació, quines conseqüències podria tenir aquest comportament per al treball col·laboratiu del departament, i quines mesures proposaries, des del teu paper com a docent de l'equip, per a reconduir la situació de manera respectuosa. Comparteix després la teua proposta en un debat grupal moderat pel professorat."],"fields":[["Normas de etiqueta digital que se estarían incumpliendo.","Normes d'etiqueta digital que s'estarien incomplint."],["Consecuencias que podría tener este comportamiento para el trabajo colaborativo del departamento.","Conseqüències que podria tenir aquest comportament per al treball col·laboratiu del departament."],["Medidas que propondrías para reconducir la situación de manera respetuosa.","Mesures que proposaries per a reconduir la situació de manera respectuosa."]],"rubric":["Extensión orientativa: unas veinte líneas.","Extensió orientativa: unes vint línies."],"block":"S3","ra":"RA1"}],"notes":[],"cover":{"signs":[["info","video",["Reuniones virtuales","Reunions virtuals"]],["info","folder",["Gestión documental compartida","Gestió documental compartida"]],["info","chat",["Mensajería interna","Missatgeria interna"]],["must","handshake",["Etiqueta digital","Etiqueta digital"]]],"lead":["Las relaciones profesionales entre compañeros y compañeras de claustro exigen un cuidado particular.","Les relacions professionals entre companys i companyes de claustre exigeixen una cura particular."]},"art":"video"},{"id":"S4","ud":"RA1","title":["Reflexión sobre la práctica digital y evaluación final del RA1","Reflexió sobre la pràctica digital i avaluació final del RA1"],"meta":{"ra_fp":"RA1"},"sections":[{"num":5,"kind":"theory","title":["Reflexión sobre la práctica digital: investigación-acción y formación continua","Reflexió sobre la pràctica digital: investigació-acció i formació contínua"],"nodes":[{"t":"p","x":["El último epígrafe de este capítulo aborda con mayor profundidad el proceso mediante el cual el profesorado transforma su experiencia práctica en conocimiento profesional aplicable a la mejora continua de su labor docente. Este proceso, característico de las profesiones educativas, adquiere una relevancia particular cuando se aplica al ámbito de la competencia digital, dado el carácter cambiante de las tecnologías y la necesidad de adaptar constantemente las estrategias pedagógicas empleadas.","L'últim epígraf d'aquest capítol aborda amb més profunditat el procés mitjançant el qual el professorat transforma la seua experiència pràctica en coneixement professional aplicable a la millora contínua de la seua tasca docent. Aquest procés, característic de les professions educatives, adquireix una rellevància particular quan s'aplica a l'àmbit de la competència digital, atés el caràcter canviant de les tecnologies i la necessitat d'adaptar constantment les estratègies pedagògiques emprades."]},{"t":"p","x":["La investigación-acción constituye una metodología de trabajo profesional que combina la práctica docente cotidiana con un proceso sistemático de observación y análisis orientado a la mejora. A diferencia de la investigación académica tradicional, la investigación-acción se desarrolla desde dentro de la propia práctica, por y para quienes la ejercen, con el objetivo explícito de transformarla. Aplicada al ámbito digital, este proceso permite al docente identificar, por ejemplo, qué herramientas digitales resultan más eficaces para determinados objetivos de aprendizaje, qué dificultades encuentra el alumnado en el uso de determinadas plataformas, o qué estrategias de comunicación digital favorecen una mayor participación del alumnado en las actividades formativas.","La investigació-acció constitueix una metodologia de treball professional que combina la pràctica docent quotidiana amb un procés sistemàtic d'observació i anàlisi orientat a la millora. A diferència de la recerca acadèmica tradicional, la investigació-acció es desenvolupa des de dins de la mateixa pràctica, per i per a qui l'exerceix, amb l'objectiu explícit de transformar-la. Aplicat a l'àmbit digital, aquest procés permet al docent identificar, per exemple, quines eines digitals resulten més eficaces per a determinats objectius d'aprenentatge, quines dificultats troba l'alumnat en l'ús de determinades plataformes, o quines estratègies de comunicació digital afavoreixen una participació més gran de l'alumnat en les activitats formatives."]},{"t":"viz","v":{"type":"cycle","title":["El ciclo de investigación-acción","El cicle d'investigació-acció"],"center":["Mejora de la práctica digital","Millora de la pràctica digital"],"items":[{"i":"search","s":"info","x":["Identificación de una situación de mejora","Identificació d'una situació de millora"]},{"i":"calendar","s":"info","x":["Planificación de una intervención","Planificació d'una intervenció"]},{"i":"laptop","s":"info","x":["Puesta en práctica","Posada en pràctica"]},{"i":"eye","s":"info","x":["Observación sistemática","Observació sistemàtica"]},{"i":"cycle","s":"safe","x":["Evaluación y reformulación","Avaluació i reformulació"]}]}},{"t":"p","x":["El proceso de investigación-acción suele estructurarse en ciclos que incluyen, de manera recurrente, las siguientes fases: en primer lugar, la identificación de una situación de mejora, esto es, un aspecto concreto de la práctica digital docente que se considera susceptible de perfeccionamiento; en segundo lugar, la planificación de una intervención, que puede consistir en la incorporación de una nueva herramienta, la modificación de una estrategia comunicativa o el rediseño de un recurso digital; en tercer lugar, la puesta en práctica de dicha intervención en el contexto real del aula o del centro; en cuarto lugar, la observación sistemática de los efectos producidos por la intervención, recogiendo evidencias a través de distintos instrumentos, como cuestionarios al alumnado, registros de participación o análisis de resultados académicos; y, finalmente, la evaluación y reformulación de la práctica, que puede dar lugar a un nuevo ciclo de mejora sobre el mismo aspecto o sobre otros relacionados.","El procés d'investigació-acció sol estructurar-se en cicles que inclouen, de manera recurrent, les fases següents: en primer lloc, la identificació d'una situació de millora, és a dir, un aspecte concret de la pràctica digital docent que es considera susceptible de perfeccionament; en segon lloc, la planificació d'una intervenció, que pot consistir en la incorporació d'una nova eina, la modificació d'una estratègia comunicativa o el redisseny d'un recurs digital; en tercer lloc, la posada en pràctica d'aquesta intervenció en el context real de l'aula o del centre; en quart lloc, l'observació sistemàtica dels efectes produïts per la intervenció, recollint evidències a través de diferents instruments, com ara qüestionaris a l'alumnat, registres de participació o anàlisi de resultats acadèmics; i, finalment, l'avaluació i reformulació de la pràctica, que pot donar lloc a un nou cicle de millora sobre el mateix aspecte o sobre altres de relacionats."]},{"t":"p","x":["Este proceso reflexivo individual se enriquece de manera notable cuando se comparte con otros profesionales, dando lugar a lo que se conoce como comunidades de práctica digital. Estas comunidades, que pueden desarrollarse tanto dentro del propio centro educativo como a través de redes profesionales más amplias, permiten al profesorado contrastar experiencias, resolver dudas técnicas y pedagógicas, y acceder a recursos y buenas prácticas desarrolladas por otros docentes que afrontan retos similares. La participación activa en estas comunidades constituye, además, una vía privilegiada para contribuir a la mejora de la competencia digital de otros compañeros y compañeras del equipo docente, generando así un efecto multiplicador que trasciende la práctica individual.","Aquest procés reflexiu individual s'enriqueix de manera notable quan es comparteix amb altres professionals, i dona lloc al que es coneix com a comunitats de pràctica digital. Aquestes comunitats, que es poden desenvolupar tant dins del mateix centre educatiu com a través de xarxes professionals més àmplies, permeten al professorat contrastar experiències, resoldre dubtes tècnics i pedagògics, i accedir a recursos i bones pràctiques desenvolupades per altres docents que afronten reptes similars. La participació activa en aquestes comunitats constitueix, a més, una via privilegiada per a contribuir a la millora de la competència digital d'altres companys i companyes de l'equip docent, generant així un efecte multiplicador que transcendeix la pràctica individual."]},{"t":"viz","v":{"type":"scene","scene":"training","title":["Los profesores también deben someterse a una formación permanente","Els professors també s'han de sotmetre a una formació permanent"],"note":["Ilustración que sustituye a la fotografía del manual con el mismo pie.","Il·lustració que substitueix la fotografia del manual amb el mateix peu."]}},{"t":"p","x":["Finalmente, conviene destacar que la reflexión sobre la práctica digital docente debe integrarse en un marco más amplio de formación permanente del profesorado. Los rápidos cambios tecnológicos exigen una actitud de aprendizaje continuo que se materializa en la participación en cursos de formación, la consulta de recursos educativos abiertos, la lectura de publicaciones especializadas o la asistencia a jornadas y congresos sobre innovación educativa digital. Esta formación continuada debe entenderse no como una obligación administrativa, sino como un compromiso ético con la calidad de la enseñanza que se imparte, en la medida en que un profesorado desactualizado en el ámbito digital difícilmente podrá preparar a su alumnado para desenvolverse con solvencia en un entorno profesional y social crecientemente digitalizado.","Finalment, convé destacar que la reflexió sobre la pràctica digital docent s'ha d'integrar en un marc més ampli de formació permanent del professorat. Els ràpids canvis tecnològics exigeixen una actitud d'aprenentatge continu que es materialitza en la participació en cursos de formació, la consulta de recursos educatius oberts, la lectura de publicacions especialitzades o l'assistència a jornades i congressos sobre innovació educativa digital. Aquesta formació continuada s'ha d'entendre no com una obligació administrativa, sinó com un compromís ètic amb la qualitat de l'ensenyament que s'imparteix, en la mesura que un professorat desactualitzat en l'àmbit digital difícilment podrà preparar el seu alumnat per a desenvolupar-se amb solvència en un entorn professional i social creixentment digitalitzat."]},{"t":"viz","v":{"type":"cards","title":["Vías de formación permanente que cita el manual","Vies de formació permanent que cita el manual"],"items":[{"i":"learn","s":"safe","x":["Cursos de formación","Cursos de formació"]},{"i":"share","s":"safe","x":["Recursos educativos abiertos","Recursos educatius oberts"]},{"i":"book","s":"safe","x":["Publicaciones especializadas","Publicacions especialitzades"]},{"i":"megaphone","s":"safe","x":["Jornadas y congresos de innovación educativa digital","Jornades i congressos d'innovació educativa digital"]}]}},{"t":"links","title":null,"items":[{"i":"learn","x":["INTEF · Competencia Digital Educativa","INTEF · Competència Digital Educativa"],"d":["Portal del Ministerio sobre la competencia digital del profesorado.","Portal del Ministeri sobre la competència digital del professorat (en castellà)."],"url":"https://intef.es/competencia-digital-educativa/"},{"i":"share","x":["Procomún (INTEF)","Procomún (INTEF)"],"d":["Repositorio de recursos educativos abiertos.","Repositori de recursos educatius oberts."],"url":"https://procomun.intef.es/"}]}],"acts":["S4-ciclo","S4-A3"],"videos":[]},{"num":6,"kind":"selfcheck","title":["Autoevaluación · Evaluación final del RA1","Autoavaluació · Avaluació final del RA1"],"nodes":[{"t":"p","x":["Responde a las diez preguntas de la autoevaluación del manual. La web corrige al momento y guarda el mejor resultado y el último intento para el informe.","Respon a les deu preguntes de l'autoavaluació del manual. La web corregeix al moment i guarda el millor resultat i l'últim intent per a l'informe."]}],"acts":["S4-EVAL"],"videos":[]}],"final":[],"acts":[{"id":"S4-ciclo","type":"order","time":["4 min","4 min"],"title":["Ordena el ciclo de investigación-acción","Ordena el cicle d'investigació-acció"],"items":[["Identificación de una situación de mejora","Identificació d'una situació de millora"],["Planificación de una intervención","Planificació d'una intervenció"],["Puesta en práctica de la intervención en el aula o el centro","Posada en pràctica de la intervenció a l'aula o al centre"],["Observación sistemática de los efectos","Observació sistemàtica dels efectes"],["Evaluación y reformulación de la práctica","Avaluació i reformulació de la pràctica"]],"exp":["Epígrafe 5: la evaluación y reformulación puede dar lugar a un nuevo ciclo de mejora.","Epígraf 5: l'avaluació i reformulació pot donar lloc a un nou cicle de millora."],"block":"S4","origin":"complementaria","ra":"RA1","ce":""},{"id":"S4-A3","solution":[["(Propuesta de mejora según ciclo de investigación-acción)","(Proposta de millora segons el cicle d'investigació-acció)"],["Como ejemplo de referencia para la corrección: situación de partida — el docente detecta que buena parte del alumnado no revisa los comentarios de retroalimentación que deja en el entorno virtual de aprendizaje tras cada actividad. Planificación de la intervención — incorporar, junto a cada comentario escrito, una breve nota de audio de menos de un minuto, y solicitar al alumnado una respuesta breve confirmando que lo ha revisado. Observación de los efectos — registrar durante tres semanas el porcentaje de alumnado que confirma la revisión y comparar con el periodo anterior. Indicadores de mejora — porcentaje de confirmaciones recibidas, y valoración cualitativa del alumnado sobre la utilidad del nuevo formato de retroalimentación, recogida mediante un breve cuestionario final. Se debe valorar que las cuatro fases estén presentes y bien diferenciadas, y que los indicadores propuestos sean efectivamente medibles.","Com a exemple de referència per a la correcció: situació de partida — el docent detecta que bona part de l'alumnat no revisa els comentaris de retroalimentació que deixa en l'entorn virtual d'aprenentatge després de cada activitat. Planificació de la intervenció — incorporar, al costat de cada comentari escrit, una breu nota d'àudio de menys d'un minut, i demanar a l'alumnat una resposta breu que confirme que l'ha revisat. Observació dels efectes — registrar durant tres setmanes el percentatge d'alumnat que confirma la revisió i comparar-lo amb el període anterior. Indicadors de millora — percentatge de confirmacions rebudes, i valoració qualitativa de l'alumnat sobre la utilitat del nou format de retroalimentació, recollida mitjançant un breu qüestionari final. S'ha de valorar que les quatre fases hi siguen presents i ben diferenciades, i que els indicadors proposats siguen efectivament mesurables."]],"type":"teacher","origin":"manual","time":["25 min","25 min"],"timeManual":["40 minutos","40 minuts"],"kind":["Actividad de síntesis y reflexión escrita","Activitat de síntesi i reflexió escrita"],"group":["Individual","Individual"],"mode":["Presencial o virtual","Presencial o virtual"],"ce":"e), f)","title":["Actividad 3. Mi propuesta de mejora con investigación-acción","Activitat 3. La meua proposta de millora amb investigació-acció"],"instr":["Piensa en un aspecto concreto de tu futura práctica docente relacionado con el uso de tecnologías digitales que consideres susceptible de mejora, por ejemplo, la forma de comunicarte con el alumnado a través del entorno virtual de aprendizaje, el uso de una herramienta digital determinada en el aula, o la gestión de la comunicación con las familias. Diseña, siguiendo el esquema de ciclo de investigación-acción explicado en este epígrafe, una propuesta breve de mejora que incluya los siguientes elementos: descripción de la situación de partida, planificación de la intervención que llevarías a cabo, forma en que observarías sus efectos, e indicadores que emplearías para valorar si la mejora ha sido efectiva. Presenta tu propuesta por escrito, con una extensión aproximada de una página.","Pensa en un aspecte concret de la teua futura pràctica docent relacionat amb l'ús de tecnologies digitals que consideres susceptible de millora, per exemple, la manera de comunicar-te amb l'alumnat a través de l'entorn virtual d'aprenentatge, l'ús d'una eina digital determinada a l'aula, o la gestió de la comunicació amb les famílies. Dissenya, seguint l'esquema de cicle d'investigació-acció explicat en aquest epígraf, una proposta breu de millora que incloga els elements següents: descripció de la situació de partida, planificació de la intervenció que duries a terme, manera en què n'observaries els efectes, i indicadors que empraries per a valorar si la millora ha sigut efectiva. Presenta la teua proposta per escrit, amb una extensió aproximada d'una pàgina."],"fields":[["Descripción de la situación de partida.","Descripció de la situació de partida."],["Planificación de la intervención que llevarías a cabo.","Planificació de la intervenció que duries a terme."],["Forma en que observarías sus efectos.","Manera en què n'observaries els efectes."],["Indicadores que emplearías para valorar si la mejora ha sido efectiva.","Indicadors que empraries per a valorar si la millora ha sigut efectiva."]],"rubric":["Extensión aproximada: una página. Sigue el esquema del ciclo de investigación-acción del epígrafe 5.","Extensió aproximada: una pàgina. Segueix l'esquema del cicle d'investigació-acció de l'epígraf 5."],"block":"S4","ra":"RA1"},{"id":"S4-EVAL","type":"mcq","origin":"manual","time":["15 min","15 min"],"title":["Evaluación final del RA1 (autoevaluación del manual)","Avaluació final del RA1 (autoavaluació del manual)"],"kind":["Prueba objetiva de opción múltiple","Prova objectiva d'opció múltiple"],"group":["Individual","Individual"],"questions":[{"q":["Según el marco DigCompEdu, ¿en qué área se incluye el uso de tecnologías digitales para la comunicación y la participación en la vida organizativa del centro?","Segons el marc DigCompEdu, en quina àrea s'inclou l'ús de tecnologies digitals per a la comunicació i la participació en la vida organitzativa del centre?"],"opts":[["Enseñanza y aprendizaje.","Ensenyament i aprenentatge."],["Compromiso profesional.","Compromís professional."],["Empoderamiento de los discentes.","Apoderament dels discents."],["Evaluación.","Avaluació."]],"ans":1,"exp":["Epígrafe 1: el compromiso profesional incluye la comunicación, la colaboración y la participación en la vida organizativa del centro.","Epígraf 1: el compromís professional inclou la comunicació, la col·laboració i la participació en la vida organitzativa del centre."]},{"q":["La competencia digital docente debe entenderse principalmente como:","La competència digital docent s'ha d'entendre principalment com:"],"opts":[["Un fin en sí mismo, independiente de la finalidad pedagógica.","Una finalitat en si mateixa, independent de la finalitat pedagògica."],["Un medio al servicio de la mejora de los procesos de enseñanza y aprendizaje.","Un mitjà al servei de la millora dels processos d'ensenyament i aprenentatge."],["Una competencia exclusivamente técnica ajena a la reflexión pedagógica.","Una competència exclusivament tècnica aliena a la reflexió pedagògica."],["Un de canales personales.","Evitar l'ús de canals corporatius en favor de canals personals."]],"ans":2,"exp":["Epígrafe 2: la revisión cuidadosa del contenido antes de su envío o publicación es una norma básica de etiqueta digital.","Epígraf 2: la revisió acurada del contingut abans del seu enviament o publicació és una norma bàsica d'etiqueta digital."]},{"q":["La participación en órganos de coordinación docente mediante videoconferencia exige, entre otros aspectos:","La participació en òrgans de coordinació docent mitjançant videoconferència exigeix, entre altres aspectes:"],"opts":[["Evitar la solicitud de turno de palabra para agilizar el debate.","Evitar la sol·licitud de torn de paraula per a agilitzar el debat."],["Activar la cámara cuando así se solicite, para favorecer la comunicación no verbal.","Activar la càmera quan així se sol·licite, per a afavorir la comunicació no verbal."],["Mantener la conexión sin necesidad de puntualidad.","Mantenir la connexió sense necessitat de puntualitat."],["Intervenir de forma simultánea con otros participantes.","Intervenir de manera simultània amb altres participants."]],"ans":1,"exp":["Epígrafe 4: activar la cámara cuando así se solicite favorece la comunicación no verbal.","Epígraf 4: activar la càmera quan així se sol·licite afavoreix la comunicació no verbal."]},{"q":["La investigación-acción aplicada a la práctica digital docente se caracteriza por:","La investigació-acció aplicada a la pràctica digital docent es caracteritza per:"],"opts":[["Ser un proceso ajeno a la práctica cotidiana del aula.","Ser un procés aliè a la pràctica quotidiana de l'aula."],["Desarrollarse exclusivamente en el ámbito de la investigación académica.","Desenvolupar-se exclusivament en l'àmbit de la recerca acadèmica."],["Constituir un ciclo sistemático orientado a la mejora de la propia práctica.","Constituir un cicle sistemàtic orientat a la millora de la pròpia pràctica."],["Excluir la observación de los efectos de las intervenciones realizadas.","Excloure l'observació dels efectes de les intervencions realitzades."]],"ans":2,"exp":["Epígrafe 5: es un ciclo sistemático de observación y análisis orientado a la mejora de la propia práctica.","Epígraf 5: és un cicle sistemàtic d'observació i anàlisi orientat a la millora de la pròpia pràctica."]},{"q":["Las comunidades de práctica digital permiten al profesorado, fundamentalmente:","Les comunitats de pràctica digital permeten al professorat, fonamentalment:"],"opts":[["Trabajar de forma aislada sin contraste con otros docentes.","Treballar de manera aïllada sense contrast amb altres docents."],["Contrastar experiencias y acceder a buenas prácticas de otros profesionales.","Contrastar experiències i accedir a bones pràctiques d'altres professionals."],["Sustituir la formación permanente individual.","Substituir la formació permanent individual."],["Limitar la comunicación a aspectos exclusivamente técnicos.","Limitar la comunicació a aspectes exclusivament tècnics."]],"ans":1,"exp":["Epígrafe 5: permiten contrastar experiencias, resolver dudas y acceder a buenas prácticas de otros docentes.","Epígraf 5: permeten contrastar experiències, resoldre dubtes i accedir a bones pràctiques d'altres docents."]},{"q":["Las tecnologías digitales corporativas se emplean en el centro educativo, entre otros fines, para:","Les tecnologies digitals corporatives s'empren al centre educatiu, entre altres finalitats, per a:"],"opts":[["Sustituir de forma permanente la comunicación presencial con el alumnado.","Substituir de manera permanent la comunicació presencial amb l'alumnat."],["Gestionar aspectos organizativos, académicos y tutoriales de forma trazable.","Gestionar aspectes organitzatius, acadèmics i tutorials de manera traçable."],["Evitar el cumplimiento de la normativa de protección de datos.","Evitar el compliment de la normativa de protecció de dades."],["Publicar contenidos sin necesidad de revisión previa.","Publicar continguts sense necessitat de revisió prèvia."]],"ans":1,"exp":["Epígrafe 2: se emplean para la comunicación interna y la gestión organizativa, académica y tutorial de forma trazable.","Epígraf 2: s'empren per a la comunicació interna i la gestió organitzativa, acadèmica i tutorial de manera traçable."]},{"q":["La relación digital del profesorado con instituciones del entorno, como empresas colaboradoras en la formación dual, se enmarca en:","La relació digital del professorat amb institucions de l'entorn, com ara empreses col·laboradores en la formació dual, s'emmarca en:"],"opts":[["El área de compromiso profesional de la competencia digital docente.","L'àrea de compromís professional de la competència digital docent."],["Una función exclusivamente administrativa ajena al profesorado.","Una funció exclusivament administrativa aliena al professorat."],["Un ámbito no contemplado por la normativa de Formación Profesional.","Un àmbit no contemplat per la normativa de Formació Professional."],["Una tarea que no requiere coordinación institucional.","Una tasca que no requereix coordinació institucional."]],"ans":0,"exp":["Epígrafes 1 y 4: la relación con instituciones del entorno forma parte de la dimensión comunicativa e institucional (compromiso profesional).","Epígrafs 1 i 4: la relació amb institucions de l'entorn forma part de la dimensió comunicativa i institucional (compromís professional)."]},{"q":["La formación permanente del profesorado en el ámbito digital debe entenderse como:","La formació permanent del professorat en l'àmbit digital s'ha d'entendre com:"],"opts":[["Una obligación administrativa desconectada de la calidad de la enseñanza.","Una obligació administrativa desconnectada de la qualitat de l'ensenyament."],["Un compromiso ético vinculado a la calidad del proceso de enseñanza-aprendizaje.","Un compromís ètic vinculat a la qualitat del procés d'ensenyament-aprenentatge."],["Una tarea opcional sin relación con el ejercicio profesional.","Una tasca opcional sense relació amb l'exercici professional."],["Un proceso que concluye una vez finalizada la formación inicial del docente.","Un procés que conclou una vegada finalitzada la formació inicial del docent."]],"ans":1,"exp":["Epígrafe 5: es un compromiso ético con la calidad de la enseñanza, no una obligación administrativa.","Epígraf 5: és un compromís ètic amb la qualitat de l'ensenyament, no una obligació administrativa."]}],"block":"S4","ra":"RA1","ce":""}],"notes":[],"cover":{"signs":[["info","cycle",["Ciclo de investigación-acción","Cicle d'investigació-acció"]],["info","group",["Comunidades de práctica","Comunitats de pràctica"]],["safe","learn",["Formación permanente","Formació permanent"]],["must","checklist",["Evaluación final del RA1","Avaluació final del RA1"]]],"lead":["Un profesorado desactualizado en el ámbito digital difícilmente podrá preparar a su alumnado para un entorno crecientemente digitalizado.","Un professorat desactualitzat en l'àmbit digital difícilment podrà preparar el seu alumnat per a un entorn creixentment digitalitzat."]},"art":"cycle"},{"id":"S5","ud":"RA2","title":["Estrategias de búsqueda de información en entornos digitales","Estratègies de cerca d'informació en entorns digitals"],"meta":{"ra_fp":"RA2"},"sections":[{"num":0,"kind":"intro","title":["Búsqueda, selección y curación de contenidos digitales educativos","Cerca, selecció i curació de continguts digitals educatius"],"nodes":[{"t":"p","x":["Una de las tareas más frecuentes en la práctica docente actual consiste en localizar, valorar, adaptar y compartir contenidos digitales con fines educativos. La proliferación de fuentes de información en internet ha multiplicado las posibilidades de acceso a recursos didácticos, pero también ha incrementado la dificultad de discernir qué contenidos resultan pertinentes, fiables y ajustados a las necesidades formativas de cada grupo de alumnado. Este capítulo desarrolla las competencias necesarias para que el profesorado de los grados A, B y C sepa buscar, organizar, seleccionar, crear y compartir contenidos digitales educativos con criterio pedagógico, técnico y ético, respetando en todo momento la normativa vigente sobre propiedad intelectual.","Una de les tasques més freqüents en la pràctica docent actual consisteix a localitzar, valorar, adaptar i compartir continguts digitals amb finalitats educatives. La proliferació de fonts d'informació a internet ha multiplicat les possibilitats d'accés a recursos didàctics, però també ha incrementat la dificultat de discernir quins continguts resulten pertinents, fiables i ajustats a les necessitats formatives de cada grup d'alumnat. Aquest capítol desenvolupa les competències necessàries perquè el professorat dels graus A, B i C sàpia buscar, organitzar, seleccionar, crear i compartir continguts digitals educatius amb criteri pedagògic, tècnic i ètic, respectant en tot moment la normativa vigent sobre propietat intel·lectual."]}],"acts":[],"videos":[]},{"num":1,"kind":"theory","title":["Estrategias de búsqueda de información en entornos digitales","Estratègies de cerca d'informació en entorns digitals"],"nodes":[{"t":"p","x":["La búsqueda eficaz de información constituye el punto de partida de cualquier proceso de selección de contenidos digitales educativos. Aunque pueda parecer una destreza básica, dominada de forma intuitiva por la mayoría de los usuarios de internet, la búsqueda con fines didácticos exige un nivel de sistematización y de rigor superior al que habitualmente se emplea en la navegación cotidiana.","La cerca eficaç d'informació constitueix el punt de partida de qualsevol procés de selecció de continguts digitals educatius. Encara que puga semblar una destresa bàsica, dominada de manera intuïtiva per la majoria dels usuaris d'internet, la cerca amb finalitats didàctiques exigeix un nivell de sistematització i de rigor superior al que habitualment s'empra en la navegació quotidiana."]},{"t":"p","x":["El punto de partida de cualquier estrategia de búsqueda es la correcta identificación de motores de búsqueda adecuados a cada finalidad. Junto a los motores de búsqueda generalistas, de sobra conocidos, existen buscadores especializados en contenidos educativos, repositorios académicos, bancos de imágenes libres de derechos, plataformas de vídeo educativo o bases de datos sectoriales vinculadas a familias profesionales concretas. El profesorado debe conocer esta diversidad de fuentes y saber seleccionar en cada momento la más adecuada al tipo de contenido que necesita localizar, almacenando la información relevante en servidores web o repositorios institucionales que permitan su posterior recuperación y uso compartido con otros docentes.","El punt de partida de qualsevol estratègia de cerca és la correcta identificació de motors de cerca adequats a cada finalitat. Al costat dels motors de cerca generalistes, sobradament coneguts, hi ha cercadors especialitzats en continguts educatius, repositoris acadèmics, bancs d'imatges lliures de drets, plataformes de vídeo educatiu o bases de dades sectorials vinculades a famílies professionals concretes. El professorat ha de conéixer aquesta diversitat de fonts i saber seleccionar en cada moment la més adequada al tipus de contingut que necessita localitzar, emmagatzemant la informació rellevant en servidors web o repositoris institucionals que en permeten la recuperació posterior i l'ús compartit amb altres docents."]},{"t":"viz","v":{"type":"cards","title":["Fuentes que el profesorado debe conocer","Fonts que el professorat ha de conéixer"],"items":[{"i":"search","s":"info","x":["Motores de búsqueda generalistas","Motors de cerca generalistes"]},{"i":"learn","s":"info","x":["Buscadores especializados en contenidos educativos","Cercadors especialitzats en continguts educatius"]},{"i":"book","s":"info","x":["Repositorios académicos","Repositoris acadèmics"]},{"i":"eye","s":"info","x":["Bancos de imágenes libres de derechos","Bancs d'imatges lliures de drets"]},{"i":"video","s":"info","x":["Plataformas de vídeo educativo","Plataformes de vídeo educatiu"]},{"i":"factory","s":"info","x":["Bases de datos sectoriales de familias profesionales","Bases de dades sectorials de famílies professionals"]}]}},{"t":"p","x":["La búsqueda educativa exige, además, la capacidad de trabajar con diferentes formatos de contenidos: audio, vídeo, imágenes fijas, documentos textuales, infografías, recursos interactivos o materiales en formato de datos abiertos. Cada formato presenta ventajas y limitaciones específicas en función del objetivo de aprendizaje perseguido y del perfil del alumnado. Un contenido en formato audiovisual, por ejemplo, puede resultar especialmente útil para captar la atención en las fases iniciales de una unidad didáctica o para mostrar procedimientos técnicos que resultan difíciles de explicar mediante texto escrito, mientras que un documento textual estructurado puede ser más adecuado para el trabajo autónomo de profundización. Asimismo, la búsqueda debe adaptarse a los distintos dispositivos y medios de comunicación a través de los cuales el alumnado accederá a los contenidos, considerando aspectos como la compatibilidad con dispositivos móviles o la necesidad de conexión estable a internet, e implicando activamente al alumnado en las acciones formativas mediante su participación en la propia búsqueda y valoración de recursos, cuando así lo permita la metodología empleada.","La cerca educativa exigeix, a més, la capacitat de treballar amb diferents formats de continguts: àudio, vídeo, imatges fixes, documents textuals, infografies, recursos interactius o materials en format de dades obertes. Cada format presenta avantatges i limitacions específiques en funció de l'objectiu d'aprenentatge perseguit i del perfil de l'alumnat. Un contingut en format audiovisual, per exemple, pot resultar especialment útil per a captar l'atenció en les fases inicials d'una unitat didàctica o per a mostrar procediments tècnics que resulten difícils d'explicar mitjançant text escrit, mentre que un document textual estructurat pot ser més adequat per al treball autònom d'aprofundiment. Així mateix, la cerca s'ha d'adaptar als diferents dispositius i mitjans de comunicació a través dels quals l'alumnat accedirà als continguts, considerant aspectes com la compatibilitat amb dispositius mòbils o la necessitat de connexió estable a internet, i implicant activament l'alumnat en les accions formatives mitjançant la seua participació en la mateixa cerca i valoració de recursos, quan així ho permeta la metodologia emprada."]},{"t":"list","k":"ul","l":1,"items":[["Audio","Àudio"],["Vídeo","Vídeo"],["Imágenes fijas","Imatges fixes"],["Documentos textuales","Documents textuals"],["Infografías","Infografies"],["Recursos interactivos","Recursos interactius"],["Datos abiertos","Dades obertes"]],"start":1},{"t":"p","x":["Conviene distinguir, en este sentido, entre dos niveles de destreza en la búsqueda de información. Por un lado, existen habilidades digitales simples, vinculadas a la búsqueda de información genérica mediante el uso de palabras clave sencillas y la consulta de los primeros resultados ofrecidos por un motor de búsqueda convencional. Por otro lado, existen destrezas más específicas, propias de una búsqueda avanzada, que incluyen el uso de operadores booleanos, la aplicación de filtros por fecha, formato, licencia de uso o idioma, la consulta de bases de datos especializadas, o el empleo de sintaxis de búsqueda avanzada específica de cada plataforma. El desarrollo de esta segunda categoría de habilidades resulta especialmente relevante para el profesorado, dado que le permite acceder a fuentes de mayor calidad, actualidad y pertinencia pedagógica, superando la dependencia de los primeros resultados ofrecidos por los algoritmos de los motores de búsqueda generalistas, que no siempre priorizan el rigor o la validez educativa de los contenidos.","Convé distingir, en aquest sentit, entre dos nivells de destresa en la cerca d'informació. D'una banda, hi ha habilitats digitals simples, vinculades a la cerca d'informació genèrica mitjançant l'ús de paraules clau senzilles i la consulta dels primers resultats oferits per un motor de cerca convencional. D'altra banda, hi ha destreses més específiques, pròpies d'una cerca avançada, que inclouen l'ús d'operadors booleans, l'aplicació de filtres per data, format, llicència d'ús o idioma, la consulta de bases de dades especialitzades, o l'ús de sintaxi de cerca avançada específica de cada plataforma. El desenvolupament d'aquesta segona categoria d'habilitats resulta especialment rellevant per al professorat, atés que li permet accedir a fonts de més qualitat, actualitat i pertinència pedagògica, superant la dependència dels primers resultats oferits pels algorismes dels motors de cerca generalistes, que no sempre prioritzen el rigor o la validesa educativa dels continguts."]},{"t":"viz","v":{"type":"compare","vs":true,"title":["Dos niveles de destreza en la búsqueda","Dos nivells de destresa en la cerca"],"cols":[{"i":"search","s":"warn","x":["Habilidades digitales simples","Habilitats digitals simples"],"items":[["Palabras clave sencillas","Paraules clau senzilles"],["Primeros resultados de un motor convencional","Primers resultats d'un motor convencional"]]},{"i":"filter","s":"safe","x":["Destrezas más específicas (búsqueda avanzada)","Destreses més específiques (cerca avançada)"],"items":[["Operadores booleanos","Operadors booleans"],["Filtros por fecha, formato, licencia de uso o idioma","Filtres per data, format, llicència d'ús o idioma"],["Bases de datos especializadas","Bases de dades especialitzades"],["Sintaxis avanzada de cada plataforma","Sintaxi avançada de cada plataforma"]]}]}},{"t":"links","title":null,"items":[{"i":"filter","x":["Búsqueda avanzada de Google","Cerca avançada de Google"],"d":["Formulario con filtros de idioma, fecha, tipo de archivo y derechos de uso.","Formulari amb filtres d'idioma, data, tipus de fitxer i drets d'ús."],"url":"https://www.google.com/advanced_search"},{"i":"share","x":["Procomún (INTEF)","Procomún (INTEF)"],"d":["Repositorio de recursos educativos abiertos.","Repositori de recursos educatius oberts."],"url":"https://procomun.intef.es/"}]}],"acts":["S5-niveles","S5-A4"],"videos":[]}],"final":[],"acts":[{"id":"S5-niveles","type":"classify","time":["5 min","5 min"],"title":["¿Búsqueda simple o avanzada?","Cerca simple o avançada?"],"cats":[["Habilidad digital simple","Habilitat digital simple"],["Destreza de búsqueda avanzada","Destresa de cerca avançada"]],"items":[{"x":["Escribir dos palabras clave en un buscador y abrir el primer resultado.","Escriure dues paraules clau en un cercador i obrir el primer resultat."],"c":0,"exp":["Palabras clave sencillas y primeros resultados: búsqueda simple.","Paraules clau senzilles i primers resultats: cerca simple."]},{"x":["Combinar términos con operadores booleanos.","Combinar termes amb operadors booleans."],"c":1,"exp":["Los operadores booleanos son propios de la búsqueda avanzada.","Els operadors booleans són propis de la cerca avançada."]},{"x":["Filtrar los resultados por licencia de uso.","Filtrar els resultats per llicència d'ús."],"c":1,"exp":["Filtros por fecha, formato, licencia o idioma.","Filtres per data, format, llicència o idioma."]},{"x":["Consultar una base de datos especializada de la familia profesional.","Consultar una base de dades especialitzada de la família professional."],"c":1,"exp":["La consulta de bases de datos especializadas es una destreza específica.","La consulta de bases de dades especialitzades és una destresa específica."]},{"x":["Quedarse con lo que aparece en la primera página de resultados.","Quedar-se amb el que apareix a la primera pàgina de resultats."],"c":0,"exp":["Depender de los primeros resultados es propio de la búsqueda simple.","Dependre dels primers resultats és propi de la cerca simple."]},{"x":["Limitar los resultados a documentos de un formato concreto.","Limitar els resultats a documents d'un format concret."],"c":1,"exp":["Filtro por formato: búsqueda avanzada.","Filtre per format: cerca avançada."]}],"block":"S5","origin":"complementaria","ra":"RA2","ce":""},{"id":"S5-A4","solution":[["(Búsqueda genérica vs. avanzada)","(Cerca genèrica i cerca avançada)"],["Ejemplo de referencia sobre el contenido \"mantenimiento preventivo de instalaciones eléctricas\": la búsqueda genérica con palabras clave sencillas suele devolver como primeros resultados páginas comerciales de empresas del sector o entradas de blogs generalistas, con información poco sistematizada y sin indicación de fuente técnica contrastada. Al aplicar técnicas avanzadas —por ejemplo, filtrar por tipo de archivo PDF, restringir la búsqueda a dominios educativos o institucionales, o emplear operadores para excluir resultados comerciales— los nuevos resultados suelen incluir manuales técnicos, normativa aplicable o materiales de centros de formación profesional, de mayor rigor y actualidad. La comparación debe concluir que la búsqueda avanzada ofrece mayor fiabilidad y pertinencia pedagógica, aunque exige más tiempo y destreza técnica por parte del docente.","Exemple de referència sobre el contingut «manteniment preventiu d'instal·lacions elèctriques»: la cerca genèrica amb paraules clau senzilles sol retornar com a primers resultats pàgines comercials d'empreses del sector o entrades de blogs generalistes, amb informació poc sistematitzada i sense indicació de font tècnica contrastada. En aplicar tècniques avançades —per exemple, filtrar per tipus de fitxer PDF, restringir la cerca a dominis educatius o institucionals, o emprar operadors per a excloure resultats comercials— els nous resultats solen incloure manuals tècnics, normativa aplicable o materials de centres de formació professional, de més rigor i actualitat. La comparació ha de concloure que la cerca avançada ofereix més fiabilitat i pertinència pedagògica, encara que exigeix més temps i destresa tècnica per part del docent."]],"type":"teacher","origin":"manual","time":["35 min","35 min"],"timeManual":["50 minutos","50 minuts"],"kind":["Búsqueda de información avanzada","Cerca d'informació avançada"],"group":["Individual","Individual"],"mode":["Virtual, con equipo informático y conexión a internet","Virtual, amb equip informàtic i connexió a internet"],"ce":"a), b), c)","title":["Actividad 4. Búsqueda simple frente a búsqueda avanzada","Activitat 4. Cerca simple enfront de cerca avançada"],"instr":["Elige un contenido curricular concreto de tu familia profesional que pudieras necesitar explicar en una futura sesión formativa. Realiza, en primer lugar, una búsqueda genérica del tema empleando únicamente palabras clave sencillas en un buscador convencional, y anota los tres primeros resultados obtenidos. A continuación, repite la búsqueda empleando al menos dos técnicas de búsqueda avanzada (operadores booleanos, filtros de fecha o de licencia, consulta en un repositorio educativo especializado, entre otras), y anota los nuevos resultados obtenidos. Elabora una breve comparación escrita, de unas diez líneas, en la que valores las diferencias de calidad, actualidad y pertinencia pedagógica entre ambos conjuntos de resultados.","Tria un contingut curricular concret de la teua família professional que pogueres necessitar explicar en una futura sessió formativa. Fes, en primer lloc, una cerca genèrica del tema emprant únicament paraules clau senzilles en un cercador convencional, i anota els tres primers resultats obtinguts. A continuació, repeteix la cerca emprant almenys dues tècniques de cerca avançada (operadors booleans, filtres de data o de llicència, consulta en un repositori educatiu especialitzat, entre altres), i anota els nous resultats obtinguts. Elabora una breu comparació escrita, d'unes deu línies, en què valores les diferències de qualitat, actualitat i pertinència pedagògica entre tots dos conjunts de resultats."],"fields":[["Contenido curricular elegido (familia profesional y tema).","Contingut curricular triat (família professional i tema)."],["Búsqueda genérica: palabras clave usadas y tres primeros resultados obtenidos.","Cerca genèrica: paraules clau usades i tres primers resultats obtinguts."],["Búsqueda avanzada: técnicas empleadas (al menos dos) y nuevos resultados obtenidos.","Cerca avançada: tècniques emprades (almenys dues) i nous resultats obtinguts."],["Comparación escrita (unas diez líneas): diferencias de calidad, actualidad y pertinencia pedagógica.","Comparació escrita (unes deu línies): diferències de qualitat, actualitat i pertinència pedagògica."]],"block":"S5","ra":"RA2"}],"notes":[],"cover":{"signs":[["info","search",["Motores y fuentes","Motors i fonts"]],["info","layers",["Formatos de contenido","Formats de contingut"]],["info","laptop",["Dispositivos del alumnado","Dispositius de l'alumnat"]],["safe","filter",["Búsqueda avanzada","Cerca avançada"]]],"lead":["La búsqueda con fines didácticos exige un nivel de sistematización y de rigor superior al de la navegación cotidiana.","La cerca amb finalitats didàctiques exigeix un nivell de sistematització i de rigor superior al de la navegació quotidiana."]},"art":"search"},{"id":"S6","ud":"RA2","title":["Organización, catalogación y curación de contenidos: Symbaloo","Organització, catalogació i curació de continguts: Symbaloo"],"meta":{"ra_fp":"RA2"},"sections":[{"num":2,"kind":"theory","title":["Organización, catalogación y curación de contenidos educativos digitales","Organització, catalogació i curació de continguts educatius digitals"],"nodes":[{"t":"p","x":["Una vez localizados los contenidos digitales de interés, resulta imprescindible organizarlos de forma que puedan ser recuperados y reutilizados con facilidad en el futuro. La acumulación desordenada de recursos digitales, lejos de constituir una ventaja, se convierte con frecuencia en un obstáculo para la práctica docente, al dificultar la localización rápida del material necesario en cada momento.","Una vegada localitzats els continguts digitals d'interés, resulta imprescindible organitzar-los de manera que puguen ser recuperats i reutilitzats amb facilitat en el futur. L'acumulació desordenada de recursos digitals, lluny de constituir un avantatge, es converteix sovint en un obstacle per a la pràctica docent, ja que dificulta la localització ràpida del material necessari en cada moment."]},{"t":"p","x":["Para evitar este problema, el profesorado debe emplear sistemas de organización, catalogación y metadatos de los contenidos educativos digitales que gestiona. La catalogación consiste en clasificar los recursos siguiendo criterios coherentes y estables, como pueden ser la unidad didáctica a la que pertenecen, el resultado de aprendizaje que desarrollan, el formato del recurso o el nivel de dificultad al que se dirigen. Los metadatos, por su parte, son datos que describen otros datos: información como el autor del recurso, la fecha de creación, el idioma, la licencia de uso o las palabras clave asociadas, que facilitan tanto la búsqueda posterior como la correcta atribución de la autoría. Muchas plataformas educativas y repositorios institucionales incorporan campos específicos para introducir estos metadatos de forma sistemática, una práctica que el profesorado debe incorporar como parte de su rutina de trabajo digital.","Per a evitar aquest problema, el professorat ha d'emprar sistemes d'organització, catalogació i metadades dels continguts educatius digitals que gestiona. La catalogació consisteix a classificar els recursos seguint criteris coherents i estables, com poden ser la unitat didàctica a què pertanyen, el resultat d'aprenentatge que desenvolupen, el format del recurs o el nivell de dificultat a què es dirigeixen. Les metadades, per la seua banda, són dades que descriuen altres dades: informació com l'autor del recurs, la data de creació, l'idioma, la llicència d'ús o les paraules clau associades, que faciliten tant la cerca posterior com la correcta atribució de l'autoria. Moltes plataformes educatives i repositoris institucionals incorporen camps específics per a introduir aquestes metadades de manera sistemàtica, una pràctica que el professorat ha d'incorporar com a part de la seua rutina de treball digital."]},{"t":"viz","v":{"type":"compare","title":["Catalogación y metadatos","Catalogació i metadades"],"cols":[{"i":"folder","s":"info","x":["Catalogación","Catalogació"],"d":["Clasificar los recursos con criterios coherentes y estables:","Classificar els recursos amb criteris coherents i estables:"],"items":[["Unidad didáctica","Unitat didàctica"],["Resultado de aprendizaje","Resultat d'aprenentatge"],["Formato del recurso","Format del recurs"],["Nivel de dificultad","Nivell de dificultat"]]},{"i":"tag","s":"info","x":["Metadatos","Metadades"],"d":["Datos que describen otros datos:","Dades que descriuen altres dades:"],"items":[["Autor del recurso","Autor del recurs"],["Fecha de creación","Data de creació"],["Idioma","Idioma"],["Licencia de uso","Llicència d'ús"],["Palabras clave","Paraules clau"]]}]}},{"t":"p","x":["Estrechamente relacionada con la organización de contenidos se encuentra la práctica conocida como curación de contenidos, un concepto tomado del ámbito museístico y adaptado al entorno digital, que hace referencia al proceso de filtrar, seleccionar, organizar y compartir la información más relevante sobre un tema concreto, aportando valor añadido mediante la contextualización y el criterio experto de quien realiza la curación. A diferencia de la simple acumulación de enlaces o recursos, la curación de contenidos implica un trabajo activo de evaluación y filtrado, aplicando criterios como la calidad del contenido, su usabilidad, la fiabilidad de la fuente que lo publica y la veracidad de la información que transmite.","Estretament relacionada amb l'organització de continguts hi ha la pràctica coneguda com a curació de continguts, un concepte pres de l'àmbit museístic i adaptat a l'entorn digital, que fa re
