<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDPD · RA1–RA2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ds-allow-hardcode:start — full autònom: sense sistema de disseny extern; colors tokenitzats a :root */
:root{
  --ink:#10293a; --ink-2:#2c4556; --muted:#516776; --paper:#eef2f4; --surface:#ffffff; --line:#cfd9df; --line-2:#e3e9ec;
  --blue:#1d5aa0; --blue-bg:#e7eff9; --blue-ink:#123f73;
  --yellow:#f0c000; --yellow-bg:#fff5c7; --yellow-ink:#4a3a00;
  --green:#1b7343; --green-bg:#e3f3e9; --green-ink:#0f4d2b;
  --red:#b42318; --red-bg:#fdecea; --red-ink:#7a1710;
  --focus:#ff8a00;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --r-s:4px; --r-m:8px;
  --measure:72ch;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- capçalera ---------- */
.top{background:var(--ink);color:#fff}
.top-in{max-width:1240px;margin:0 auto;padding:14px 16px 0;display:grid;gap:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand-mark{flex:none;width:46px;height:46px}
.brand h1{font-size:1.65rem;font-weight:700}
.brand p{margin:0;color:#c3d3dc;font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #6d8796;border-radius:var(--r-s);overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:.35rem .7rem;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tbtn{background:transparent;border:1px solid #6d8796;color:#fff;border-radius:var(--r-s);padding:.35rem .7rem;cursor:pointer}
.tbtn:hover{border-color:#fff}
.tbtn.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:700}
.daybar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:#dbe6ec}
.daybar strong{color:#fff}
.student-chip{color:#fff;font-weight:700}
.student-chip.empty{color:#ffd48a;font-weight:400}

/* ruta de sessions */
.route{position:relative;display:flex;gap:0;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.route button{flex:1 0 auto;min-width:118px;background:transparent;border:0;border-top:4px solid transparent;color:#c3d3dc;
  padding:.55rem .8rem .7rem;text-align:left;cursor:pointer;display:grid;gap:2px}
.route button:hover{color:#fff}
.route button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-top-color:var(--yellow)}
.route .rid{font-family:var(--f-head);font-weight:700;font-size:1.25rem;line-height:1}
.route .rmeta{font-size:.78rem;display:flex;gap:6px;align-items:center}
.dotp{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.dotp.part{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.dotp.full{background:currentColor}

/* ---------- disposició ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 64px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.grid > *,.top-in > *{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.toc h2{font-size:1.05rem;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;gap:6px;padding:4px 6px;border-radius:var(--r-s);text-decoration:none;color:var(--ink-2)}
.toc li a:hover{background:var(--paper)}
.toc .tk{flex:none;width:8px;margin-top:8px;height:8px;border-radius:2px;background:var(--line)}
.toc .tk.activity,.toc .tk.selfcheck{background:var(--blue)}
.toc .tk.summary{background:var(--ink)}
.toc details{margin-top:4px}
.toc summary{cursor:pointer;min-height:28px;display:list-item;padding:2px 0}
@media (max-width:900px){.toc details:not([open]) ol{display:none}}

.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:1.5rem;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field textarea,.field select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.5rem .6rem;background:#fff;width:100%}
.field textarea{min-height:5.5rem;resize:vertical}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.req{color:var(--red)}

/* capçalera de sessió */
.shead{display:grid;gap:10px;margin-bottom:18px}
.shead .kicker{font-family:var(--f-head);font-size:1.15rem;color:var(--muted);font-weight:600}
.shead h2{font-size:clamp(2rem,4.2vw,3rem);font-weight:700;max-width:24ch}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.meta{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:.25rem .55rem;font-size:.86rem}
.meta b{font-weight:700}
.meta.warn{border-color:var(--yellow);background:var(--yellow-bg);color:var(--yellow-ink)}

/* seccions de contingut */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:14px;padding:18px 22px;scroll-margin-top:12px}
.sec > h3{font-size:1.45rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.sec > h3 .n{color:var(--muted);font-weight:600;min-width:1.6em}
.kindtag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-size:.78rem;font-weight:700;padding:.1rem .45rem;border-radius:var(--r-s);
  background:var(--paper);color:var(--ink-2);vertical-align:middle;margin-left:auto;white-space:nowrap}
.kindtag svg{width:14px;height:14px}
.sec.k-example{border-left:6px solid #6b8aa0}
.sec.k-objectives{border-left:6px solid var(--ink)}
.sec.k-summary{background:#f6f9fb;border-left:6px solid var(--ink)}
.sec.k-activity,.sec.k-selfcheck{border-left:6px solid var(--blue)}
.prose{max-width:none}
.prose > p,.prose > h4,.prose > ul:not(.bal),.prose > ol:not(.bal):not(.arrows),.prose > .flow,.prose > .box,.prose > .tablewrap{max-width:var(--measure)}
.prose p{margin:.45rem 0}
.prose h4{font-size:1.2rem;margin:1rem 0 .3rem;color:var(--ink-2)}
.prose ul,.prose ol{margin:.35rem 0 .6rem;padding-left:1.4rem}
.prose li{margin:.15rem 0}
.prose li::marker{color:var(--muted)}
.prose .l2{padding-left:2.6rem}
.prose .l0{padding-left:1.6rem}
.tablewrap{overflow-x:auto;margin:.7rem 0;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
thead th{background:var(--ink);color:#fff;font-weight:700}
tbody tr:nth-child(even) td{background:#f7f9fa}
.flow{display:grid;justify-items:start;gap:0;margin:.8rem 0;padding:.2rem 0}
.flow .st{border:2px solid var(--ink);border-radius:var(--r-s);padding:.3rem .7rem;font-weight:700;background:#fff;max-width:var(--measure)}
.flow .ar{width:2px;height:14px;background:var(--ink);margin-left:22px;position:relative}
.flow .ar::after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.flow .tx{padding:.15rem 0 .15rem .3rem;color:var(--ink-2)}
details.assess{margin-top:.4rem}
details.assess > summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.srcnote{font-size:.82rem;color:var(--muted);margin-top:.6rem}

/* vídeos */
.video{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px dashed #8aa0ad;border-radius:var(--r-m);padding:12px 14px;margin:12px 0;background:#f8fafb}
.video .vi{width:40px;height:40px;border-radius:var(--r-s);background:var(--ink);color:#fff;display:grid;place-items:center}
.video h4{font-size:1.15rem;margin-bottom:2px}
.video .vm{font-size:.86rem;color:var(--muted)}
.video .ver{font-weight:700;font-size:.8rem;padding:.05rem .35rem;border-radius:var(--r-s)}
.video .ver.ok{background:var(--green-bg);color:var(--green-ink)}
.video .ver.no{background:var(--yellow-bg);color:var(--yellow-ink)}

/* ---------- activitats ---------- */
.act{border:2px solid var(--line);border-radius:var(--r-m);margin:14px 0;background:#fff;overflow:hidden}
.act-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.act-h h4{font-size:1.25rem;flex:1 1 260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;padding:.2rem .5rem;border-radius:var(--r-s);white-space:nowrap}
.badge svg{width:16px;height:16px;flex:none}
.act.t-auto{border-color:var(--blue)} .act.t-auto .act-h{background:var(--blue-bg)} .b-auto{background:var(--blue);color:#fff}
.act.t-teacher{border-color:var(--yellow)} .act.t-teacher .act-h{background:var(--yellow-bg)} .b-teacher{background:var(--yellow);color:#231b00}
.act.t-class{border-color:var(--green)} .act.t-class .act-h{background:var(--green-bg)} .b-class{background:var(--green);color:#fff}
.b-origin{background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:400}
.act-b{padding:12px 14px}
.act-meta{font-size:.84rem;color:var(--muted);margin:0 0 8px}
.instr{margin:0 0 10px;max-width:var(--measure)}
.q{border-top:1px solid var(--line-2);padding:10px 0}
.q:first-of-type{border-top:0}
.q legend,.q .ql{font-weight:700;padding:0;margin-bottom:6px;max-width:var(--measure)}
fieldset.q{border:0;margin:0;min-width:0;border-top:1px solid var(--line-2)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:var(--r-s);cursor:pointer;max-width:var(--measure)}
.opt:hover{background:var(--paper)}
.opt input{margin-top:.35rem;width:18px;height:18px;flex:none}
.opt.is-right{background:var(--green-bg)}
.opt.is-wrong{background:var(--red-bg)}
.fb{margin-top:6px;padding:6px 10px;border-radius:var(--r-s);font-size:.95rem;display:flex;gap:8px;align-items:flex-start}
.fb svg{width:18px;height:18px;flex:none;margin-top:3px}
.fb.ok{background:var(--green-bg);color:var(--green-ink)}
.fb.ko{background:var(--red-bg);color:var(--red-ink)}
.row-sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,280px) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-2)}
@media (max-width:620px){.row-sel{grid-template-columns:1fr}}
.row-sel select{border:1px solid #9aabb6;border-radius:var(--r-s);padding:.4rem;background:#fff;width:100%}
.mark{font-weight:700;font-size:.85rem;display:inline-flex;gap:4px;align-items:center}
.mark.ok{color:var(--green)} .mark.ko{color:var(--red)}
.mark svg{width:16px;height:16px}
.order li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);margin:6px 0;background:#fff}
.order{list-style:none;padding:0;margin:0;counter-reset:o}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--f-head);font-weight:700;font-size:1.2rem;min-width:1.4em;color:var(--muted)}
.order .ot{flex:1}
.order button{border:1px solid #9aabb6;background:#fff;border-radius:var(--r-s);width:34px;height:34px;cursor:pointer}
.order button:disabled{opacity:.35;cursor:default}
.order li.ok{border-color:var(--green);background:var(--green-bg)}
.order li.ko{border-color:var(--red);background:var(--red-bg)}
.act-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fafbfc}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:.45rem .9rem;font-weight:700;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.btn.big{font-size:1.05rem;padding:.6rem 1.1rem}
.btn.warn{background:#fff;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.score{font-weight:700}
.scorebox{font-size:.92rem;color:var(--ink-2)}
.how{font-size:.82rem;color:var(--muted);width:100%}
.gridin{width:100%;border-collapse:collapse}
.gridin td,.gridin th{border:1px solid var(--line);padding:4px}
.gridin textarea{width:100%;min-height:3.2rem;border:0;resize:vertical;padding:4px}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.86rem;padding:.15rem .5rem;border-radius:var(--r-s);border:1px solid var(--line)}
.status.pend{background:#fff}
.status.lliu{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-ink)}
.status.rev{background:var(--green-bg);border-color:var(--green);color:var(--green-ink)}
.tbox{margin-top:12px;border:2px dashed var(--yellow);border-radius:var(--r-m);padding:10px 12px;background:#fffcf0}
.tbox h5{margin:0 0 6px;font-family:var(--f-head);font-size:1.1rem}
.tbox .ro{color:var(--muted);font-style:italic}
.tbox .form-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px}

.nav-s{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.final-h{font-size:1.6rem;margin:26px 0 8px}

/* banda del docent */
.tband{background:var(--yellow);color:#231b00;font-weight:700;text-align:center;padding:6px 12px;font-size:.92rem}

/* progrés */
.prog-table td,.prog-table th{white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar > i{display:block;height:100%;background:var(--blue)}

/* informe */
.overlay{position:fixed;inset:0;background:rgba(10,25,35,.55);z-index:50;display:none;overflow:auto;padding:24px 12px}
.overlay.open{display:block}
.sheet{max-width:900px;margin:0 auto;background:#fff;border-radius:var(--r-m);padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet h2{font-size:1.9rem}
.rep h3{font-size:1.35rem;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.rep h4{font-size:1.1rem;margin:12px 0 4px}
.rep table{font-size:.88rem}
.rep .src-a{color:var(--blue-ink);font-weight:700}
.rep .src-t{color:#6b5300;font-weight:700}
.rep .ans{white-space:pre-wrap;background:#f6f8f9;border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:.88rem}
.legend{font-size:.86rem;border:1px solid var(--line);padding:6px 10px;border-radius:var(--r-s);background:#f8fafb}
#copyfallback{width:100%;min-height:240px;font:400 .85rem/1.4 ui-monospace,Menlo,monospace;margin-top:10px;display:none}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--r-s);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw}
#toast.show{opacity:1}
.foot{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  body.print-report .top,body.print-report .wrap,body.print-report .foot,body.print-report .tband,body.print-report .sheet-top,body.print-report #toast{display:none!important}
  body.print-report .overlay{position:static;display:block;background:none;padding:0}
  body.print-report .sheet{box-shadow:none;padding:0;max-width:none}
  .rep h3{break-after:avoid}
  .rep tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}

/* ---------- portada de bloc (placa de senyalització) ---------- */
.cover{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 26px;background:var(--ink);color:#fff;border-radius:var(--r-m);
  padding:22px 24px 34px;overflow:hidden}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
.cv-id{display:grid;align-content:start;gap:2px}
.cv-code{font-family:var(--f-head);font-weight:700;font-size:clamp(3.4rem,8vw,5.6rem);line-height:.86;color:var(--yellow);letter-spacing:-.01em}
.cv-sub{font-size:.84rem;color:#c3d3dc;white-space:nowrap}
.cv-main{min-width:0;display:grid;gap:10px;align-content:start}
.cover h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:700;max-width:28ch;color:#fff}
.cv-lead{margin:0;color:#dbe6ec;max-width:60ch}
.cv-signs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 18px}
.cv-signs li{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:#fff;max-width:15rem;line-height:1.25}
.cv-signs .sign{width:46px;height:46px}
.cv-art{width:170px;align-self:end;margin:-6px 0 -22px;line-height:0}
.cv-art svg{width:100%;height:auto}
.anim .cover:not(.in) .cv-art{opacity:0}
.anim .cover.in .cv-art{animation:rise .7s cubic-bezier(.2,.7,.2,1) both .1s}
@media (max-width:980px){.cv-art{width:130px}}
@media (max-width:760px){.cv-art{display:none}}
@media (max-width:620px){.cover{grid-template-columns:1fr;padding:18px 16px 30px}.cv-sub{white-space:normal}}
.pres-btn{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.pres-btn svg{width:16px;height:16px}

/* senyals */
.sign{display:inline-block;flex:none;width:44px;height:44px;line-height:0}
.sign svg{width:100%;height:100%;overflow:visible}

/* ---------- infografies ---------- */
.viz{margin:14px 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:#f7fafb}
.viz-t{font-size:1.15rem;margin:0 0 10px;color:var(--ink)}
.viz figcaption{font-size:.84rem;color:var(--muted);margin-top:8px}
.ct{display:grid;gap:2px;min-width:0}
.ct strong{font-family:var(--f-head);font-size:1.12rem;line-height:1.15;font-weight:700}
.ct span{font-size:.92rem;color:var(--ink-2);line-height:1.4}
.num{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;font-size:1.2rem}

/* cadena de procés */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0}
.chain li{position:relative;display:grid;justify-items:center;text-align:center;gap:8px;padding:4px 14px}
.chain li + li::before{content:"";position:absolute;left:-9px;top:20px;width:18px;height:3px;background:var(--ink)}
.chain li + li::after{content:"";position:absolute;left:5px;top:15px;border:6.5px solid transparent;border-left:8px solid var(--ink)}
.chain .ct{justify-items:center}
@media (max-width:760px){

/* passos verticals */

.card.s-ghs{border-top-color:var(--red)} .card.s-warn{border-top-color:var(--yellow)} .card.s-must{border-top-color:var(--blue)} .card.s-ban,.card.s-fire{border-top-color:var(--red)} .card.s-safe{border-top-color:var(--green)}

/* comparació */
.compare{display:grid;gap:10px;align-items:stretch}

.compare .col{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px;border-left:6px solid var(--ink)}
.compare .col.s-warn{border-left-color:var(--yellow)} .compare .col.s-must{border-left-color:var(--blue)} .compare .col.s-ban,.compare .col.s-fire{border-left-color:var(--red)} .compare .col.s-safe{border-left-color:var(--green)}

/* piràmide (jerarquia) */
.pyr ol{list-style:none;margin:0 auto;padding:0;display:grid;gap:5px;justify-items:center}

/* cicle */
.cycle{list-style:none;margin:0 auto;padding:0;position:relative;width:min(100%,460px);aspect-ratio:1}

  background:#f7fafb;padding:4px}

/* xifra o definició clau */

.keyf.s-warn blockquote{border-left-color:var(--yellow)} .keyf.s-must blockquote{border-left-color:var(--blue)} .keyf.s-ban blockquote,.keyf.s-fire blockquote{border-left-color:var(--red)} .keyf.s-safe blockquote{border-left-color:var(--green)}

/* barres */

/* procés del manual (diagrames ↓) */
.flow .st{position:relative}

/* ---------- animació d'entrada (un sol cop) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}

.anim .viz:not(.in) li,.anim .viz:not(.in) .col,.anim .viz:not(.in) .keyf,.anim .viz:not(.in) td,
.anim .flow:not(.in) > *,.anim .terms:not(.in) li,.anim .cover:not(.in) .cv-signs li{opacity:0}
.anim .viz.in li,.anim .viz.in .col,.anim .viz.in .keyf,.anim .terms.in li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 110ms)}

.anim .viz.in .bt i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 120ms + 150ms)}
.anim .flow.in > *{animation:rise .45s ease-out both}
.anim .flow.in > :nth-child(2){animation-delay:.12s} .anim .flow.in > :nth-child(3){animation-delay:.24s} .anim .flow.in > :nth-child(4){animation-delay:.36s}
.anim .flow.in > :nth-child(5){animation-delay:.48s} .anim .flow.in > :nth-child(6){animation-delay:.6s} .anim .flow.in > :nth-child(7){animation-delay:.72s}

window.COURSE={"day":1786,"file":"CDPD_RA1-RA2.html","langs":["es","ca"],"meta":{"title":["Competencia digital para la práctica docente","Competència digital per a la pràctica docent"],"subtitle":["MPCDPD (1786) · RA1 y RA2 · 8 sesiones de 1 hora","MPCDPD (1786) · RA1 i RA2 · 8 sessions d'1 hora"],"short":"CDPD","key":"mpcdpd1786","sessionLength":["1 hora","1 hora"],"curriculum":true,"curriculumLabel":["Resultado de aprendizaje","Resultat d'aprenentatge"],"theme":"digital","figure":"teacher"},"ui":{"es":{"day":"Módulo","blocks":"Sesiones","uds":"Resultados de aprendizaje","rDay":"Sesiones incluidas","progTitle":"Progreso del módulo","report":"INFORME COMPLETO (RA1 + RA2)","rNoGlobal":"La web no calcula una calificación final del módulo: muestra el resultado de cada actividad. La calificación la determina el docente con sus instrumentos de evaluación.","fromManual":"Actividad del manual","complementary":"Complementaria (basada en el manual)","clearConfirm":"Se borrarán todas las respuestas, resultados y datos de identificación de esta web en este navegador. ¿Quieres continuar?","importBad":"El archivo no corresponde a esta web.","spotHint":"Situación: pulsa cada número para ver la norma de etiqueta digital del manual que se está incumpliendo.","solTitle":"Solución de referencia (manual o solucionario del docente)","solLocked":"La solución de referencia se mostrará cuando marques la actividad como entregada.","spotBtn":"Muestra la norma","pending":"RA pendiente de identificar","idHint":"Escribe tu nombre y apellidos y tu grupo: aparecen en el informe que entregas al docente. No hace falta ningún otro dato personal."},"ca":{"day":"Mòdul","blocks":"Sessions","uds":"Resultats d'aprenentatge","rDay":"Sessions incloses","progTitle":"Progrés del mòdul","report":"INFORME COMPLET (RA1 + RA2)","rNoGlobal":"La web no calcula una qualificació final del mòdul: mostra el resultat de cada activitat. La qualificació la determina el docent amb els seus instruments d'avaluació.","fromManual":"Activitat del manual","complementary":"Complementària (basada en el manual)","clearConfirm":"S'esborraran totes les respostes, resultats i dades d'identificació d'aquesta web en aquest navegador. Vols continuar?","importBad":"El fitxer no correspon a aquesta web.","spotHint":"Situació: prem cada número per a veure la norma d'etiqueta digital del manual que s'incompleix.","solTitle":"Solució de referència (manual o solucionari del docent)","solLocked":"La solució de referència es mostrarà quan marques l'activitat com a lliurada.","spotBtn":"Mostra la norma","pending":"RA pendent d'identificar","idHint":"Escriu el teu nom i cognoms i el teu grup: apareixen en l'informe que lliures al docent. No cal cap altra dada personal."}},"blocks":[{"id":"S1","ud":"RA1","title":["La competencia digital docente: el marco de referencia","La competència digital docent: el marc de referència"],"meta":{"ra_fp":"RA1"},"sections":[{"num":0,"kind":"intro","title":["La competencia digital docente: marco y comunicación institucional","La competència digital docent: marc i comunicació institucional"],"nodes":[{"t":"p","x":["La transformación digital ha modificado de forma sustancial el modo en que se produce, se transmite y se evalúa el conocimiento en los centros educativos. El profesorado de los grados A, B y C del Sistema de Formación Profesional no puede permanecer ajeno a este proceso, pues su función no se limita a transmitir contenidos técnicos, sino que exige acompañar al alumnado en el desarrollo de competencias que le permitan desenvolverse con solvencia en entornos digitales cada vez más presentes en el mundo laboral. Este primer capítulo aborda el marco conceptual y normativo de la competencia digital docente, así como su proyección práctica en la comunicación institucional, la etiqueta digital y la reflexión sobre la propia práctica profesional.","La transformació digital ha modificat de manera substancial la forma en què es produeix, es transmet i s'avalua el coneixement als centres educatius. El professorat dels graus A, B i C del Sistema de Formació Professional no pot romandre aliè a aquest procés, ja que la seua funció no es limita a transmetre continguts tècnics, sinó que exigeix acompanyar l'alumnat en el desenvolupament de competències que li permeten desenvolupar-se amb solvència en entorns digitals cada vegada més presents en el món laboral. Aquest primer capítol aborda el marc conceptual i normatiu de la competència digital docent, així com la seua projecció pràctica en la comunicació institucional, l'etiqueta digital i la reflexió sobre la pròpia pràctica professional."]},{"t":"p","x":["A lo largo de las páginas siguientes se analizará qué se entiende por competencia digital docente, qué marcos de referencia europeos y estatales la regulan, de qué manera se traduce en el día a día de un centro formativo y qué responsabilidades adquiere el profesorado al participar en la vida institucional a través de medios digitales. El objetivo último es que el futuro docente comprenda que la competencia digital no es un añadido opcional a su perfil profesional, sino un elemento nuclear de su desempeño, tan relevante como el dominio de los contenidos propios de su especialidad.","Al llarg de les pàgines següents s'analitzarà què s'entén per competència digital docent, quins marcs de referència europeus i estatals la regulen, de quina manera es tradueix en el dia a dia d'un centre formatiu i quines responsabilitats adquireix el professorat en participar en la vida institucional a través de mitjans digitals. L'objectiu últim és que el futur docent comprenga que la competència digital no és un afegit opcional al seu perfil professional, sinó un element nuclear del seu exercici, tan rellevant com el domini dels continguts propis de la seua especialitat."]}],"acts":[],"videos":[]},{"num":1,"kind":"theory","title":["El marco de la competencia digital docente","El marc de la competència digital docent"],"nodes":[{"t":"p","x":["La competencia digital docente puede definirse como el conjunto de conocimientos, destrezas y actitudes que permite al profesorado emplear las tecnologías digitales de manera crítica, creativa y segura para alcanzar objetivos relacionados con el trabajo, el aprendizaje, el ocio, la inclusión y la participación en la sociedad. No se trata, por tanto, de una simple alfabetización instrumental en el manejo de dispositivos y aplicaciones, sino de una capacidad más amplia que integra dimensiones pedagógicas, éticas, comunicativas y organizativas.","La competència digital docent es pot definir com el conjunt de coneixements, destreses i actituds que permet al professorat emprar les tecnologies digitals de manera crítica, creativa i segura per a assolir objectius relacionats amb el treball, l'aprenentatge, l'oci, la inclusió i la participació en la societat. No es tracta, per tant, d'una simple alfabetització instrumental en el maneig de dispositius i aplicacions, sinó d'una capacitat més àmplia que integra dimensions pedagògiques, ètiques, comunicatives i organitzatives."]},{"t":"p","x":["En el ámbito europeo, el marco de referencia más influyente es el Marco Europeo de Competencia Digital para Educadores, conocido habitualmente por sus siglas en inglés, DigCompEdu. Este marco fue elaborado por el Centro Común de Investigación de la Comisión Europea con el propósito de ofrecer un modelo común que permitiera a los distintos países europeos describir, comparar y desarrollar la competencia digital de su profesorado con criterios homogéneos. El marco distingue varias áreas de competencia que resultan especialmente pertinentes para el ejercicio de la función docente:","En l'àmbit europeu, el marc de referència més influent és el Marc Europeu de Competència Digital per a Educadors, conegut habitualment per les seues sigles en anglés, DigCompEdu. Aquest marc va ser elaborat pel Centre Comú de Recerca de la Comissió Europea amb el propòsit d'oferir un model comú que permetera als diferents països europeus descriure, comparar i desenvolupar la competència digital del seu professorat amb criteris homogenis. El marc distingeix diverses àrees de competència que resulten especialment pertinents per a l'exercici de la funció docent:"]},{"t":"viz","v":{"type":"cards","num":true,"title":["Áreas de competencia de DigCompEdu","Àrees de competència de DigCompEdu"],"items":[{"i":"handshake","s":"info","x":["Compromiso profesional","Compromís professional"],"d":["Comunicación, colaboración y desarrollo profesional continuo.","Comunicació, col·laboració i desenvolupament professional continu."]},{"i":"folder","s":"info","x":["Recursos digitales","Recursos digitals"],"d":["Buscar, crear y compartir materiales educativos digitales.","Buscar, crear i compartir materials educatius digitals."]},{"i":"learn","s":"info","x":["Enseñanza y aprendizaje","Ensenyament i aprenentatge"],"d":["Uso de tecnologías en las fases del proceso didáctico.","Ús de tecnologies en les fases del procés didàctic."]},{"i":"checklist","s":"info","x":["Evaluación","Avaluació"],"d":["Tecnologías y estrategias digitales para evaluar.","Tecnologies i estratègies digitals per a avaluar."]},{"i":"group","s":"info","x":["Empoderamiento de los discentes","Apoderament dels discents"],"d":["Participación activa, personalización e implicación.","Participació activa, personalització i implicació."]},{"i":"star","s":"info","x":["Competencia digital del alumnado","Competència digital de l'alumnat"],"d":["Facilitar que el alumnado la adquiera.","Facilitar que l'alumnat l'adquirisca."]}]}},{"t":"p","x":["En primer lugar, se sitúa el compromiso profesional, que hace referencia al uso de las tecnologías digitales para la comunicación, la colaboración y el desarrollo profesional continuo del docente, incluyendo su participación en la vida organizativa del centro. En segundo lugar, aparecen los recursos digitales, entendidos como la capacidad de buscar, crear y compartir materiales educativos digitales de manera eficaz y respetuosa con la normativa vigente. En tercer lugar, se contempla la enseñanza y aprendizaje, es decir, la gestión y organización del uso de tecnologías digitales en las distintas fases del proceso didáctico. La cuarta área corresponde a la evaluación, referida al empleo de tecnologías y estrategias digitales para mejorar los procesos de evaluación existentes y crear otros nuevos. La quinta área se centra en el empoderamiento de los discentes, es decir, en el uso de las tecnologías digitales para favorecer la participación activa, la personalización del aprendizaje y la implicación del alumnado. Finalmente, la sexta área atiende al desarrollo de la competencia digital del alumnado, en la medida en que corresponde al profesorado facilitar de forma explícita que sus estudiantes adquieran esta competencia como parte de su formación integral.","En primer lloc, se situa el compromís professional, que fa referència a l'ús de les tecnologies digitals per a la comunicació, la col·laboració i el desenvolupament professional continu del docent, incloent-hi la seua participació en la vida organitzativa del centre. En segon lloc, apareixen els recursos digitals, entesos com la capacitat de buscar, crear i compartir materials educatius digitals de manera eficaç i respectuosa amb la normativa vigent. En tercer lloc, es contempla l'ensenyament i aprenentatge, és a dir, la gestió i organització de l'ús de tecnologies digitals en les diferents fases del procés didàctic. La quarta àrea correspon a l'avaluació, referida a l'ús de tecnologies i estratègies digitals per a millorar els processos d'avaluació existents i crear-ne de nous. La cinquena àrea se centra en l'apoderament dels discents, és a dir, en l'ús de les tecnologies digitals per a afavorir la participació activa, la personalització de l'aprenentatge i la implicació de l'alumnat. Finalment, la sisena àrea atén el desenvolupament de la competència digital de l'alumnat, en la mesura que correspon al professorat facilitar de manera explícita que els seus estudiants adquirisquen aquesta competència com a part de la seua formació integral."]},{"t":"p","x":["Este marco europeo ha inspirado, a su vez, el desarrollo de marcos nacionales de competencia digital docente en distintos países, entre ellos España, donde se ha adaptado a las particularidades del sistema educativo y, específicamente en los últimos años, al Sistema de Formación Profesional. La normativa española sobre ordenación de la Formación Profesional, y en particular el Real Decreto 659/2023, de 18 de julio, por el que se desarrolla la ordenación del Sistema de Formación Profesional, incorpora entre las competencias exigibles al profesorado y al personal formador la capacidad de integrar las tecnologías digitales en su práctica docente de manera reflexiva, ética y eficaz. Esta exigencia se traslada, de forma coherente, al certificado profesional que habilita para la docencia en los distintos grados de la Formación Profesional, del que forma parte el presente módulo.","Aquest marc europeu ha inspirat, al seu torn, el desenvolupament de marcs nacionals de competència digital docent en diferents països, entre els quals hi ha Espanya, on s'ha adaptat a les particularitats del sistema educatiu i, específicament en els últims anys, al Sistema de Formació Professional. La normativa espanyola sobre ordenació de la Formació Professional, i en particular el Reial decret 659/2023, de 18 de juliol, pel qual es desenvolupa l'ordenació del Sistema de Formació Professional, incorpora entre les competències exigibles al professorat i al personal formador la capacitat d'integrar les tecnologies digitals en la seua pràctica docent de manera reflexiva, ètica i eficaç. Aquesta exigència es trasllada, de manera coherent, al certificat professional que habilita per a la docència en els diferents graus de la Formació Professional, del qual forma part el present mòdul."]},{"t":"viz","v":{"type":"chain","title":["Del marco europeo al certificado profesional","Del marc europeu al certificat professional"],"items":[{"i":"globe","s":"info","x":["DigCompEdu (Comisión Europea)","DigCompEdu (Comissió Europea)"]},{"i":"flag","s":"info","x":["Marcos nacionales (España)","Marcs nacionals (Espanya)"]},{"i":"gavel","s":"must","x":["Real Decreto 659/2023","Reial decret 659/2023"]},{"i":"learn","s":"safe","x":["Certificado de docencia en FP","Certificat de docència en FP"]}]}},{"t":"p","x":["Conviene subrayar que la competencia digital docente no debe entenderse como un fin en sí mismo, sino como un medio al servicio de la mejora de los procesos de enseñanza y aprendizaje. Un docente puede dominar técnicamente una gran variedad de herramientas digitales y, sin embargo, no ser competente desde el punto de vista pedagógico si no es capaz de integrarlas de forma significativa en su práctica, de adaptarlas a las necesidades de su alumnado o de valorar críticamente su pertinencia en cada situación de aprendizaje. Por ello, a lo largo de este manual se insistirá reiteradamente en que el uso de la tecnología debe estar siempre subordinado a una intencionalidad didáctica clara.","Convé subratllar que la competència digital docent no s'ha d'entendre com una finalitat en si mateixa, sinó com un mitjà al servei de la millora dels processos d'ensenyament i aprenentatge. Un docent pot dominar tècnicament una gran varietat d'eines digitals i, no obstant això, no ser competent des del punt de vista pedagògic si no és capaç d'integrar-les de manera significativa en la seua pràctica, d'adaptar-les a les necessitats del seu alumnat o de valorar críticament la seua pertinència en cada situació d'aprenentatge. Per això, al llarg d'aquest manual s'insistirà reiteradament que l'ús de la tecnologia ha d'estar sempre subordinat a una intencionalitat didàctica clara."]},{"t":"viz","v":{"type":"key","i":"target","s":"safe","big":["Idea clave","Idea clau"],"x":["El uso de la tecnología debe estar siempre subordinado a una intencionalidad didáctica clara.","L'ús de la tecnologia ha d'estar sempre subordinat a una intencionalitat didàctica clara."],"src":["Manual, epígrafe 1","Manual, epígraf 1"]}},{"t":"p","x":["Otro aspecto que conviene destacar es que la competencia digital docente afecta a todos los ámbitos del ejercicio profesional, y no únicamente al desarrollo de las sesiones formativas propiamente dichas. Incluye, entre otros aspectos, la comunicación con las familias y con otras instituciones, la participación en los órganos de gobierno y coordinación del centro, la gestión administrativa y académica, el trabajo colaborativo con otros docentes, y la propia formación permanente del profesorado a través de comunidades virtuales de práctica, cursos en línea o recursos educativos abiertos. Esta amplitud de ámbitos de aplicación justifica que el presente módulo profesional dedique un capítulo específico a la dimensión comunicativa e institucional de la competencia digital, antes de abordar en capítulos posteriores su proyección más directamente pedagógica.","Un altre aspecte que convé destacar és que la competència digital docent afecta tots els àmbits de l'exercici professional, i no únicament el desenvolupament de les sessions formatives pròpiament dites. Inclou, entre altres aspectes, la comunicació amb les famílies i amb altres institucions, la participació en els òrgans de govern i coordinació del centre, la gestió administrativa i acadèmica, el treball col·laboratiu amb altres docents, i la pròpia formació permanent del professorat a través de comunitats virtuals de pràctica, cursos en línia o recursos educatius oberts. Aquesta amplitud d'àmbits d'aplicació justifica que el present mòdul professional dedique un capítol específic a la dimensió comunicativa i institucional de la competència digital, abans d'abordar en capítols posteriors la seua projecció més directament pedagògica."]},{"t":"viz","v":{"type":"cards","title":["Ámbitos del ejercicio profesional en los que actúa","Àmbits de l'exercici professional en què actua"],"items":[{"i":"chat","s":"must","x":["Comunicación con las familias y otras instituciones","Comunicació amb les famílies i altres institucions"]},{"i":"building","s":"must","x":["Órganos de gobierno y coordinación del centro","Òrgans de govern i coordinació del centre"]},{"i":"doc","s":"must","x":["Gestión administrativa y académica","Gestió administrativa i acadèmica"]},{"i":"group","s":"must","x":["Trabajo colaborativo con otros docentes","Treball col·laboratiu amb altres docents"]},{"i":"learn","s":"must","x":["Formación permanente del profesorado","Formació permanent del professorat"]}]}},{"t":"p","x":["Por último, resulta pertinente señalar que la competencia digital docente evoluciona de manera constante, al ritmo que lo hacen las propias tecnologías. Un docente competente digitalmente no es aquel que domina un catálogo cerrado de herramientas, sino aquel que ha desarrollado una actitud de aprendizaje continuo, curiosidad crítica y capacidad de adaptación que le permite incorporar nuevas tecnologías a su práctica a medida que estas surgen, evaluando siempre su idoneidad pedagógica antes de adoptarlas de manera acrítica.","Finalment, resulta pertinent assenyalar que la competència digital docent evoluciona de manera constant, al ritme que ho fan les mateixes tecnologies. Un docent competent digitalment no és aquell que domina un catàleg tancat d'eines, sinó aquell que ha desenvolupat una actitud d'aprenentatge continu, curiositat crítica i capacitat d'adaptació que li permet incorporar noves tecnologies a la seua pràctica a mesura que sorgeixen, avaluant sempre la seua idoneïtat pedagògica abans d'adoptar-les de manera acrítica."]},{"t":"links","title":null,"items":[{"i":"globe","x":["DigCompEdu","DigCompEdu"],"d":["Marco Europeo de Competencia Digital para Educadores (Centro Común de Investigación, Comisión Europea).","Marc Europeu de Competència Digital per a Educadors (Centre Comú de Recerca, Comissió Europea)."],"url":"https://joint-research-centre.ec.europa.eu/scientific-activities/key-competences-lifelong-learning/digcompedu_en"},{"i":"doc","x":["Marco de Referencia de la Competencia Digital Docente","Marc de Referència de la Competència Digital Docent"],"d":["Resolución de 4 de mayo de 2022 (BOE-A-2022-8042).","Resolució de 4 de maig de 2022 (BOE-A-2022-8042, en castellà)."],"url":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2022-8042"},{"i":"gavel","x":["Real Decreto 659/2023, de 18 de julio","Reial decret 659/2023, de 18 de juliol"],"d":["Ordenación del Sistema de Formación Profesional (texto consolidado, BOE).","Ordenació del Sistema de Formació Professional (text consolidat, BOE, en castellà)."],"url":"https://www.boe.es/buscar/act.php?id=BOE-A-2023-16889"},{"i":"learn","x":["INTEF · Competencia Digital Educativa","INTEF · Competència Digital Educativa"],"d":["Portal del Ministerio sobre la competencia digital del profesorado.","Portal del Ministeri sobre la competència digital del professorat (en castellà)."],"url":"https://intef.es/competencia-digital-educativa/"}]}],"acts":["S1-areas","S1-vf","S1-refl"],"videos":[],"visuals":[{"type":"compare","vs":true,"title":["¿Qué es y qué no es la competencia digital docente?","Què és i què no és la competència digital docent?"],"cols":[{"i":"screen","s":"ban","x":["No es solo…","No és només…"],"items":[["Una simple alfabetización instrumental en el manejo de dispositivos y aplicaciones","Una simple alfabetització instrumental en el maneig de dispositius i aplicacions"]]},{"i":"brain","s":"safe","x":["Es…","Es…"],"items":[["Una capacidad más amplia que integra dimensiones pedagógicas, éticas, comunicativas y organizativas","Una capacitat més àmplia que integra dimensions pedagògiques, ètiques, comunicatives i organitzatives"]]}]}]}],"final":[],"acts":[{"id":"S1-areas","type":"classify","time":["10 min","10 min"],"title":["¿A qué área de DigCompEdu corresponde?","A quina àrea de DigCompEdu correspon?"],"instr":["Clasifica cada actuación docente en el área de competencia de DigCompEdu que le corresponde, según el epígrafe 1.","Classifica cada actuació docent en l'àrea de competència de DigCompEdu que li correspon, segons l'epígraf 1."],"cats":[["Compromiso profesional","Compromís professional"],["Recursos digitales","Recursos digitals"],["Enseñanza y aprendizaje","Ensenyament i aprenentatge"],["Evaluación","Avaluació"],["Empoderamiento de los discentes","Apoderament dels discents"],["Competencia digital del alumnado","Competència digital de l'alumnat"]],"items":[{"x":["Participar en la vida organizativa del centro mediante herramientas digitales de comunicación y colaboración.","Participar en la vida organitzativa del centre mitjançant eines digitals de comunicació i col·laboració."],"c":0,"exp":["El compromiso profesional incluye la comunicación, la colaboración y la participación en la vida organizativa del centro.","El compromís professional inclou la comunicació, la col·laboració i la participació en la vida organitzativa del centre."]},{"x":["Buscar, crear y compartir materiales educativos digitales respetando la normativa vigente.","Buscar, crear i compartir materials educatius digitals respectant la normativa vigent."],"c":1,"exp":["Es la definición del área de recursos digitales.","És la definició de l'àrea de recursos digitals."]},{"x":["Gestionar y organizar el uso de tecnologías digitales en las distintas fases del proceso didáctico.","Gestionar i organitzar l'ús de tecnologies digitals en les diferents fases del procés didàctic."],"c":2,"exp":["Corresponde al área de enseñanza y aprendizaje.","Correspon a l'àrea d'ensenyament i aprenentatge."]},{"x":["Emplear tecnologías y estrategias digitales para mejorar los procesos de evaluación existentes y crear otros nuevos.","Emprar tecnologies i estratègies digitals per a millorar els processos d'avaluació existents i crear-ne de nous."],"c":3,"exp":["Es la cuarta área: evaluación.","És la quarta àrea: avaluació."]},{"x":["Usar tecnologías digitales para favorecer la participación activa y la personalización del aprendizaje del alumnado.","Usar tecnologies digitals per a afavorir la participació activa i la personalització de l'aprenentatge de l'alumnat."],"c":4,"exp":["La quinta área es el empoderamiento de los discentes.","La cinquena àrea és l'apoderament dels discents."]},{"x":["Facilitar de forma explícita que los estudiantes adquieran la competencia digital como parte de su formación integral.","Facilitar de manera explícita que els estudiants adquirisquen la competència digital com a part de la seua formació integral."],"c":5,"exp":["La sexta área atiende al desarrollo de la competencia digital del alumnado.","La sisena àrea atén el desenvolupament de la competència digital de l'alumnat."]}],"block":"S1","origin":"complementaria","ra":"RA1","ce":""},{"id":"S1-vf","type":"tf","time":["10 min","10 min"],"title":["Verdadero o falso: el marco de la competencia digital docente","Vertader o fals: el marc de la competència digital docent"],"questions":[{"q":["DigCompEdu fue elaborado por el Centro Común de Investigación de la Comisión Europea.","DigCompEdu va ser elaborat pel Centre Comú de Recerca de la Comissió Europea."],"ans":true,"exp":["Epígrafe 1: el marco fue elaborado por el Centro Común de Investigación de la Comisión Europea.","Epígraf 1: el marc va ser elaborat pel Centre Comú de Recerca de la Comissió Europea."]},{"q":["La competencia digital docente se limita al manejo instrumental de dispositivos y aplicaciones.","La competència digital docent es limita al maneig instrumental de dispositius i aplicacions."],"ans":false,"exp":["No es una simple alfabetización instrumental: integra dimensiones pedagógicas, éticas, comunicativas y organizativas.","No és una simple alfabetització instrumental: integra dimensions pedagògiques, ètiques, comunicatives i organitzatives."]},{"q":["El Real Decreto 659/2023 incorpora entre las competencias del profesorado la integración de las tecnologías digitales de manera reflexiva, ética y eficaz.","El Reial decret 659/2023 incorpora entre les competències del professorat la integració de les tecnologies digitals de manera reflexiva, ètica i eficaç."],"ans":true,"exp":["Así lo recoge el epígrafe 1.","Així ho recull l'epígraf 1."]},{"q":["Dominar muchas herramientas digitales garantiza ser competente desde el punto de vista pedagógico.","Dominar moltes eines digitals garanteix ser competent des del punt de vista pedagògic."],"ans":false,"exp":["Un docente puede dominarlas técnicamente y no ser competente si no las integra de forma significativa en su práctica.","Un docent pot dominar-les tècnicament i no ser competent si no les integra de manera significativa en la seua pràctica."]},{"q":["La competencia digital docente afecta solo al desarrollo de las sesiones formativas.","La competència digital docent afecta només el desenvolupament de les sessions formatives."],"ans":false,"exp":["Afecta a todos los ámbitos del ejercicio profesional: familias, órganos de coordinación, gestión, colaboración y formación.","Afecta tots els àmbits de l'exercici professional: famílies, òrgans de coordinació, gestió, col·laboració i formació."]},{"q":["Un docente competente digitalmente es el que domina un catálogo cerrado de herramientas.","Un docent competent digitalment és el que domina un catàleg tancat d'eines."],"ans":false,"exp":["Es quien ha desarrollado una actitud de aprendizaje continuo, curiosidad crítica y capacidad de adaptación.","És qui ha desenvolupat una actitud d'aprenentatge continu, curiositat crítica i capacitat d'adaptació."]},{"q":["Antes de adoptar una nueva tecnología conviene evaluar su idoneidad pedagógica.","Abans d'adoptar una nova tecnologia convé avaluar-ne la idoneïtat pedagògica."],"ans":true,"exp":["El epígrafe 1 pide evaluar siempre la idoneidad pedagógica antes de adoptarla de manera acrítica.","L'epígraf 1 demana avaluar sempre la idoneïtat pedagògica abans d'adoptar-la de manera acrítica."]},{"q":["DigCompEdu ha inspirado marcos nacionales de competencia digital docente, entre ellos el de España.","DigCompEdu ha inspirat marcs nacionals de competència digital docent, entre els quals hi ha el d'Espanya."],"ans":true,"exp":["El marco europeo ha inspirado marcos nacionales en distintos países, entre ellos España.","El marc europeu ha inspirat marcs nacionals en diferents països, entre els quals hi ha Espanya."]}],"block":"S1","origin":"complementaria","ra":"RA1","ce":""},{"id":"S1-refl","type":"teacher","time":["10 min","10 min"],"title":["Mi punto de partida digital","El meu punt de partida digital"],"instr":["A partir del epígrafe 1, reflexiona sobre tu situación como futuro docente.","A partir de l'epígraf 1, reflexiona sobre la teua situació com a futur docent."],"fields":[["¿En qué área de DigCompEdu te sientes más competente y en cuál menos? Justifícalo con un ejemplo.","En quina àrea de DigCompEdu et sents més competent i en quina menys? Justifica-ho amb un exemple."],["Elige dos ámbitos del ejercicio profesional (familias, coordinación, gestión, colaboración o formación) y explica qué herramienta digital usarías en cada uno y con qué intención didáctica u organizativa.","Tria dos àmbits de l'exercici professional (famílies, coordinació, gestió, col·laboració o formació) i explica quina eina digital usaries en cadascun i amb quina intenció didàctica o organitzativa."]],"block":"S1","origin":"complementaria","ra":"RA1","ce":""}],"notes":[],"cover":{"signs":[["info","globe",["DigCompEdu: seis áreas","DigCompEdu: sis àrees"]],["must","gavel",["RD 659/2023","RD 659/2023"]],["safe","target",["Tecnología al servicio de la didáctica","Tecnologia al servei de la didàctica"]],["info","learn",["Aprendizaje continuo","Aprenentatge continu"]]],"lead":["La competencia digital no es un añadido opcional al perfil docente, sino un elemento nuclear de su desempeño.","La competència digital no és un afegit opcional al perfil docent, sinó un element nuclear del seu exercici."]},"art":"laptop"},{"id":"S2","ud":"RA1","title":["Comunicación digital corporativa y Google Workspace for Education","Comunicació digital corporativa i Google Workspace for Education"],"meta":{"ra_fp":"RA1"},"sections":[{"num":2,"kind":"theory","title":["Comunicación digital corporativa y proyección institucional del centro","Comunicació digital corporativa i projecció institucional del centre"],"nodes":[{"t":"p","x":["Los centros de Formación Profesional, como cualquier organización educativa contemporánea, proyectan buena parte de su identidad y de su relación con el entorno a través de canales digitales. La página web institucional, los entornos virtuales de aprendizaje, las redes sociales corporativas o las plataformas de comunicación con las familias constituyen hoy elementos centrales de la vida organizativa de cualquier centro, y el profesorado de los grados A, B y C debe conocer su funcionamiento y participar activamente en su uso responsable.","Els centres de Formació Professional, com qualsevol organització educativa contemporània, projecten bona part de la seua identitat i de la seua relació amb l'entorn a través de canals digitals. La pàgina web institucional, els entorns virtuals d'aprenentatge, les xarxes socials corporatives o les plataformes de comunicació amb les famílies constitueixen hui elements centrals de la vida organitzativa de qualsevol centre, i el professorat dels graus A, B i C n'ha de conéixer el funcionament i participar activament en el seu ús responsable."]},{"t":"viz","v":{"type":"cards","title":["Canales digitales del centro","Canals digitals del centre"],"items":[{"i":"globe","s":"info","x":["Página web del centro","Pàgina web del centre"],"d":["Carta de presentación ante el entorno social y productivo.","Carta de presentació davant de l'entorn social i productiu."]},{"i":"laptop","s":"info","x":["Entornos virtuales de aprendizaje","Entorns virtuals d'aprenentatge"],"d":["Gestión académica y pedagógica de los procesos formativos.","Gestió acadèmica i pedagògica dels processos formatius."]},{"i":"share","s":"info","x":["Redes sociales corporativas","Xarxes socials corporatives"],"d":["Comunicación con la comunidad educativa y el entorno productivo.","Comunicació amb la comunitat educativa i l'entorn productiu."]},{"i":"mail","s":"info","x":["Tecnologías digitales corporativas","Tecnologies digitals corporatives"],"d":["Comunicación interna y gestión organizativa, académica y tutorial.","Comunicació interna i gestió organitzativa, acadèmica i tutorial."]}]}},{"t":"p","x":["La página web del centro cumple funciones que van más allá de la mera difusión de información. Constituye la principal carta de presentación ante el entorno social y productivo, ofrece transparencia sobre la oferta formativa, los proyectos educativos y los resultados obtenidos, y sirve como canal de comunicación con el alumnado potencial, las familias, las empresas colaboradoras y la administración educativa. El profesorado, aunque no sea responsable directo de la gestión técnica de la web, contribuye a su contenido mediante la aportación de materiales, noticias sobre actividades formativas, resultados de proyectos o experiencias de innovación educativa que reflejan la calidad de la acción docente desarrollada.","La pàgina web del centre compleix funcions que van més enllà de la mera difusió d'informació. Constitueix la principal carta de presentació davant de l'entorn social i productiu, ofereix transparència sobre l'oferta formativa, els projectes educatius i els resultats obtinguts, i serveix com a canal de comunicació amb l'alumnat potencial, les famílies, les empreses col·laboradores i l'administració educativa. El professorat, encara que no siga responsable directe de la gestió tècnica de la web, contribueix al seu contingut mitjançant l'aportació de materials, notícies sobre activitats formatives, resultats de projectes o experiències d'innovació educativa que reflecteixen la qualitat de l'acció docent desenvolupada."]},{"t":"p","x":["Los entornos virtuales de aprendizaje, por su parte, constituyen plataformas específicamente diseñadas para la gestión académica y pedagógica de los procesos formativos. Permiten alojar materiales didácticos, gestionar la comunicación entre docentes y alumnado, organizar actividades de evaluación y llevar un seguimiento sistemático del progreso de cada persona participante en la acción formativa. Estos entornos, además, favorecen la proyección institucional al mostrar de forma ordenada y accesible la organización pedagógica del centro.","Els entorns virtuals d'aprenentatge, per la seua banda, constitueixen plataformes específicament dissenyades per a la gestió acadèmica i pedagògica dels processos formatius. Permeten allotjar materials didàctics, gestionar la comunicació entre docents i alumnat, organitzar activitats d'avaluació i portar un seguiment sistemàtic del progrés de cada persona participant en l'acció formativa. Aquests entorns, a més, afavoreixen la projecció institucional en mostrar de manera ordenada i accessible l'organització pedagògica del centre."]},{"t":"p","x":["Las redes sociales corporativas han adquirido en los últimos años una relevancia creciente como canal de comunicación con la comunidad educativa y con el entorno productivo. Su uso adecuado permite difundir actividades formativas, visibilizar el trabajo del alumnado, establecer vínculos con empresas del sector y reforzar la imagen del centro como institución dinámica e innovadora. No obstante, su gestión exige un conocimiento preciso de las normas de uso corporativo, de los criterios de publicación y de los límites legales relacionados con la protección de datos personales y la propiedad intelectual, aspectos que se desarrollarán con mayor profundidad en el capítulo dedicado a la selección y gestión de contenidos digitales.","Les xarxes socials corporatives han adquirit en els últims anys una rellevància creixent com a canal de comunicació amb la comunitat educativa i amb l'entorn productiu. El seu ús adequat permet difondre activitats formatives, visibilitzar el treball de l'alumnat, establir vincles amb empreses del sector i reforçar la imatge del centre com a institució dinàmica i innovadora. No obstant això, la seua gestió exigeix un coneixement precís de les normes d'ús corporatiu, dels criteris de publicació i dels límits legals relacionats amb la protecció de dades personals i la propietat intel·lectual, aspectes que es desenvoluparan amb més profunditat en el capítol dedicat a la selecció i gestió de continguts digitals."]},{"t":"p","x":["Junto a estos canales de proyección externa, el profesorado emplea de manera cotidiana tecnologías digitales corporativas para la comunicación interna y la gestión de aspectos organizativos, académicos y tutoriales. Entre ellas se encuentran el correo electrónico institucional, los sistemas de gestión académica en línea, las aplicaciones de mensajería corporativa y las plataformas específicas de comunicación con las familias del alumnado, en aquellos casos en que la edad o las circunstancias del alumnado lo requieran. El uso de estas herramientas corporativas, frente al empleo de canales personales, resulta imprescindible para garantizar la trazabilidad de la comunicación, la protección de datos y la coherencia institucional.","Juntament amb aquests canals de projecció externa, el professorat empra de manera quotidiana tecnologies digitals corporatives per a la comunicació interna i la gestió d'aspectes organitzatius, acadèmics i tutorials. Entre aquestes hi ha el correu electrònic institucional, els sistemes de gestió acadèmica en línia, les aplicacions de missatgeria corporativa i les plataformes específiques de comunicació amb les famílies de l'alumnat, en aquells casos en què l'edat o les circumstàncies de l'alumnat ho requerisquen. L'ús d'aquestes eines corporatives, enfront de l'ús de canals personals, resulta imprescindible per a garantir la traçabilitat de la comunicació, la protecció de dades i la coherència institucional."]},{"t":"viz","v":{"type":"key","i":"lock","s":"must","big":["Canales corporativos","Canals corporatius"],"x":["Frente al empleo de canales personales, resultan imprescindibles para garantizar la trazabilidad de la comunicación, la protección de datos y la coherencia institucional.","Enfront de l'ús de canals personals, resulten imprescindibles per a garantir la traçabilitat de la comunicació, la protecció de dades i la coherència institucional."],"src":["Manual, epígrafe 2","Manual, epígraf 2"]}},{"t":"p","x":["Toda esta actividad comunicativa debe desarrollarse conforme a un conjunto de normas básicas de etiqueta digital, entendida como el código de conducta que regula las interacciones respetuosas y profesionales a través de tecnologías digitales. Entre estas normas cabe destacar el empleo de un registro formal y respetuoso en las comunicaciones institucionales, la respuesta en plazos razonables a los mensajes recibidos, la revisión cuidadosa del contenido antes de su envío o publicación, el respeto a la privacidad de terceras personas al compartir información, y la moderación en el tono empleado durante intervenciones en foros, chats o sistemas de videoconferencia. Estas normas resultan de aplicación tanto en la comunicación con el alumnado como en la establecida con otros docentes, con las familias o con instituciones colaboradoras del entorno.","Tota aquesta activitat comunicativa s'ha de desenvolupar d'acord amb un conjunt de normes bàsiques d'etiqueta digital, entesa com el codi de conducta que regula les interaccions respectuoses i professionals a través de tecnologies digitals. Entre aquestes normes cal destacar l'ús d'un registre formal i respectuós en les comunicacions institucionals, la resposta en terminis raonables als missatges rebuts, la revisió acurada del contingut abans del seu enviament o publicació, el respecte a la privacitat de terceres persones en compartir informació, i la moderació en el to emprat durant les intervencions en fòrums, xats o sistemes de videoconferència. Aquestes normes són d'aplicació tant en la comunicació amb l'alumnat com en l'establida amb altres docents, amb les famílies o amb institucions col·laboradores de l'entorn."]},{"t":"viz","v":{"type":"cards","title":["Normas básicas de etiqueta digital","Normes bàsiques d'etiqueta digital"],"items":[{"i":"chat","s":"must","x":["Registro formal y respetuoso","Registre formal i respectuós"]},{"i":"clock","s":"must","x":["Respuesta en plazos razonables","Resposta en terminis raonables"]},{"i":"search","s":"must","x":["Revisión cuidadosa antes de enviar o publicar","Revisió acurada abans d'enviar o publicar"]},{"i":"lock","s":"must","x":["Respeto a la privacidad de terceras personas","Respecte a la privacitat de terceres persones"]},{"i":"handshake","s":"must","x":["Moderación en el tono","Moderació en el to"]}]}}],"acts":["S2-canales"],"videos":[]},{"num":3,"kind":"theory","title":["Google Workspace for Education (Gmail + Meet + Drive)","Google Workspace for Education (Gmail + Meet + Drive)"],"nodes":[{"t":"h3","x":["Funciones principales","Funcions principals"]},{"t":"p","x":["Esta suite integra un conjunto de aplicaciones interconectadas: correo electrónico corporativo (Gmail), videoconferencia (Meet), almacenamiento y edición documental colaborativa (Drive, Docs, Sheets, Slides) y calendario compartido. Todas las herramientas comparten una misma identidad institucional, lo que permite un flujo de trabajo unificado entre docentes, equipos directivos y administración del centro.","Aquesta suite integra un conjunt d'aplicacions interconnectades: correu electrònic corporatiu (Gmail), videoconferència (Meet), emmagatzematge i edició documental col·laborativa (Drive, Docs, Sheets, Slides) i calendari compartit. Totes les eines comparteixen una mateixa identitat institucional, la qual cosa permet un flux de treball unificat entre docents, equips directius i administració del centre."]},{"t":"h3","x":["Ventajas","Avantatges"]},{"t":"list","k":"ul","l":1,"items":[["Permite la edición simultánea de un mismo documento por varias personas, con visualización en tiempo real de los cambios y autoría de cada aportación.","Permet l'edició simultània d'un mateix document per diverses persones, amb visualització en temps real dels canvis i autoria de cada aportació."],["El historial de versiones posibilita recuperar redacciones anteriores sin necesidad de guardar copias manuales.","L'historial de versions possibilita recuperar redaccions anteriors sense necessitat de guardar còpies manuals."],["La integración entre calendario y videoconferencia simplifica la convocatoria y el seguimiento de reuniones de coordinación docente.","La integració entre calendari i videoconferència simplifica la convocatòria i el seguiment de reunions de coordinació docent."],["Al tratarse de un entorno institucional, refuerza la seguridad de los datos y evita el uso de cuentas personales para comunicaciones oficiales.","En tractar-se d'un entorn institucional, reforça la seguretat de les dades i evita l'ús de comptes personals per a comunicacions oficials."]],"start":1},{"t":"h3","x":["Cómo ayuda al docente","Com ajuda el docent"]},{"t":"p","x":["Facilita la elaboración conjunta de actas, programaciones didácticas y memorias de departamento sin necesidad de reuniones presenciales constantes, reduciendo la duplicidad de documentos y los problemas de control de versiones. Además, centraliza en un mismo entorno la comunicación formal con las familias, el equipo docente y la administración del centro.","Facilita l'elaboració conjunta d'actes, programacions didàctiques i memòries de departament sense necessitat de reunions presencials constants, i redueix la duplicitat de documents i els problemes de control de versions. A més, centralitza en un mateix entorn la comunicació formal amb les famílies, l'equip docent i l'administració del centre."]},{"t":"h3","x":["Tutorial breve","Tutorial breu"]},{"t":"list","k":"ol","l":1,"items":[["El acceso se realiza con la cuenta institucional proporcionada por el centro (dominio @nombrecentro.es).","L'accés es fa amb el compte institucional proporcionat pel centre (domini @nombrecentro.es)."],["Desde Gmail, se pueden crear etiquetas y filtros para organizar la comunicación por departamentos o proyectos.","Des de Gmail, es poden crear etiquetes i filtres per a organitzar la comunicació per departaments o projectes."],["Google Meet permite programar videoconferencias directamente desde Google Calendar, generando un enlace único y compartible con el equipo docente.","Google Meet permet programar videoconferències directament des de Google Calendar, generant un enllaç únic i compartible amb l'equip docent."],["En Google Drive, se crea una carpeta compartida por departamento; los documentos de Google Docs y Sheets alojados en ella permiten la edición simultánea, visible en tiempo real mediante los cursores identificados con el nombre de cada usuario.","A Google Drive, es crea una carpeta compartida per departament; els documents de Google Docs i Sheets allotjats en aquesta permeten l'edició simultània, visible en temps real mitjançant els cursors identificats amb el nom de cada usuari."],["El historial de versiones (menú Archivo > Historial de versiones) permite recuperar redacciones anteriores de un acta o programación.","L'historial de versions (menú Fitxer > Historial de versions) permet recuperar redaccions anteriors d'una acta o programació."]],"start":1},{"t":"links","title":null,"items":[{"i":"cloud","x":["Google Workspace for Education","Google Workspace for Education"],"d":["Presentación de la edición gratuita Education Fundamentals.","Presentació de l'edició gratuïta Education Fundamentals."],"url":"https://edu.google.com/intl/ALL_es/workspace-for-education/editions/education-fundamentals/"},{"i":"video","x":["Programar una videollamada de Meet","Programar una videotrucada de Meet"],"d":["Ayuda oficial: iniciar o programar reuniones desde Calendar.","Ajuda oficial: iniciar o programar reunions des de Calendar."],"url":"https://support.google.com/meet/answer/9302870?hl=es"},{"i":"history","x":["Historial de versiones","Historial de versions"],"d":["Ayuda oficial de Documentos de Google: ver los cambios de un archivo.","Ajuda oficial de Documents de Google: veure els canvis d'un fitxer."],"url":"https://support.google.com/docs/answer/190843?hl=es"}]}],"acts":["S2-gws","S2-A1"],"videos":[],"visuals":[{"type":"cards","title":["Las herramientas de la suite que trabaja el manual","Les eines de la suite que treballa el manual"],"items":[{"i":"mail","s":"info","x":["Gmail","Gmail"],"d":["Correo electrónico corporativo","Correu electrònic corporatiu"]},{"i":"video","s":"info","x":["Meet","Meet"],"d":["Videoconferencia","Videoconferència"]},{"i":"cloud","s":"info","x":["Drive","Drive"],"d":["Almacenamiento compartido","Emmagatzematge compartit"]},{"i":"doc","s":"info","x":["Docs, Sheets y Slides","Docs, Sheets i Slides"],"d":["Edición documental colaborativa","Edició documental col·laborativa"]},{"i":"calendar","s":"info","x":["Calendar","Calendar"],"d":["Calendario compartido","Calendari compartit"]}],"note":["En la página del manual aparece una captura de la web de Google Workspace con las aplicaciones de la suite.","A la pàgina del manual apareix una captura de la web de Google Workspace amb les aplicacions de la suite."]}]}],"final":[],"acts":[{"id":"S2-canales","type":"match","time":["7 min","7 min"],"title":["Cada canal, su función","Cada canal, la seua funció"],"instr":["Relaciona cada canal digital del centro con la función que le atribuye el epígrafe 2.","Relaciona cada canal digital del centre amb la funció que li atribueix l'epígraf 2."],"pairs":[{"a":["Página web del centro","Pàgina web del centre"],"b":["Principal carta de presentación ante el entorno social y productivo","Principal carta de presentació davant de l'entorn social i productiu"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Entorno virtual de aprendizaje","Entorn virtual d'aprenentatge"],"b":["Alojar materiales y llevar un seguimiento sistemático del progreso del alumnado","Allotjar materials i portar un seguiment sistemàtic del progrés de l'alumnat"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Redes sociales corporativas","Xarxes socials corporatives"],"b":["Visibilizar el trabajo del alumnado y establecer vínculos con empresas del sector","Visibilitzar el treball de l'alumnat i establir vincles amb empreses del sector"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Correo electrónico institucional","Correu electrònic institucional"],"b":["Comunicación interna trazable y con protección de datos","Comunicació interna traçable i amb protecció de dades"],"exp":["Las tecnologías corporativas garantizan trazabilidad y protección de datos.","Les tecnologies corporatives garanteixen traçabilitat i protecció de dades."]},{"a":["Etiqueta digital","Etiqueta digital"],"b":["Código de conducta que regula las interacciones respetuosas y profesionales","Codi de conducta que regula les interaccions respectuoses i professionals"],"exp":["Definición del epígrafe 2.","Definició de l'epígraf 2."]}],"block":"S2","origin":"complementaria","ra":"RA1","ce":""},{"id":"S2-gws","type":"match","time":["8 min","8 min"],"title":["¿Para qué sirve cada función?","Per a què serveix cada funció?"],"instr":["Relaciona cada elemento de Google Workspace con su uso según el tutorial breve del epígrafe 3.","Relaciona cada element de Google Workspace amb el seu ús segons el tutorial breu de l'epígraf 3."],"pairs":[{"a":["Cuenta institucional","Compte institucional"],"b":["Acceder con el dominio proporcionado por el centro (@nombrecentro.es)","Accedir amb el domini proporcionat pel centre (@nombrecentro.es)"],"exp":["Paso 1 del tutorial.","Pas 1 del tutorial."]},{"a":["Etiquetas y filtros de Gmail","Etiquetes i filtres de Gmail"],"b":["Organizar la comunicación por departamentos o proyectos","Organitzar la comunicació per departaments o projectes"],"exp":["Paso 2 del tutorial.","Pas 2 del tutorial."]},{"a":["Google Meet desde Calendar","Google Meet des de Calendar"],"b":["Programar videoconferencias con un enlace único y compartible","Programar videoconferències amb un enllaç únic i compartible"],"exp":["Paso 3 del tutorial.","Pas 3 del tutorial."]},{"a":["Carpeta compartida de Drive","Carpeta compartida de Drive"],"b":["Editar de forma simultánea los documentos del departamento","Editar de manera simultània els documents del departament"],"exp":["Paso 4 del tutorial.","Pas 4 del tutorial."]},{"a":["Historial de versiones","Historial de versions"],"b":["Recuperar redacciones anteriores de un acta o programación","Recuperar redaccions anteriors d'una acta o programació"],"exp":["Paso 5 del tutorial.","Pas 5 del tutorial."]}],"block":"S2","origin":"complementaria","ra":"RA1","ce":""},{"id":"S2-A1","solution":[["Como docente responsable del departamento de Electricidad y Automatización, para convocar la reunión de coordinación seguiría el siguiente procedimiento:","Com a docent responsable del departament d'Electricitat i Automatització, per a convocar la reunió de coordinació seguiria el procediment següent:"],["a) Creación del evento de videoconferencia en el calendario institucional.","a) Creació de l'esdeveniment de videoconferència en el calendari institucional."],["• Accedo a mi cuenta de correo corporativo institucional y abro la aplicación de calendario integrada en el entorno del centro.","• Accedisc al meu compte de correu corporatiu institucional i obri l'aplicació de calendari integrada en l'entorn del centre."],["• Creo un nuevo evento, indicando como título \"Reunión de coordinación – Revisión de la programación didáctica del tercer trimestre\".","• Cree un esdeveniment nou, amb el títol «Reunió de coordinació – Revisió de la programació didàctica del tercer trimestre»."],["• Establezco la fecha y hora propuestas, comprobando previamente la disponibilidad del profesorado del departamento mediante la vista de calendarios compartidos.","• Estableix la data i l'hora proposades, i comprove prèviament la disponibilitat del professorat del departament mitjançant la vista de calendaris compartits."],["• Añado como invitados las cuentas de correo institucionales de todos los miembros del equipo docente del departamento.","• Afegisc com a convidats els comptes de correu institucionals de tots els membres de l'equip docent del departament."],["• Activo la opción de videoconferencia integrada, que genera automáticamente un enlace único de acceso a la sala virtual.","• Active l'opció de videoconferència integrada, que genera automàticament un enllaç únic d'accés a la sala virtual."],["• Adjunto al evento una breve descripción con el orden del día (revisión de contenidos, ajuste de temporalización, propuesta de actividades pendientes).","• Adjunte a l'esdeveniment una breu descripció amb l'ordre del dia (revisió de continguts, ajust de la temporització, proposta d'activitats pendents)."],["• Guardo el evento, lo que envía de forma automática la invitación a todos los participantes a través del sistema de calendario institucional.","• Guarde l'esdeveniment, cosa que envia automàticament la invitació a tots els participants per mitjà del sistema de calendari institucional."],["b) Generación del documento colaborativo compartido.","b) Generació del document col·laboratiu compartit."],["• Accedo a la unidad de almacenamiento en la nube institucional y creo una carpeta específica para el departamento, si no existe previamente.","• Accedisc a la unitat d'emmagatzematge en el núvol institucional i cree una carpeta específica per al departament, si no n'hi ha."],["• Dentro de dicha carpeta, creo un documento de texto colaborativo con el título \"Programación didáctica – Revisión trimestral\".","• Dins d'aquesta carpeta, cree un document de text col·laboratiu amb el títol «Programació didàctica – Revisió trimestral»."],["• Estructuro el documento con apartados claros (contenidos impartidos, contenidos pendientes, propuestas de modificación, calendario de evaluaciones).","• Estructure el document amb apartats clars (continguts impartits, continguts pendents, propostes de modificació, calendari d'avaluacions)."],["• Configuro los permisos de edición del documento, otorgando acceso de \"editor\" a todas las cuentas institucionales del equipo docente convocado.","• Configure els permisos d'edició del document i concedisc accés d'«editor» a tots els comptes institucionals de l'equip docent convocat."],["• Comparto el enlace de acceso al documento directamente en la descripción del evento de calendario creado en el paso anterior, de modo que todos los convocados puedan localizarlo sin necesidad de buscarlo por separado.","• Compartisc l'enllaç d'accés al document directament en la descripció de l'esdeveniment de calendari creat en el pas anterior, de manera que tots els convocats el puguen localitzar sense haver-lo de buscar per separat."],["• Durante la reunión, el documento permite que cada docente introduzca sus aportaciones de forma simultánea, quedando reflejada la autoría de cada cambio.","• Durant la reunió, el document permet que cada docent introduïsca les seues aportacions de manera simultània, i queda reflectida l'autoria de cada canvi."],["c) Sistema de notificación por correo electrónico corporativo.","c) Sistema de notificació per correu electrònic corporatiu."],["• Redacto un correo electrónico desde mi cuenta institucional, dirigido a las direcciones corporativas de todo el equipo docente del departamento.","• Redacte un correu electrònic des del meu compte institucional, adreçat a les adreces corporatives de tot l'equip docent del departament."],["• En el asunto, incluyo una referencia clara: \"Convocatoria: reunión de coordinación – revisión de programación (fecha)\".","• En l'assumpte, incloc una referència clara: «Convocatòria: reunió de coordinació – revisió de programació (data)»."],["• En el cuerpo del mensa
