ferència al procés de filtrar, seleccionar, organitzar i compartir la informació més rellevant sobre un tema concret, aportant valor afegit mitjançant la contextualització i el criteri expert de qui fa la curació. A diferència de la simple acumulació d'enllaços o recursos, la curació de continguts implica un treball actiu d'avaluació i filtratge, aplicant criteris com la qualitat del contingut, la seua usabilitat, la fiabilitat de la font que el publica i la veracitat de la informació que transmet."]},{"t":"viz","v":{"type":"chain","title":["La curación de contenidos","La curació de continguts"],"items":[{"i":"filter","s":"info","x":["Filtrar","Filtrar"]},{"i":"check","s":"info","x":["Seleccionar","Seleccionar"]},{"i":"folder","s":"info","x":["Organizar","Organitzar"]},{"i":"share","s":"safe","x":["Compartir con valor añadido","Compartir amb valor afegit"]}]}},{"t":"p","x":["La curación de contenidos educativos digitales resulta especialmente valiosa en el contexto de la Formación Profesional, dado que permite al docente construir, a lo largo del tiempo, un repositorio personal de recursos seleccionados y contrastados, organizados de forma temática, que puede compartir posteriormente con su alumnado o con otros compañeros de departamento. Existen herramientas digitales específicamente diseñadas para facilitar esta labor de curación, que permiten agrupar recursos de distinta procedencia en colecciones temáticas, añadir comentarios o valoraciones propias, y compartir el resultado con otras personas a través de enlaces o de integración en entornos virtuales de aprendizaje.","La curació de continguts educatius digitals resulta especialment valuosa en el context de la Formació Professional, atés que permet al docent construir, al llarg del temps, un repositori personal de recursos seleccionats i contrastats, organitzats de manera temàtica, que pot compartir posteriorment amb el seu alumnat o amb altres companys de departament. Hi ha eines digitals específicament dissenyades per a facilitar aquesta tasca de curació, que permeten agrupar recursos de procedència diversa en col·leccions temàtiques, afegir comentaris o valoracions pròpies, i compartir el resultat amb altres persones a través d'enllaços o d'integració en entorns virtuals d'aprenentatge."]}],"acts":["S6-conc"],"videos":[]},{"num":3,"kind":"theory","title":["Symbaloo","Symbaloo"],"nodes":[{"t":"h3","x":["Funciones principales","Funcions principals"]},{"t":"p","x":["Symbaloo es una aplicación de curación de contenidos que organiza enlaces web mediante un sistema visual de \"baldosas\" agrupadas en paneles temáticos. Cada baldosa representa un recurso (una página, un vídeo, un documento) identificado por un icono y un color, lo que facilita su localización rápida.","Symbaloo és una aplicació de curació de continguts que organitza enllaços web mitjançant un sistema visual de \"rajoles\" agrupades en panells temàtics. Cada rajola representa un recurs (una pàgina, un vídeo, un document) identificat per una icona i un color, la qual cosa en facilita la localització ràpida."]},{"t":"h3","x":["Ventajas","Avantatges"]},{"t":"list","k":"ul","l":1,"items":[["Ofrece una interfaz visual e intuitiva, especialmente útil para el alumnado con menor autonomía digital.","Ofereix una interfície visual i intuïtiva, especialment útil per a l'alumnat amb menys autonomia digital."],["Permite compartir paneles completos mediante un simple enlace, o embeberlos directamente en un blog o entorno virtual de aprendizaje.","Permet compartir panells complets mitjançant un simple enllaç, o incrustar-los directament en un blog o entorn virtual d'aprenentatge."],["Dispone de una galería pública de paneles ya elaborados por otros docentes, lo que facilita partir de un modelo existente y adaptarlo.","Disposa d'una galeria pública de panells ja elaborats per altres docents, la qual cosa facilita partir d'un model existent i adaptar-lo."],["Su estructura por pestañas permite separar recursos por materia, curso o fase del proceso de aprendizaje.","La seua estructura per pestanyes permet separar recursos per matèria, curs o fase del procés d'aprenentatge."]],"start":1},{"t":"h3","x":["Cómo ayuda al docente","Com ajuda el docent"]},{"t":"p","x":["Evita que el alumnado navegue de forma dispersa por internet en busca de información, ya que el docente prefiltra y organiza previamente los recursos relevantes. Esto resulta especialmente valioso para quien enseña contenidos técnicos con constante actualización normativa o tecnológica, pues permite mantener un repositorio siempre accesible y fácilmente actualizable.","Evita que l'alumnat navegue de manera dispersa per internet a la recerca d'informació, ja que el docent prefiltra i organitza prèviament els recursos rellevants. Això resulta especialment valuós per a qui ensenya continguts tècnics amb actualització normativa o tecnològica constant, perquè permet mantenir un repositori sempre accessible i fàcilment actualitzable."]},{"t":"h3","x":["Tutorial breve","Tutorial breu"]},{"t":"list","k":"ol","l":1,"items":[["Se crea una cuenta gratuita y se accede al panel principal (\"webmix\").","Es crea un compte gratuït i s'accedeix al panell principal (\"webmix\")."],["Cada recurso se añade como una \"baldosa\" (tile), asignándole una URL, un icono y un color identificativo.","Cada recurs s'afegeix com una \"rajola\" (tile), assignant-li una URL, una icona i un color identificatiu."],["Las baldosas se agrupan por pestañas temáticas (por ejemplo, \"Normativa\", \"Recursos audiovisuales\", \"Bancos de imágenes\").","Les rajoles s'agrupen per pestanyes temàtiques (per exemple, \"Normativa\", \"Recursos audiovisuals\", \"Bancs d'imatges\")."],["El panel puede compartirse mediante un enlace público o embeberse en un blog o entorno virtual de aprendizaje.","El panell es pot compartir mitjançant un enllaç públic o incrustar-se en un blog o entorn virtual d'aprenentatge."],["Symbaloo permite duplicar webmixes ya creados por otros docentes desde su galería pública, adaptándolos posteriormente a las necesidades propias.","Symbaloo permet duplicar webmixes ja creats per altres docents des de la seua galeria pública, adaptant-los posteriorment a les necessitats pròpies."]],"start":1},{"t":"links","title":null,"items":[{"i":"tiles","x":["Symbaloo","Symbaloo"],"d":["Herramienta de curación con paneles de baldosas (webmix).","Eina de curació amb panells de rajoles (webmix)."],"url":"https://www.symbaloo.com/"},{"i":"share","x":["Procomún (INTEF)","Procomún (INTEF)"],"d":["Repositorio de recursos educativos abiertos.","Repositori de recursos educatius oberts."],"url":"https://procomun.intef.es/"}]}],"acts":["S6-A5"],"videos":[],"visuals":[{"type":"cards","title":["Así se organiza un webmix por pestañas temáticas (ejemplo del tutorial)","Així s'organitza un webmix per pestanyes temàtiques (exemple del tutorial)"],"items":[{"i":"gavel","s":"info","x":["Normativa","Normativa"],"d":["Baldosas con enlaces a la normativa del sector.","Rajoles amb enllaços a la normativa del sector."]},{"i":"video","s":"info","x":["Recursos audiovisuales","Recursos audiovisuals"],"d":["Baldosas con vídeos seleccionados.","Rajoles amb vídeos seleccionats."]},{"i":"eye","s":"info","x":["Bancos de imágenes","Bancs d'imatges"],"d":["Baldosas con bancos de imágenes.","Rajoles amb bancs d'imatges."]}],"note":["En la página del manual aparece una captura de un panel de Symbaloo EDU con baldosas de colores.","A la pàgina del manual apareix una captura d'un panell de Symbaloo EDU amb rajoles de colors."]}]}],"final":[],"acts":[{"id":"S6-conc","type":"match","time":["7 min","7 min"],"title":["Conceptos de organización y curación","Conceptes d'organització i curació"],"pairs":[{"a":["Catalogación","Catalogació"],"b":["Clasificar los recursos siguiendo criterios coherentes y estables","Classificar els recursos seguint criteris coherents i estables"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Metadatos","Metadades"],"b":["Datos que describen otros datos, como el autor o la licencia","Dades que descriuen altres dades, com l'autor o la llicència"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Curación de contenidos","Curació de continguts"],"b":["Filtrar, seleccionar, organizar y compartir aportando valor añadido","Filtrar, seleccionar, organitzar i compartir aportant valor afegit"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Repositorio personal","Repositori personal"],"b":["Colección de recursos seleccionados y contrastados, organizados de forma temática","Col·lecció de recursos seleccionats i contrastats, organitzats de manera temàtica"],"exp":["Epígrafe 2.","Epígraf 2."]},{"a":["Webmix","Webmix"],"b":["Panel principal de Symbaloo","Panell principal de Symbaloo"],"exp":["Tutorial de Symbaloo, paso 1.","Tutorial de Symbaloo, pas 1."]},{"a":["Baldosa","Rajola"],"b":["Recurso con una URL, un icono y un color identificativo","Recurs amb una URL, una icona i un color identificatiu"],"exp":["Tutorial de Symbaloo, paso 2.","Tutorial de Symbaloo, pas 2."]}],"block":"S6","origin":"complementaria","ra":"RA2","ce":""},{"id":"S6-A5","solution":[["Panel Symbaloo: \"Técnicas de servicio en sala\".","Panell Symbaloo: «Tècniques de servei en sala»."],["Criterio de clasificación empleado: el panel se organiza mediante tres pestañas (\"tabs\") dentro del mismo webmix de Symbaloo, correspondientes a las fases del servicio: preparación de la sala, técnicas de servicio y protocolo con el cliente. Cada recurso se representa como una baldosa individual, con un color e icono identificativo según el tipo de contenido (imagen, vídeo o documento), lo que permite al alumnado reconocer visualmente la naturaleza del recurso antes de acceder a él.","Criteri de classificació emprat: el panell s'organitza mitjançant tres pestanyes («tabs») dins del mateix webmix de Symbaloo, corresponents a les fases del servei: preparació de la sala, tècniques de servei i protocol amb el client. Cada recurs es representa com una rajola individual, amb un color i una icona identificatius segons el tipus de contingut (imatge, vídeo o document), cosa que permet a l'alumnat reconéixer visualment la naturalesa del recurs abans d'accedir-hi."],["Pestaña 1: Preparación de la sala.","Pestanya 1: Preparació de la sala."],["• Baldosa \"Montaje de mesa\": enlaza a un banco de imágenes de un repositorio educativo institucional de Hostelería y Turismo, con fotografías de disposición de cubertería y mise en place. Color/icono: verde, icono de mesa servida. Licencia: Creative Commons Reconocimiento-NoComercial (CC BY-NC).","• Rajola «Muntatge de taula»: enllaça a un banc d'imatges d'un repositori educatiu institucional d'Hoteleria i Turisme, amb fotografies de disposició de coberts i mise en place. Color/icona: verd, icona de taula parada. Llicència: Creative Commons Reconeixement-NoComercial (CC BY-NC)."],["Pestaña 2: Técnicas de servicio.","Pestanya 2: Tècniques de servei."],["• Baldosa \"Servicio a la francesa e inglesa\": enlaza a un vídeo tutorial alojado en un repositorio audiovisual educativo abierto. Color/icono: azul, icono de bandeja. Licencia: Creative Commons Reconocimiento-CompartirIgual (CC BY-SA).","• Rajola «Servei a la francesa i a l'anglesa»: enllaça a un vídeo tutorial allotjat en un repositori audiovisual educatiu obert. Color/icona: blau, icona de safata. Llicència: Creative Commons Reconeixement-CompartirIgual (CC BY-SA)."],["• Baldosa \"Trinchado y flambeado\": enlaza a un vídeo demostrativo del repositorio institucional del centro. Color/icono: naranja, icono de llama. Licencia: Creative Commons Reconocimiento (CC BY).","• Rajola «Trinxat i flamejat»: enllaça a un vídeo demostratiu del repositori institucional del centre. Color/icona: taronja, icona de flama. Llicència: Creative Commons Reconeixement (CC BY)."],["Pestaña 3: Protocolo y atención al cliente.","Pestanya 3: Protocol i atenció al client."],["• Baldosa \"Protocolo de sala\": enlaza a un documento descargable de un repositorio educativo abierto sobre atención al comensal y gestión de reclamaciones. Color/icono: morado, icono de documento. Licencia: Creative Commons Reconocimiento-SinObraDerivada (CC BY-ND).","• Rajola «Protocol de sala»: enllaça a un document descarregable d'un repositori educatiu obert sobre atenció al comensal i gestió de reclamacions. Color/icona: morat, icona de document. Llicència: Creative Commons Reconeixement-SenseObraDerivada (CC BY-ND)."],["• Baldosa \"Maridaje y presentación de bebidas\": enlaza a un banco de imágenes de libre acceso. Color/icono: amarillo, icono de copa. Licencia: dominio público (CC0).","• Rajola «Maridatge i presentació de begudes»: enllaça a un banc d'imatges de lliure accés. Color/icona: groc, icona de copa. Llicència: domini públic (CC0)."],["Justificación del criterio de clasificación: la distribución en pestañas reproduce dentro del propio panel Symbaloo la secuencia real del servicio en sala, de modo que el alumnado navega por el webmix siguiendo el mismo orden en que se desarrolla el trabajo (preparación, ejecución del servicio y atención al cliente). La codificación por colores e iconos facilita, además, la identificación rápida del tipo de recurso sin necesidad de abrir cada baldosa, lo que resulta especialmente útil en dispositivos móviles o en consultas rápidas durante la práctica. Todos los recursos enlazados cuentan con licencias abiertas o de reconocimiento, garantizando su uso legítimo con fines educativos.","Justificació del criteri de classificació: la distribució en pestanyes reprodueix dins del mateix panell Symbaloo la seqüència real del servei en sala, de manera que l'alumnat navega pel webmix seguint el mateix ordre en què es desenvolupa el treball (preparació, execució del servei i atenció al client). La codificació per colors i icones facilita, a més, la identificació ràpida del tipus de recurs sense necessitat d'obrir cada rajola, cosa que resulta especialment útil en dispositius mòbils o en consultes ràpides durant la pràctica. Tots els recursos enllaçats tenen llicències obertes o de reconeixement, cosa que en garanteix l'ús legítim amb finalitats educatives."]],"type":"teacher","origin":"manual","time":["30 min","30 min"],"timeManual":["30 minutos","30 minuts"],"kind":["Actividad de búsqueda de información y síntesis","Activitat de cerca d'informació i síntesi"],"group":["Individual","Individual"],"mode":["Telemática","Telemàtica"],"ce":["Curación y organización de recursos digitales educativos","Curació i organització de recursos digitals educatius"],"title":["Actividad 5. Panel temático de recursos de servicio en sala","Activitat 5. Panell temàtic de recursos de servei en sala"],"instr":["En el ámbito de la familia profesional de Hostelería, seleccione cinco recursos digitales de libre acceso (repositorios institucionales, bancos de imágenes o vídeos bajo licencia abierta) relacionados con técnicas de servicio en sala. Organícelos en un panel temático, justificando en un breve texto el criterio de clasificación empleado y la licencia de uso de cada recurso.","En l'àmbit de la família professional d'Hostaleria, seleccione cinc recursos digitals d'accés lliure (repositoris institucionals, bancs d'imatges o vídeos amb llicència oberta) relacionats amb tècniques de servei en sala. Organitze'ls en un panell temàtic, justificant en un breu text el criteri de classificació emprat i la llicència d'ús de cada recurs."],"grid":{"cols":[["Recurso (título y enlace)","Recurs (títol i enllaç)"],["Tipo (repositorio, imagen o vídeo)","Tipus (repositori, imatge o vídeo)"],["Pestaña o categoría del panel","Pestanya o categoria del panell"],["Licencia de uso","Llicència d'ús"]],"rows":5},"fields":[["Enlace al panel temático (si lo has creado en Symbaloo u otra herramienta).","Enllaç al panell temàtic (si l'has creat a Symbaloo o en una altra eina)."],["Criterio de clasificación empleado (breve texto).","Criteri de classificació emprat (text breu)."]],"block":"S6","ra":"RA2"}],"notes":[],"cover":{"signs":[["info","folder",["Catalogación","Catalogació"]],["info","tag",["Metadatos","Metadades"]],["safe","filter",["Curación de contenidos","Curació de continguts"]],["info","tiles",["Symbaloo","Symbaloo"]]],"lead":["La acumulación desordenada de recursos digitales, lejos de constituir una ventaja, se convierte con frecuencia en un obstáculo.","L'acumulació desordenada de recursos digitals, lluny de constituir un avantatge, es converteix sovint en un obstacle."]},"art":"tiles"},{"id":"S7","ud":"RA2","title":["Criterios didácticos y de calidad en la selección y creación de recursos digitales","Criteris didàctics i de qualitat en la selecció i creació de recursos digitals"],"meta":{"ra_fp":"RA2"},"sections":[{"num":4,"kind":"theory","title":["Criterios didácticos y de calidad en la selección y creación de recursos digitales","Criteris didàctics i de qualitat en la selecció i creació de recursos digitals"],"nodes":[{"t":"p","x":["No todo contenido digital disponible en internet resulta adecuado para su empleo en un contexto formativo, aun cuando pueda resultar técnicamente correcto o estar bien elaborado desde un punto de vista estético. La selección de recursos educativos digitales exige la aplicación de criterios didácticos, técnicos y científicos que garanticen su pertinencia para una acción formativa concreta. Entre los criterios didácticos cabe considerar la coherencia del recurso con los objetivos de aprendizaje perseguidos, su adecuación al nivel competencial del alumnado destinatario, y su capacidad para favorecer la participación activa y no meramente pasiva del alumnado. Entre los criterios técnicos se incluyen aspectos como la calidad de la resolución, la compatibilidad con los dispositivos y plataformas empleados en el centro, o la accesibilidad del recurso para personas con necesidades específicas. Entre los criterios científicos se sitúa la exactitud y actualidad de la información transmitida, así como el rigor de las fuentes en que se basa.","No tot contingut digital disponible a internet resulta adequat per a fer-lo servir en un context formatiu, encara que puga resultar tècnicament correcte o estar ben elaborat des d'un punt de vista estètic. La selecció de recursos educatius digitals exigeix l'aplicació de criteris didàctics, tècnics i científics que en garantisquen la pertinència per a una acció formativa concreta. Entre els criteris didàctics cal considerar la coherència del recurs amb els objectius d'aprenentatge perseguits, la seua adequació al nivell competencial de l'alumnat destinatari, i la seua capacitat per a afavorir la participació activa i no merament passiva de l'alumnat. Entre els criteris tècnics s'inclouen aspectes com la qualitat de la resolució, la compatibilitat amb els dispositius i plataformes emprats al centre, o l'accessibilitat del recurs per a persones amb necessitats específiques. Entre els criteris científics se situa l'exactitud i actualitat de la informació transmesa, així com el rigor de les fonts en què es basa."]},{"t":"viz","v":{"type":"compare","title":["Criterios para seleccionar recursos educativos digitales","Criteris per a seleccionar recursos educatius digitals"],"cols":[{"i":"learn","s":"info","x":["Didácticos","Didàctics"],"items":[["Coherencia con los objetivos de aprendizaje","Coherència amb els objectius d'aprenentatge"],["Adecuación al nivel competencial","Adequació al nivell competencial"],["Participación activa del alumnado","Participació activa de l'alumnat"]]},{"i":"gear","s":"info","x":["Técnicos","Tècnics"],"items":[["Calidad de la resolución","Qualitat de la resolució"],["Compatibilidad con dispositivos y plataformas","Compatibilitat amb dispositius i plataformes"],["Accesibilidad para personas con necesidades específicas","Accessibilitat per a persones amb necessitats específiques"]]},{"i":"flask","s":"info","x":["Científicos","Científics"],"items":[["Exactitud y actualidad de la información","Exactitud i actualitat de la informació"],["Rigor de las fuentes","Rigor de les fonts"]]}]}},{"t":"p","x":["Junto a la selección de contenidos ya existentes, el profesorado desarrolla con frecuencia la tarea de crear, adaptar y modificar contenidos digitales propios, ajustándolos a los objetivos de aprendizaje concretos de cada acción formativa, al contexto en que esta se desarrolla, al enfoque pedagógico adoptado y a las características específicas de las personas destinatarias. Esta labor de creación y adaptación debe realizarse garantizando siempre la accesibilidad universal de los materiales producidos, entendida como la posibilidad de que dichos contenidos puedan ser utilizados por el mayor número posible de personas, con independencia de sus capacidades funcionales, sin necesidad de adaptaciones posteriores. Entre las medidas más habituales para garantizar esta accesibilidad se encuentran la incorporación de subtítulos y transcripciones en los materiales audiovisuales, el uso de un contraste de color adecuado y de tipografías legibles en los documentos, la estructuración clara de los textos mediante encabezados y listas, o la descripción alternativa de las imágenes empleadas.","Al costat de la selecció de continguts ja existents, el professorat desenvolupa sovint la tasca de crear, adaptar i modificar continguts digitals propis, ajustant-los als objectius d'aprenentatge concrets de cada acció formativa, al context en què es desenvolupa, a l'enfocament pedagògic adoptat i a les característiques específiques de les persones destinatàries. Aquesta tasca de creació i adaptació s'ha de fer garantint sempre l'accessibilitat universal dels materials produïts, entesa com la possibilitat que aquests continguts puguen ser utilitzats pel nombre més gran possible de persones, amb independència de les seues capacitats funcionals, sense necessitat d'adaptacions posteriors. Entre les mesures més habituals per a garantir aquesta accessibilitat hi ha la incorporació de subtítols i transcripcions en els materials audiovisuals, l'ús d'un contrast de color adequat i de tipografies llegibles en els documents, l'estructuració clara dels textos mitjançant encapçalaments i llistes, o la descripció alternativa de les imatges emprades."]},{"t":"viz","v":{"type":"cards","title":["Medidas habituales de accesibilidad universal","Mesures habituals d'accessibilitat universal"],"items":[{"i":"subtitle","s":"safe","x":["Subtítulos y transcripciones en el material audiovisual","Subtítols i transcripcions en el material audiovisual"]},{"i":"eye","s":"safe","x":["Contraste de color adecuado","Contrast de color adequat"]},{"i":"doc","s":"safe","x":["Tipografías legibles","Tipografies llegibles"]},{"i":"layers","s":"safe","x":["Encabezados y listas para estructurar el texto","Encapçalaments i llistes per a estructurar el text"]},{"i":"chat","s":"safe","x":["Descripción alternativa de las imágenes","Descripció alternativa de les imatges"]}]}},{"t":"p","x":["A la hora de compartir los contenidos digitales creados o seleccionados, resulta necesario emplear formatos estandarizados, es decir, formatos de archivo ampliamente reconocidos y compatibles con la mayoría de dispositivos y plataformas, dentro de entornos colaborativos seguros que garanticen la protección de la información y el control sobre quién puede acceder, modificar o distribuir los materiales compartidos. El empleo de formatos propietarios poco extendidos, o la compartición de contenidos a través de canales no controlados por el centro educativo, puede generar problemas de compatibilidad, pérdida de información o vulnerabilidades en materia de seguridad digital.","A l'hora de compartir els continguts digitals creats o seleccionats, cal emprar formats estandarditzats, és a dir, formats d'arxiu àmpliament reconeguts i compatibles amb la majoria de dispositius i plataformes, dins d'entorns col·laboratius segurs que garantisquen la protecció de la informació i el control sobre qui pot accedir, modificar o distribuir els materials compartits. L'ús de formats propietaris poc estesos, o la compartició de continguts a través de canals no controlats pel centre educatiu, pot generar problemes de compatibilitat, pèrdua d'informació o vulnerabilitats en matèria de seguretat digital."]},{"t":"viz","v":{"type":"compare","vs":true,"title":["Al compartir los materiales","En compartir els materials"],"cols":[{"i":"check","s":"safe","x":["Recomendado","Recomanat"],"items":[["Formatos estandarizados","Formats estandarditzats"],["Entornos colaborativos seguros","Entorns col·laboratius segurs"]]},{"i":"alert","s":"ban","x":["Riesgo","Risc"],"items":[["Formatos propietarios poco extendidos","Formats propietaris poc estesos"],["Canales no controlados por el centro educativo","Canals no controlats pel centre educatiu"]]}]}},{"t":"p","x":["Toda esta labor de selección, creación y compartición de contenidos digitales debe desarrollarse desde una actitud proactiva y crítica, que lleve al docente a cuestionarse de manera sistemática la fiabilidad de las fuentes consultadas y a aplicar de forma rigurosa las políticas de privacidad y protección de datos personales vigentes, evitando la difusión de información que pudiera vulnerar los derechos del alumnado o de terceras personas. Esta actitud crítica se extiende también a la valoración de los modelos de calidad de contenidos digitales existentes en el mercado educativo, respecto de los cuales el profesorado debe desarrollar capacidad de análisis, siendo capaz de formular propuestas de mejora realistas y ajustadas al contexto formativo concreto en que desarrolla su labor, en lugar de asumir de manera acrítica los estándares de calidad definidos por terceros.","Tota aquesta tasca de selecció, creació i compartició de continguts digitals s'ha de desenvolupar des d'una actitud proactiva i crítica, que porte el docent a qüestionar-se de manera sistemàtica la fiabilitat de les fonts consultades i a aplicar de manera rigorosa les polítiques de privacitat i protecció de dades personals vigents, evitant la difusió d'informació que poguera vulnerar els drets de l'alumnat o de terceres persones. Aquesta actitud crítica s'estén també a la valoració dels models de qualitat de continguts digitals existents en el mercat educatiu, respecte dels quals el professorat ha de desenvolupar capacitat d'anàlisi, i ha de ser capaç de formular propostes de millora realistes i ajustades al context formatiu concret en què desenvolupa la seua tasca, en lloc d'assumir de manera acrítica els estàndards de qualitat definits per tercers."]},{"t":"links","title":null,"items":[{"i":"access","x":["Pautas WCAG 2 (W3C)","Pautes WCAG 2 (W3C)"],"d":["Resumen en español de las pautas de accesibilidad para el contenido web.","Resum en castellà de les pautes d'accessibilitat per al contingut web."],"url":"https://www.w3.org/WAI/standards-guidelines/wcag/es"},{"i":"book","x":["CEDEC (INTEF)","CEDEC (INTEF)"],"d":["Centro Nacional de Desarrollo Curricular en Sistemas no Propietarios: guías y REA.","Centre Nacional de Desenvolupament Curricular en Sistemes no Propietaris: guies i REA (en castellà)."],"url":"https://cedec.intef.es/"}]}],"acts":["S7-crit","S7-A6"],"videos":[]}],"final":[],"acts":[{"id":"S7-crit","type":"classify","time":["7 min","7 min"],"title":["¿Qué tipo de criterio es?","Quin tipus de criteri és?"],"cats":[["Didáctico","Didàctic"],["Técnico","Tècnic"],["Científico","Científic"]],"items":[{"x":["El vídeo trabaja exactamente el resultado de aprendizaje de la sesión.","El vídeo treballa exactament el resultat d'aprenentatge de la sessió."],"c":0,"exp":["Coherencia con los objetivos de aprendizaje: criterio didáctico.","Coherència amb els objectius d'aprenentatge: criteri didàctic."]},{"x":["La infografía tiene una resolución suficiente para proyectarla.","La infografia té una resolució suficient per a projectar-la."],"c":1,"exp":["Calidad de la resolución: criterio técnico.","Qualitat de la resolució: criteri tècnic."]},{"x":["Los datos del documento están actualizados.","Les dades del document estan actualitzades."],"c":2,"exp":["Exactitud y actualidad: criterio científico.","Exactitud i actualitat: criteri científic."]},{"x":["El recurso se adapta al nivel competencial del grupo.","El recurs s'adapta al nivell competencial del grup."],"c":0,"exp":["Adecuación al nivel competencial: criterio didáctico.","Adequació al nivell competencial: criteri didàctic."]},{"x":["Funciona en los móviles y en la plataforma del centro.","Funciona en els mòbils i en la plataforma del centre."],"c":1,"exp":["Compatibilidad con dispositivos y plataformas: criterio técnico.","Compatibilitat amb dispositius i plataformes: criteri tècnic."]},{"x":["Cita fuentes rigurosas.","Cita fonts rigoroses."],"c":2,"exp":["Rigor de las fuentes: criterio científico.","Rigor de les fonts: criteri científic."]},{"x":["Pide al alumnado que responda y no solo que mire.","Demana a l'alumnat que responga i no només que mire."],"c":0,"exp":["Favorecer la participación activa: criterio didáctico.","Afavorir la participació activa: criteri didàctic."]},{"x":["Es accesible para personas con necesidades específicas.","És accessible per a persones amb necessitats específiques."],"c":1,"exp":["El manual sitúa la accesibilidad del recurso entre los criterios técnicos.","El manual situa l'accessibilitat del recurs entre els criteris tècnics."]}],"block":"S7","origin":"complementaria","ra":"RA2","ce":""},{"id":"S7-A6","solution":[["(Comparación de dos recursos y debate)","(Comparació de dos recursos i debat)"],["Se trata de una actividad grupal sobre recursos elegidos por el propio grupo, por lo que la corrección debe centrarse en el proceso más que en un resultado único. La tabla comparativa debe aplicar de forma explícita los criterios didácticos, técnicos, científicos y de accesibilidad universal explicados en el epígrafe (por ejemplo: adecuación al nivel del alumnado, calidad de resolución, actualidad de la información, presencia de subtítulos o texto alternativo). La propuesta de mejora del recurso peor valorado debe ser concreta y aplicable (por ejemplo, \"añadir subtítulos\" es válido; \"hacerlo mejor\" no lo es). Se valorará que el grupo argumente su elección final con criterios explícitos y no solo con preferencia estética.","Es tracta d'una activitat grupal sobre recursos triats pel mateix grup, per la qual cosa la correcció s'ha de centrar en el procés més que en un resultat únic. La taula comparativa ha d'aplicar de manera explícita els criteris didàctics, tècnics, científics i d'accessibilitat universal explicats en l'epígraf (per exemple: adequació al nivell de l'alumnat, qualitat de resolució, actualitat de la informació, presència de subtítols o text alternatiu). La proposta de millora del recurs pitjor valorat ha de ser concreta i aplicable (per exemple, «afegir subtítols» és vàlid; «fer-lo millor» no ho és). Es valorarà que el grup argumente la seua elecció final amb criteris explícits i no només per preferència estètica."]],"type":"teacher","origin":"manual","time":["38 min (análisis 25 min + debate 13 min)","38 min (anàlisi 25 min + debat 13 min)"],"timeManual":["1 hora","1 hora"],"kind":["Debate grupal y puesta en común","Debat grupal i posada en comú"],"group":["Grupal (grupos de cuatro o cinco personas), con puesta en común posterior","Grupal (grups de quatre o cinc persones), amb posada en comú posterior"],"mode":["Presencial","Presencial"],"ce":"e), h), i), j)","title":["Actividad 6. Comparamos dos recursos digitales","Activitat 6. Comparem dos recursos digitals"],"instr":["En pequeños grupos, analizad dos recursos educativos digitales reales sobre un mismo contenido curricular (por ejemplo, dos vídeos, dos infografías o dos documentos explicativos), previamente seleccionados por el docente o por el propio grupo. Evaluad ambos recursos aplicando los criterios didácticos, técnicos y científicos explicados en este epígrafe, así como los criterios de accesibilidad universal. Elaborad una tabla comparativa sencilla que recoja las fortalezas y debilidades de cada recurso, y formulad una propuesta de mejora concreta para el recurso que consideréis de menor calidad. Compartid vuestras conclusiones en un debate conjunto con el resto de la clase, argumentando por qué priorizaríais el uso de uno u otro recurso en una acción formativa real.","En grups reduïts, analitzeu dos recursos educatius digitals reals sobre un mateix contingut curricular (per exemple, dos vídeos, dues infografies o dos documents explicatius), seleccionats prèviament pel docent o pel mateix grup. Avalueu tots dos recursos aplicant els criteris didàctics, tècnics i científics explicats en aquest epígraf, així com els criteris d'accessibilitat universal. Elaboreu una taula comparativa senzilla que recull les fortaleses i debilitats de cada recurs, i formuleu una proposta de millora concreta per al recurs que considereu de menys qualitat. Compartiu les vostres conclusions en un debat conjunt amb la resta de la classe, argumentant per què prioritzaríeu l'ús d'un o altre recurs en una acció formativa real."],"grid":{"cols":[["Criterio (didáctico, técnico, científico o de accesibilidad)","Criteri (didàctic, tècnic, científic o d'accessibilitat)"],["Recurso A: fortalezas y debilidades","Recurs A: fortaleses i debilitats"],["Recurso B: fortalezas y debilidades","Recurs B: fortaleses i debilitats"]],"rows":4},"fields":[["Recursos analizados (título y enlace de cada uno) e integrantes del grupo.","Recursos analitzats (títol i enllaç de cadascun) i integrants del grup."],["Propuesta de mejora concreta para el recurso de menor calidad.","Proposta de millora concreta per al recurs de menys qualitat."],["Conclusiones del debate: ¿qué recurso priorizaríais en una acción formativa real y por qué?","Conclusions del debat: quin recurs prioritzaríeu en una acció formativa real i per què?"]],"block":"S7","ra":"RA2"}],"notes":[],"cover":{"signs":[["info","learn",["Criterios didácticos","Criteris didàctics"]],["info","gear",["Criterios técnicos","Criteris tècnics"]],["info","flask",["Criterios científicos","Criteris científics"]],["safe","access",["Accesibilidad universal","Accessibilitat universal"]]],"lead":["No todo contenido digital disponible en internet resulta adecuado para su empleo en un contexto formativo.","No tot contingut digital disponible a internet resulta adequat per a fer-lo servir en un context formatiu."]},"art":"star"},{"id":"S8","ud":"RA2","title":["Propiedad intelectual, derechos de autor y licencias. Evaluación final del RA2","Propietat intel·lectual, drets d'autor i llicències. Avaluació final del RA2"],"meta":{"ra_fp":"RA2"},"sections":[{"num":5,"kind":"theory","title":["Propiedad intelectual, derechos de autor y licencias en el entorno educativo","Propietat intel·lectual, drets d'autor i llicències en l'entorn educatiu"],"nodes":[{"t":"p","x":["El uso educativo de contenidos digitales no exime al profesorado del cumplimiento de la normativa vigente en materia de propiedad intelectual y derechos de autor. Aunque en ocasiones se asume erróneamente que la finalidad didáctica de un uso concreto justifica automáticamente la reproducción, distribución o comunicación pública de cualquier contenido, lo cierto es que la legislación española, en línea con la normativa europea, establece límites precisos que el docente debe conocer y respetar.","L'ús educatiu de continguts digitals no eximeix el professorat del compliment de la normativa vigent en matèria de propietat intel·lectual i drets d'autor. Encara que de vegades s'assumeix erròniament que la finalitat didàctica d'un ús concret justifica automàticament la reproducció, distribució o comunicació pública de qualsevol contingut, el cert és que la legislació espanyola, en línia amb la normativa europea, estableix límits precisos que el docent ha de conéixer i respectar."]},{"t":"p","x":["El derecho de autor protege las obras originales frente a determinados usos no autorizados, entre los que se incluyen la reproducción, entendida como la realización de copias de la obra; la distribución, referida a la puesta a disposición del público del original o de copias mediante venta, alquiler, préstamo o cualquier otra forma; y la comunicación pública, que engloba cualquier acto por el que una pluralidad de personas pueda tener acceso a la obra sin previa distribución de ejemplares, como sucede al proyectar un vídeo en el aula, publicarlo en una plataforma abierta o compartirlo en un entorno virtual de aprendizaje al que tenga acceso un número indeterminado de personas.","El dret d'autor protegeix les obres originals davant de determinats usos no autoritzats, entre els quals s'inclouen la reproducció, entesa com la realització de còpies de l'obra; la distribució, referida a la posada a disposició del públic de l'original o de còpies mitjançant venda, lloguer, préstec o qualsevol altra forma; i la comunicació pública, que engloba qualsevol acte pel qual una pluralitat de persones puga tenir accés a l'obra sense distribució prèvia d'exemplars, com succeeix en projectar un vídeo a l'aula, publicar-lo en una plataforma oberta o compartir-lo en un entorn virtual d'aprenentatge a què tinga accés un nombre indeterminat de persones."]},{"t":"viz","v":{"type":"cards","title":["Usos que protege el derecho de autor","Usos que protegeix el dret d'autor"],"items":[{"i":"copy","s":"ban","x":["Reproducción","Reproducció"],"d":["Realización de copias de la obra.","Realització de còpies de l'obra."]},{"i":"share","s":"ban","x":["Distribución","Distribució"],"d":["Poner a disposición del público el original o copias (venta, alquiler, préstamo…).","Posar a disposició del públic l'original o còpies (venda, lloguer, préstec…)."]},{"i":"megaphone","s":"ban","x":["Comunicación pública","Comunicació pública"],"d":["Acceso de una pluralidad de personas sin distribución previa de ejemplares (proyectar un vídeo en el aula, publicarlo en abierto…).","Accés d'una pluralitat de persones sense distribució prèvia d'exemplars (projectar un vídeo a l'aula, publicar-lo en obert…)."]}]}},{"t":"p","x":["La normativa contempla, no obstante, determinados límites al derecho de autor aplicables al ámbito educativo, que permiten, bajo ciertas condiciones, el uso de fragmentos de obras protegidas con fines de ilustración en la enseñanza, siempre que dicho uso se realice sin finalidad comercial, se limite a lo estrictamente necesario para el objetivo perseguido y se indique la fuente y el nombre del autor, salvo que resulte imposible. Estos límites, sin embargo, no equivalen a una autorización general para el uso indiscriminado de cualquier contenido con fines docentes, por lo que el profesorado debe conocer con precisión su alcance y no asumir de forma acrítica que cualquier uso educativo se encuentra automáticamente amparado por ellos.","La normativa contempla, no obstant això, determinats límits al dret d'autor aplicables a l'àmbit educatiu, que permeten, sota certes condicions, l'ús de fragments d'obres protegides amb finalitats d'il·lustració en l'ensenyament, sempre que aquest ús es faça sense finalitat comercial, es limite al que és estrictament necessari per a l'objectiu perseguit i s'indique la font i el nom de l'autor, llevat que resulte impossible. Aquests límits, no obstant això, no equivalen a una autorització general per a l'ús indiscriminat de qualsevol contingut amb finalitats docents, per la qual cosa el professorat n'ha de conéixer amb precisió l'abast i no assumir de manera acrítica que qualsevol ús educatiu es troba automàticament emparat per aquests."]},{"t":"viz","v":{"type":"steps","title":["Condiciones del límite educativo (uso de fragmentos con fines de ilustración)","Condicions del límit educatiu (ús de fragments amb finalitats d'il·lustració)"],"items":[{"i":"euro","s":"must","x":["Sin finalidad comercial","Sense finalitat comercial"]},{"i":"measure","s":"must","x":["Limitado a lo estrictamente necesario para el objetivo perseguido","Limitat al que és estrictament necessari per a l'objectiu perseguit"]},{"i":"doc","s":"must","x":["Indicando la fuente y el nombre del autor, salvo que resulte imposible","Indicant la font i el nom de l'autor, llevat que resulte impossible"]}]}},{"t":"p","x":["Junto al conocimiento de estos límites legales, resulta fundamental que el profesorado conozca los distintos tipos de licencias que regulan el uso de los contenidos digitales, y las condiciones de uso asociadas a cada una de ellas. Existen, en primer lugar, obras protegidas bajo el régimen ordinario de derechos de autor, que exigen autorización expresa del titular para cualquier uso que exceda los límites legales mencionados. Existen, en segundo lugar, contenidos publicados bajo licencias abiertas, entre las que destacan las licencias del tipo Creative Commons, que permiten al autor autorizar de manera flexible determinados usos de su obra, como la reproducción, la distribución o la creación de obras derivadas, estableciendo al mismo tiempo condiciones específicas, como la exigencia de atribución de autoría, la prohibición de usos comerciales, o la obligación de compartir bajo la misma licencia cualquier obra derivada que se produzca. Existen, finalmente, contenidos de dominio público, cuyos derechos de explotación económica han expirado por el transcurso del plazo legal establecido, y que pueden ser utilizados libremente sin necesidad de autorización ni de atribución, si bien resulta una buena práctica pedagógica y ética mencionar siempre la fuente y autoría original cuando esta sea conocida.","Al costat del coneixement d'aquests límits legals, resulta fonamental que el professorat conega els diferents tipus de llicències que regulen l'ús dels continguts digitals, i les condicions d'ús associades a cadascuna. Hi ha, en primer lloc, obres protegides sota el règim ordinari de drets d'autor, que exigeixen autorització expressa del titular per a qualsevol ús que excedisca els límits legals esmentats. Hi ha, en segon lloc, continguts publicats amb llicències obertes, entre les quals destaquen les llicències del tipus Creative Commons, que permeten a l'autor autoritzar de manera flexible determinats usos de la seua obra, com la reproducció, la distribució o la creació d'obres derivades, i estableixen alhora condicions específiques, com l'exigència d'atribució d'autoria, la prohibició d'usos comercials, o l'obligació de compartir amb la mateixa llicència qualsevol obra derivada que es produïsca. Hi ha, finalment, continguts de domini públic, els drets d'explotació econòmica dels quals han expirat pel transcurs del termini legal establit, i que es poden utilitzar lliurement sense necessitat d'autorització ni d'atribució, si bé és una bona pràctica pedagògica i ètica esmentar sempre la font i l'autoria original quan siga coneguda."]},{"t":"viz","v":{"type":"compare","title":["Tres situaciones de los contenidos digitales","Tres situacions dels continguts digitals"],"cols":[{"i":"lock","s":"ban","x":["Régimen ordinario de derechos de autor","Règim ordinari de drets d'autor"],"items":[["Autorización expresa del titular para cualquier uso que exceda los límites legales","Autorització expressa del titular per a qualsevol ús que excedisca els límits legals"]]},{"i":"cc","s":"safe","x":["Licencias abiertas (Creative Commons)","Llicències obertes (Creative Commons)"],"items":[["Usos autorizados de forma flexible","Usos autoritzats de manera flexible"],["Con condiciones: atribución, uso no comercial, compartir igual…","Amb condicions: atribució, ús no comercial, compartir igual…"]]},{"i":"public","s":"info","x":["Dominio público","Domini públic"],"items":[["Derechos de explotación económica expirados","Drets d'explotació econòmica expirats"],["Uso libre; buena práctica: citar la fuente y la autoría","Ús lliure; bona pràctica: citar la font i l'autoria"]]}]}},{"t":"p","x":["El conocimiento riguroso de estos aspectos normativos no debe entenderse como una limitación excesiva a la labor creativa del docente, sino como una garantía tanto para la protección de los derechos de terceras personas como para la propia seguridad jurídica del profesorado y del centro educativo. Además, el conocimiento y la correcta aplicación de esta normativa por parte del profesorado constituye, en sí misma, una oportunidad pedagógica, en la medida en que permite trasladar al alumnado una actitud de respeto hacia la propiedad intelectual ajena que resulta perfectamente trasladable a su futuro desempeño profesional.","El coneixement rigorós d'aquests aspectes normatius no s'ha d'entendre com una limitació excessiva a la tasca creativa del docent, sinó com una garantia tant per a la protecció dels drets de terceres persones com per a la mateixa seguretat jurídica del professorat i del centre educatiu. A més, el coneixement i la correcta aplicació d'aquesta normativa per part del professorat constitueix, en si mateixa, una oportunitat pedagògica, en la mesura que permet traslladar a l'alumnat una actitud de respecte cap a la propietat intel·lectual aliena que és perfectament traslladable al seu futur exercici professional."]},{"t":"h3","x":["Licencias Creative Commons","Llicències Creative Commons"]},{"t":"table","rows":[[["Licencia","Llicència"],["Permite","Permet"],["Siempre que","Sempre que"]],[["Reconocimiento (BY)","Reconeixement (BY)"],["Compartir (copiar y redistribuir) y adaptar (remezclar, transformar y construir a partir del material), incluso para fines comerciales.","Compartir (copiar i redistribuir) i adaptar (remesclar, transformar i construir a partir del material), fins i tot amb finalitats comercials."],["Se reconozca la autoría de la obra original de forma adecuada.","Es reconega l'autoria de l'obra original de manera adequada."]],[["Reconocimiento - Compartir Igual (BY-SA)","Reconeixement - Compartir Igual (BY-SA)"],["Compartir (copiar y redistribuir) y adaptar (remezclar, transformar y construir a partir del material), incluso para fines comerciales.","Compartir (copiar i redistribuir) i adaptar (remesclar, transformar i construir a partir del material), fins i tot amb finalitats comercials."],["Se reconozca la autoría de la obra original de forma adecuada. Se licencie la nueva creación (en su caso) bajo condiciones idénticas (BY-SA).","Es reconega l'autoria de l'obra original de manera adequada. Es llicencie la nova creació (si escau) en condicions idèntiques (BY-SA)."]],[["Reconocimiento - Sin Obra Derivada (BY-ND)","Reconeixement - Sense Obra Derivada (BY-ND)"],["Compartir (copiar y redistribuir) el material, incluso para fines comerciales.","Compartir (copiar i redistribuir) el material, fins i tot amb finalitats comercials."],["Se reconozca la autoría de la obra original de forma adecuada. No se distribuyan modificaciones de la obra original.","Es reconega l'autoria de l'obra original de manera adequada. No es distribuïsquen modificacions de l'obra original."]],[["Reconocimiento - No Comercial (BY-NC)","Reconeixement - No Comercial (BY-NC)"],["Compartir (copiar y redistribuir) y adaptar (remezclar, transformar y construir a partir del material).","Compartir (copiar i redistribuir) i adaptar (remesclar, transformar i construir a partir del material)."],["Se reconozca la autoría de la obra original de forma adecuada. No se utilice con propósitos comerciales.","Es reconega l'autoria de l'obra original de manera adequada. No s'utilitze amb propòsits comercials."]],[["Reconocimiento - No Comercial - Compartir Igual (BY-NC-SA)","Reconeixement - No Comercial - Compartir Igual (BY-NC-SA)"],["Compartir (copiar y redistribuir) y adaptar (remezclar, transformar y construir a partir del material).","Compartir (copiar i redistribuir) i adaptar (remesclar, transformar i construir a partir del material)."],["Se reconozca la autoría de la obra original de forma adecuada. No se utilice con propósitos comerciales. Se licencie la nueva creación (en su caso) bajo condiciones idénticas (BY-NC-SA).","Es reconega l'autoria de l'obra original de manera adequada. No s'utilitze amb propòsits comercials. Es llicencie la nova creació (si escau) en condicions idèntiques (BY-NC-SA)."]],[["Reconocimiento - No Comercial - Sin Obra Derivada (BY-NC-ND)","Reconeixement - No Comercial - Sense Obra Derivada (BY-NC-ND)"],["Compartir (copiar y redistribuir) el material.","Compartir (copiar i redistribuir) el material."],["Reconozca la autoría de la obra original de forma adecuada. No se utilice con propósitos comerciales. No se distribuyan modificaciones de la obra original.","Es reconega l'autoria de l'obra original de manera adequada. No s'utilitze amb propòsits comercials. No es distribuïsquen modificacions de l'obra original."]]]},{"t":"p","x":["Tabla transcrita de la infografía «Licencias Creative Commons» del manual (CEDEC; fuente: creativecommons.org).","Taula transcrita de la infografia «Licencias Creative Commons» del manual (CEDEC; font: creativecommons.org)."]},{"t":"links","title":null,"items":[{"i":"cc","x":["Licencias Creative Commons","Llicències Creative Commons"],"d":["Lista oficial de licencias y sus condiciones.","Llista oficial de llicències i les seues condicions."],"url":"https://creativecommons.org/licenses/?lang=es"},{"i":"check","x":["Elegir una licencia CC","Triar una llicència CC"],"d":["Asistente oficial de Creative Commons para escoger la licencia de una obra.","Assistent oficial de Creative Commons per a triar la llicència d'una obra."],"url":"https://creativecommons.org/chooser/"},{"i":"gavel","x":["Ley de Propiedad Intelectual","Llei de Propietat Intel·lectual"],"d":["Real Decreto Legislativo 1/1996 (texto consolidado, BOE).","Reial decret legislatiu 1/1996 (text consolidat, BOE, en castellà)."],"url":"https://www.boe.es/buscar/act.php?id=BOE-A-1996-8930"},{"i":"book","x":["CEDEC (INTEF)","CEDEC (INTEF)"],"d":["Centro Nacional de Desarrollo Curricular en Sistemas no Propietarios: guías y REA.","Centre Nacional de Desenvolupament Curricular en Sistemes no Propietaris: guies i REA (en castellà)."],"url":"https://cedec.intef.es/"}]}],"acts":["S8-cc","S8-A7","S8-A7bis"],"videos":[]},{"num":6,"kind":"selfcheck","title":["Autoevaluación · Evaluación final del RA2","Autoavaluació · Avaluació final del RA2"],"nodes":[{"t":"p","x":["Completa el siguiente texto de repaso sustituyendo cada hueco numerado por el término más adecuado, seleccionándolo de la lista de palabras propuesta a continuación.","Completa el text de repàs següent substituint cada buit numerat pel terme més adequat, seleccionant-lo de la llista de paraules proposada a continuació."]},{"t":"p","x":["Banco de palabras: motores de búsqueda · avanzada · formatos · dispositivos · metadatos · catalogación · curación de contenidos · fiabilidad · usabilidad · repositorio · accesibilidad universal · subtítulos · formatos estandarizados · entornos colaborativos · privacidad · protección de datos · calidad · didácticos · técnicos · científicos · reproducción · distribución · comunicación pública · Creative Commons · dominio público. Cada término se usa una sola vez.","Banc de paraules: motors de cerca · avançada · formats · dispositius · metadades · catalogació · curació de continguts · fiabilitat · usabilitat · repositori · accessibilitat universal · subtítols · formats estandarditzats · entorns col·laboratius · privacitat · protecció de dades · qualitat · didàctics · tècnics · científics · reproducció · distribució · comunicació pública · Creative Commons · domini públic. Cada terme s'usa una sola vegada."]}],"acts":["S8-EVAL"],"videos":[]}],"final":[],"acts":[{"id":"S8-cc","type":"match","time":["6 min","6 min"],"title":["Cada licencia, su condición clave","Cada llicència, la seua condició clau"],"instr":["Relaciona cada licencia Creative Commons con lo que la distingue según la tabla del manual.","Relaciona cada llicència Creative Commons amb allò que la distingeix segons la taula del manual."],"pairs":[{"a":["BY","BY"],"b":["Solo exige reconocer la autoría; permite incluso el uso comercial y las obras derivadas","Només exigeix reconéixer l'autoria; permet fins i tot l'ús comercial i les obres derivades"],"exp":["Reconocimiento (BY).","Reconeixement (BY)."]},{"a":["BY-SA","BY-SA"],"b":["La nueva creación debe licenciarse en condiciones idénticas","La nova creació s'ha de llicenciar en condicions idèntiques"],"exp":["Compartir Igual.","Compartir Igual."]},{"a":["BY-ND","BY-ND"],"b":["No se pueden distribuir modificaciones, pero sí compartir con fines comerciales","No es poden distribuir modificacions, però sí compartir amb finalitats comercials"],"exp":["Sin Obra Derivada.","Sense Obra Derivada."]},{"a":["BY-NC","BY-NC"],"b":["Permite adaptar, pero no usar con propósitos comerciales","Permet adaptar, però no usar amb propòsits comercials"],"exp":["No Comercial.","No Comercial."]},{"a":["BY-NC-SA","BY-NC-SA"],"b":["Sin uso comercial y la obra derivada con la misma licencia","Sense ús comercial i l'obra derivada amb la mateixa llicència"],"exp":["No Comercial - Compartir Igual.","No Comercial - Compartir Igual."]},{"a":["BY-NC-ND","BY-NC-ND"],"b":["Solo compartir: sin uso comercial ni modificaciones","Només compartir: sense ús comercial ni modificacions"],"exp":["La más restrictiva de las seis.","La més restrictiva de les sis."]}],"block":"S8","origin":"complementaria","ra":"RA2","ce":""},{"id":"S8-A7","type":"teacher","origin":"manual","time":["20 min","20 min"],"timeManual":["35 minutos","35 minuts"],"kind":["Prueba teórica y análisis de casos","Prova teòrica i anàlisi de casos"],"group":["Individual","Individual"],"mode":["Presencial o virtual","Presencial o virtual"],"ce":"k)","title":["Actividad 7. ¿Se ajusta a la normativa de propiedad intelectual?","Activitat 7. S'ajusta a la normativa de propietat intel·lectual?"],"instr":["Se te presentan tres situaciones distintas relacionadas con el uso de contenidos digitales en el aula: en la primera, un docente descarga un vídeo de una plataforma de contenidos audiovisuales y lo proyecta íntegramente en clase sin autorización del titular, con fines exclusivamente ilustrativos y sin ánimo de lucro; en la segunda, un docente emplea una imagen publicada bajo licencia Creative Commons que exige atribución, y la incorpora a su material didáctico sin citar la fuente ni al autor original; en la tercera, un docente utiliza un texto cuyos derechos de explotación económica han expirado, sin citar la fuente original. Analiza por escrito, para cada una de las tres situaciones, si el uso realizado se ajusta o no a la normativa de propiedad intelectual explicada en este epígrafe, justificando tu respuesta en cada caso.","Se't presenten tres situacions diferents relacionades amb l'ús de continguts digitals a l'aula: en la primera, un docent descarrega un vídeo d'una plataforma de continguts audiovisuals i el projecta íntegrament a classe sense autorització del titular, amb finalitats exclusivament il·lustratives i sense ànim de lucre; en la segona, un docent fa servir una imatge publicada amb llicència Creative Commons que exigeix atribució, i la incorpora al seu material didàctic sense citar la font ni l'autor original; en la tercera, un docent utilitza un text els drets d'explotació econòmica del qual han expirat, sense citar la font original. Analitza per escrit, per a cadascuna de les tres situacions, si l'ús fet s'ajusta o no a la normativa de propietat intel·lectual explicada en aquest epígraf, justificant la teua resposta en cada cas."],"fields":[["Primera situación (vídeo proyectado íntegramente): ¿se ajusta o no? Justificación.","Primera situació (vídeo projectat íntegrament): s'ajusta o no? Justificació."],["Segunda situación (imagen CC sin citar la fuente): ¿se ajusta o no? Justificación.","Segona situació (imatge CC sense citar la font): s'ajusta o no? Justificació."],["Tercera situación (texto en dominio público sin citar): ¿se ajusta o no? Justificación.","Tercera situació (text en domini públic sense citar): s'ajusta o no? Justificació."]],"solution":[["Primera situación. El uso realizado no se ajusta a la normativa de propiedad intelectual. Aunque la finalidad sea ilustrativa y carezca de ánimo de lucro, la proyección íntegra de un vídeo protegido sin autorización del titular excede los límites legales aplicables al ámbito educativo, que exigen que el uso se limite a lo estrictamente necesario para el objetivo perseguido y no a la reproducción completa de la obra. Además, no se cita la fuente ni al autor, requisito exigido salvo que resulte imposible.","Primera situació. L'ús fet no s'ajusta a la normativa de propietat intel·lectual. Encara que la finalitat siga il·lustrativa i no tinga ànim de lucre, la projecció íntegra d'un vídeo protegit sense autorització del titular excedeix els límits legals aplicables a l'àmbit educatiu, que exigeixen que l'ús es limite al que és estrictament necessari per a l'objectiu perseguit i no a la reproducció completa de l'obra. A més, no se cita la font ni l'autor, requisit exigit llevat que resulte impossible."],["Segunda situación. El uso tampoco se ajusta a la normativa, pese a tratarse de un contenido publicado bajo licencia abierta. Las licencias de tipo Creative Commons que exigen atribución obligan a citar la fuente y la autoría original como condición para el uso autorizado; al omitir esta atribución, el docente incumple una de las condiciones esenciales de la licencia bajo la que se publicó la imagen, con independencia de que el uso educativo en sí mismo estuviera permitido.","Segona situació. L'ús tampoc no s'ajusta a la normativa, tot i tractar-se d'un contingut publicat amb llicència oberta. Les llicències de tipus Creative Commons que exigeixen atribució obliguen a citar la font i l'autoria original com a condició per a l'ús autoritzat; en ometre aquesta atribució, el docent incompleix una de les condicions essencials de la llicència amb què es va publicar la imatge, amb independència que l'ús educatiu en si mateix estiguera permés."],["Tercera situación. El uso sí se ajusta a la normativa. Al tratarse de una obra en dominio público, cuyos derechos de explotación económica han expirado, puede emplearse libremente sin necesidad de autorización ni de atribución obligatoria. No obstante, aunque no constituya un incumplimiento normativo, se recomienda como buena práctica pedagógica y ética citar la fuente y la autoría original cuando esta sea conocida.","Tercera situació. L'ús sí que s'ajusta a la normativa. En tractar-se d'una obra en domini públic, els drets d'explotació econòmica de la qual han expirat, es pot emprar lliurement sense necessitat d'autorització ni d'atribució obligatòria. No obstant això, encara que no constituïsca un incompliment normatiu, es recomana com a bona pràctica pedagògica i ètica citar la font i l'autoria original quan siga coneguda."]],"block":"S8","ra":"RA2"},{"id":"S8-A7bis","solution":[["Primera situación. No se ajusta a la normativa. El hecho de que la finalidad sea educativa no exime de la obligación de citar la fuente y comprobar la licencia; usar imágenes sin verificar su procedencia expone al docente a un uso no autorizado de obras protegidas.","Primera situació. No s'ajusta a la normativa. El fet que la finalitat siga educativa no eximeix de l'obligació de citar la font i comprovar la llicència; usar imatges sense verificar-ne la procedència exposa el docent a un ús no autoritzat d'obres protegides."],["Segunda situación. Sí se ajusta a la normativa. Se cumple la condición de atribución exigida por la licencia, y el reparto gratuito del material respeta la prohibición de uso comercial asociada a esa licencia.","Segona situació. Sí que s'ajusta a la normativa. Es compleix la condició d'atribució exigida per la llicència, i el repartiment gratuït del material respecta la prohibició d'ús comercial associada a aquesta llicència."],["Tercera situación. Sí se ajusta a la normativa, en la medida en que se trata de una obra en dominio público y, por tanto, no exige autorización ni atribución obligatoria; no obstante, sigue siendo recomendable citar la fuente como buena práctica, aunque su ausencia no constituya en este caso una infracción.","Tercera situació. Sí que s'ajusta a la normativa, en la mesura que es tracta d'una obra en domini públic i, per tant, no exigeix autorització ni atribució obligatòria; no obstant això, continua sent recomanable citar la font com a bona pràctica, encara que la seua absència no constituïsca en aquest cas una infracció."]],"type":"teacher","origin":"manual","time":["Fuera de la sesión (actividad alternativa o de refuerzo)","Fora de la sessió (activitat alternativa o de reforç)"],"timeManual":["35 minutos","35 minuts"],"kind":["Prueba teórica y análisis de casos","Prova teòrica i anàlisi de casos"],"group":["Individual","Individual"],"mode":["Presencial o virtual","Presencial o virtual"],"ce":"k)","title":["Actividad 7 bis. Tres nuevos casos","Activitat 7 bis. Tres casos nous"],"instr":["Se te presentan tres situaciones distintas relacionadas con el uso de contenidos digitales en el aula: en la primera, una docente incorpora a su material didáctico varias fotografías de maquinaria industrial encontradas en internet, sin comprobar su licencia ni citar procedencia alguna, argumentando que su finalidad es exclusivamente educativa; en la segunda, un docente emplea una infografía publicada bajo licencia Creative Commons que exige atribución y prohíbe usos comerciales, y la incorpora a un material que reparte gratuitamente entre su alumnado citando correctamente la fuente y la autoría; en la tercera, una docente adapta un texto técnico publicado hace más de un siglo, cuyos derechos de explotación económica han expirado, sin mencionar la fuente original. Analiza por escrito, para cada una de las tres situaciones, si el uso realizado se ajusta o no a la normativa de propiedad intelectual explicada en este epígrafe, justificando tu respuesta en cada caso.","Se't presenten tres situacions diferents relacionades amb l'ús de continguts digitals a l'aula: en la primera, una docent incorpora al seu material didàctic diverses fotografies de maquinària industrial trobades a internet, sense comprovar-ne la llicència ni citar-ne cap procedència, i argumenta que la seua finalitat és exclusivament educativa; en la segona, un docent fa servir una infografia publicada amb llicència Creative Commons que exigeix atribució i prohibeix usos comercials, i la incorpora a un material que reparteix gratuïtament entre el seu alumnat citant correctament la font i l'autoria; en la tercera, una docent adapta un text tècnic publicat fa més d'un segle, els drets d'explotació econòmica del qual han expirat, sense esmentar la font original. Analitza per escrit, per a cadascuna de les tres situacions, si l'ús fet s'ajusta o no a la normativa de propietat intel·lectual explicada en aquest epígraf, justificant la teua resposta en cada cas."],"fields":[["Primera situación (fotografías de maquinaria sin comprobar la licencia).","Primera situació (fotografies de maquinària sense comprovar la llicència)."],["Segunda situación (infografía CC BY-NC citada en material gratuito).","Segona situació (infografia CC BY-NC citada en material gratuït)."],["Tercera situación (texto técnico de hace más de un siglo sin citar la fuente).","Tercera situació (text tècnic de fa més d'un segle sense citar la font)."]],"block":"S8","ra":"RA2"},{"id":"S8-EVAL","type":"fill","origin":"manual","time":["18 min","18 min"],"title":["Evaluación final del RA2 (autoevaluación del manual)","Avaluació final del RA2 (autoavaluació del manual)"],"kind":["Texto de repaso con huecos y banco de palabras","Text de repàs amb buits i banc de paraules"],"group":["Individual","Individual"],"items":[{"x":["La búsqueda eficaz de contenidos digitales educativos comienza por identificar los ___ más adecuados a cada finalidad,","La cerca eficaç de continguts digitals educatius comença per identificar els ___ més adequats a cada finalitat,"],"opts":[["accesibilidad universal","accessibilitat universal"],["avanzada","avançada"],["calidad","qualitat"],["catalogación","catalogació"],[       toast(t("needId")); window.scrollTo(0, 0);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group");
      if (el) { var dd = el.closest("details"); if (dd) dd.open = true; el.focus(); }
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport(scope) {
    REP = scope && scope.k ? scope : null;
    if (validReport()) openOv("report");
  }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");
    var old = document.title; document.title = "Informe_" + (M.short || "Web") + "_" + (REP ? REP.id : t("day") + C.day) + "_" + slug(S.student.name);
    window.print();
    setTimeout(function () {
      document.title = old; document.body.classList.remove("print-report");
      if (fo && pv) { pv.style.display = "none"; fo.style.display = ""; }
    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();
        try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-report"); });

  // API mínima per a proves automàtiques
  window.PRL = { state: function () { return S; }, report: function () { return reportPlain(collect()); }, go: go, setLang: setLang };
  render();
})();

</script>
